<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
const norm=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").toLowerCase();
const vt=fn=>fn();
let cfg=Object.assign({theme:"auto",tmdb:"",omdb:"",autonext:true},store.get("cfg",{}));
const DEFAULT_TMDB="3309069624518eb702e51e01c9ad58f8";if(!cfg.tmdb)cfg.tmdb=DEFAULT_TMDB;if(!cfg.omdb)cfg.omdb="8299aee2";
const saveCfg=()=>{store.set("cfg",cfg);applyTheme()};
function applyTheme(){document.documentElement.dataset.theme=cfg.theme;const dark=cfg.theme=="dark"||(cfg.theme=="auto"&&matchMedia("(prefers-color-scheme:dark)").matches);document.querySelector('meta[name=theme-color]').content=dark?"#000000":"#f2f2f7"}
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",applyTheme);applyTheme();

/* ---------- HỆ THỐNG NGUỒN PHIM NHÚNG (KKPHIM & NGUONC) ---------- */
const PROVIDERS=[
  {
    id:"kkphim",
    name:"KKPhim Mới",
    type:"kkphim",
    latestUrl:()=>"https://phimapi.com/danh-sach/phim-moi-cap-nhat?page=1",
    searchUrl:kw=>`https://phimapi.com/v1/api/tim-kiem?keyword=${encodeURIComponent(kw)}&limit=18`,
    detailUrl:slug=>`https://phimapi.com/phim/${slug}`,
    imgPrefix:"https://phimimg.com/"
  },
  {
    id:"kk_bo",
    name:"Phim Bộ VIP",
    type:"kkphim",
    latestUrl:()=>"https://phimapi.com/v1/api/danh-sach/phim-bo?page=1&limit=20",
    searchUrl:kw=>`https://phimapi.com/v1/api/tim-kiem?keyword=${encodeURIComponent(kw)}&limit=18`,
    detailUrl:slug=>`https://phimapi.com/phim/${slug}`,
    imgPrefix:"https://phimimg.com/"
  },
  {
    id:"kk_le",
    name:"Phim Lẻ / Rạp",
    type:"kkphim",
    latestUrl:()=>"https://phimapi.com/v1/api/danh-sach/phim-le?page=1&limit=20",
    searchUrl:kw=>`https://phimapi.com/v1/api/tim-kiem?keyword=${encodeURIComponent(kw)}&limit=18`,
    detailUrl:slug=>`https://phimapi.com/phim/${slug}`,
    imgPrefix:"https://phimimg.com/"
  },
  {
    id:"kk_anime",
    name:"Hoạt Hình / Anime",
    type:"kkphim",
    latestUrl:()=>"https://phimapi.com/v1/api/danh-sach/hoat-hinh?page=1&limit=20",
    searchUrl:kw=>`https://phimapi.com/v1/api/tim-kiem?keyword=${encodeURIComponent(kw)}&limit=18`,
    detailUrl:slug=>`https://phimapi.com/phim/${slug}`,
    imgPrefix:"https://phimimg.com/"
  },
  {
    id:"nguonc",
    name:"NguonC Hub",
    type:"nguonc",
    latestUrl:()=>"https://phim.nguonc.com/api/films/phim-moi-cap-nhat?page=1",
    searchUrl:kw=>`https://phim.nguonc.com/api/films/search?keyword=${encodeURIComponent(kw)}`,
    detailUrl:slug=>`https://phim.nguonc.com/api/film/${slug}`,
    imgPrefix:""
  }
];

const searchCache=new Map(),detailCache=new Map();
async function fetchWithTimeout(url,ms=4500){
  const ctrl=new AbortController(),id=setTimeout(()=>ctrl.abort(),ms);
  try{const res=await fetch(url,{signal:ctrl.signal});clearTimeout(id);return await res.json()}catch(e){clearTimeout(id);throw e}
}
async function fetchFromProvider(provider,keyword=""){
  const ck=`${provider.id}:${keyword||"latest"}`;
  if(searchCache.has(ck))return searchCache.get(ck);
  try{
    const url=keyword?provider.searchUrl(keyword):provider.latestUrl();
    const json=await fetchWithTimeout(url,4500);
    const rawItems=json?.data?.items||json?.items||[];
    const imgDomain=json?.data?.APP_DOMAIN_CDN_IMAGE?(json.data.APP_DOMAIN_CDN_IMAGE.endsWith("/")?json.data.APP_DOMAIN_CDN_IMAGE:json.data.APP_DOMAIN_CDN_IMAGE+"/"):provider.imgPrefix;
    const items=rawItems.map(it=>{
      let thumb=it.poster_url||it.thumb_url||"";
      if(thumb&&!thumb.startsWith("http"))thumb=imgDomain+thumb;
      return{title:it.name,originTitle:it.origin_name||it.original_name||"",slug:it.slug,year:it.year||"",thumb,providerId:provider.id,providerName:provider.name};
    });
    const resObj={provider,items};searchCache.set(ck,resObj);return resObj;
  }catch{return{provider,items:[],error:true}}
}
async function rescueKkphimM3u8(slug,title){
  try{
    const d=await fetchWithTimeout(`https://phimapi.com/phim/${slug}`,3500);
    if(d?.episodes?.length&&d.episodes[0]?.server_data?.length)return d.episodes.map(s=>({server_name:`⚡ KKPhim (${s.server_name})`,server_data:s.server_data}));
  }catch{}
  if(!title)return[];
  try{
    const s=await fetchWithTimeout(`https://phimapi.com/v1/api/tim-kiem?keyword=${encodeURIComponent(title)}&limit=1`,3500);
    const first=s?.data?.items?.[0];
    if(first?.slug){
      const d2=await fetchWithTimeout(`https://phimapi.com/phim/${first.slug}`,3500);
      if(d2?.episodes?.length)return d2.episodes.map(srv=>({server_name:`⚡ KKPhim (${srv.server_name})`,server_data:srv.server_data}));
    }
  }catch{}
  return[];
}
async function fetchProviderMovieDetail(providerId,slug,fallbackTitle=""){
  const ck=`${providerId}:${slug}`;
  if(detailCache.has(ck))return detailCache.get(ck);
  const provider=PROVIDERS.find(p=>p.id===providerId)||PROVIDERS[0];
  const data=await fetchWithTimeout(provider.detailUrl(slug),4500);
  const movie=data.movie||data?.data?.item||{};
  const title=movie.name||fallbackTitle||"Phim";
  let servers=[];
  if(provider.type==="nguonc"){
    const rescued=await rescueKkphimM3u8(slug,title);
    const nguoncSrv=(movie.episodes||[]).map(s=>({
      server_name:`🔗 NguonC (${s.server_name})`,
      server_data:(s.items||[]).map(ep=>({name:ep.name,link_m3u8:ep.m3u8||"",link_embed:ep.embed||""}))
    }));
    servers=[...rescued,...nguoncSrv];
  }else{
    const rawEps=data.episodes||data?.data?.item?.episodes||[];
    servers=rawEps.map(s=>({server_name:`⚡ ${s.server_name}`,server_data:s.server_data||[]}));
  }
  let thumb=movie.poster_url||movie.thumb_url||"";
  if(thumb&&!thumb.startsWith("http"))thumb=provider.imgPrefix+thumb;
  let backdrop=movie.thumb_url||movie.poster_url||thumb;
  if(backdrop&&!backdrop.startsWith("http"))backdrop=provider.imgPrefix+backdrop;
  const res={movie,title,originTitle:movie.origin_name||movie.original_name||"",overview:movie.content||movie.description||"",year:movie.year||"",thumb,backdrop,servers,providerId,slug};
  detailCache.set(ck,res);
  return res;
}
async function findStreamForTmdb(viTitle,origTitle){
  const queries=[viTitle,origTitle].filter(Boolean);
  for(const q of queries){
    const [kk,ng]=await Promise.all([fetchFromProvider(PROVIDERS[0],q),fetchFromProvider(PROVIDERS[4],q)]);
    const combined=[...kk.items,...ng.items];
    if(combined.length){
      const nq=norm(q);
      const best=combined.find(x=>norm(x.title).includes(nq)||norm(x.originTitle).includes(nq))||combined[0];
      try{
        const det=await fetchProviderMovieDetail(best.providerId,best.slug,best.title);
        if(det.servers.length&&det.servers[0].server_data?.length)return det;
      }catch{}
    }
  }
  return null;
}

/* ---------- TMDB ---------- */
const IMG="https://image.tmdb.org/t/p/";
async function tmdb(path,q={}){
  if(!cfg.tmdb)throw new Error("nokey");
  const u=new URL("https://api.themoviedb.org/3"+path);u.searchParams.set("language","vi-VN");
  const h={};if(cfg.tmdb.startsWith("eyJ"))h.Authorization="Bearer "+cfg.tmdb;else u.searchParams.set("api_key",cfg.tmdb);
  for(const k in q)u.searchParams.set(k,q[k]);
  const r=await fetch(u,{headers:h});if(!r.ok)throw new Error(r.status);return r.json();
}
const cache=new Map();const ctmdb=(p,q)=>{const k=p+JSON.stringify(q||{});if(!cache.has(k))cache.set(k,tmdb(p,q).catch(e=>{cache.delete(k);throw e}));return cache.get(k)};
const ROWS=[

let LIB=null,libFilter="all";
async function loadLib(){
  if(LIB&&LIB.length)return LIB;
  const cached=store.get("cg_lib_cache",[]);
  if(cached.length)LIB=cached;
  const res=await Promise.all(PROVIDERS.map(p=>fetchFromProvider(p,"")));
  const items=[],seen=new Set();
  res.forEach(r=>r.items.forEach(it=>{const k=`${it.providerId}:${it.slug}`;if(!seen.has(k)){seen.add(k);items.push(it)}}));
  if(items.length){LIB=items;store.set("cg_lib_cache",items)}
  return LIB||[];
}
function renderLibGrid(){

   if(d.length)h+=`<h2>Kết quả TMDB</h2><div class="grid">${d.map(m=>cardHTML(m)).join("")}</div>`}catch{}}

let YTP=null,ytTimer=null,ytMeta=null,ytReady=null;
function loadYT(){return ytReady||(ytReady=new Promise(res=>{if(window.YT&&YT.Player)return res();window.onYouTubeIframeAPIReady=res;const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";document.head.appendChild(s)}))}
function ytSave(){try{if(!YTP||!ytMeta||!YTP.getDuration)return;const d=YTP.getDuration(),t=YTP.getCurrentTime();if(!d||!(t>=0))return;const p=store.get("ytprog",{});if(t>d-15)delete p[ytMeta.k];else p[ytMeta.k]={t,d,title:ytMeta.title,img:ytMeta.img,type:ytMeta.k.split(":")[0],id:ytMeta.k.split(":")[1],u:Date.now()};store.set("ytprog",p)}catch{}}
async function ytPlay(key,k,title,img,start){
  await loadYT();ytMeta={k,title,img};clearInterval(ytTimer);
  YTP=new YT.Player("ytp",{videoId:key,width:"100%",height:"100%",playerVars:{autoplay:1,playsinline:1,rel:0,start:Math.floor(start||0),origin:location.origin},events:{onStateChange:e=>{if(e.data==2||e.data==0)ytSave()}}});
  ytTimer=setInterval(ytSave,3000);
}
function ytStop(){ytSave();clearInterval(ytTimer);try{YTP?.destroy()}catch{}YTP=null}
addEventListener("pagehide",ytSave);document.addEventListener("visibilitychange",()=>{if(document.hidden)ytSave()});

function renderStreamBox(det,sIdx=0,eIdx=0){
  activeStreamData=det;
  const box=$("#streamBox");if(!box)return;
  if(!det||!det.servers||!det.servers.length){
    box.innerHTML=`<div class="note" style="margin:0 0 10px">Chưa tìm thấy luồng phát trực tiếp cho phim này trên KKPhim / NguonC.</div>`;
    return;
  }
  activeSrvIdx=sIdx<det.servers.length?sIdx:0;
  const eps=det.servers[activeSrvIdx]?.server_data||[];
  activeEpIdx=eIdx<eps.length?eIdx:0;
  box.innerHTML=`
    <b>Chọn Server (${det.servers.length})</b>
    <div class="prov" id="srvList">${det.servers.map((s,i)=>`<button class="${i===activeSrvIdx?"on":""}" data-sidx="${i}">${esc(s.server_name)}</button>`).join("")}</div>
    <b>Danh sách tập (${eps.length})</b>
    <div class="ep-grid" id="epGrid">${eps.map((ep,i)=>`<button class="${i===activeEpIdx?"on":""}" data-eidx="${i}">Tập ${esc(ep.name)}</button>`).join("")}</div>
  `;
  const playBtn=$("#playStreamBtn");
  if(playBtn){
    playBtn.innerHTML=`🎬 Xem phim (Tập ${esc(eps[activeEpIdx]?.name||"1")})`;
    playBtn.onclick=()=>startStreamFromDetail(activeSrvIdx,activeEpIdx);
  }
  $("#srvList").onclick=e=>{const b=e.target.closest("[data-sidx]");if(b)renderStreamBox(det,+b.dataset.sidx,0)};
  $("#epGrid").onclick=e=>{const b=e.target.closest("[data-eidx]");if(b){renderStreamBox(det,activeSrvIdx,+b.dataset.eidx);startStreamFromDetail(activeSrvIdx,+b.dataset.eidx)}};
}

function startStreamFromDetail(sIdx,eIdx,resumeTime=0){
  if(!activeStreamData||!activeStreamData.servers[sIdx])return;
  const srv=activeStreamData.servers[sIdx];
  const epList=(srv.server_data||[]).map((ep,i)=>({
    identifier:`${activeStreamData.providerId}:${activeStreamData.slug}`,
    providerId:activeStreamData.providerId,
    slug:activeStreamData.slug,
    sIdx,
    eIdx:i,
    title:activeStreamData.title,
    epName:ep.name||String(i+1),
    img:activeStreamData.backdrop||activeStreamData.thumb,
    m3u8:ep.link_m3u8||"",
    embed:ep.link_embed||"",
    resumeTime:i===eIdx?resumeTime:0
  }));
  if(!epList.length)return;
  ytStop();
  openPlayer(epList,eIdx);
}

}

document.addEventListener("click",e=>{
  const pc=e.target.closest("[data-prov]");if(pc){openProviderDetail(pc.dataset.prov,pc.dataset.slug,pc.dataset.title,pc.dataset.thumb);return}
  const c=e.target.closest(".card[data-id],.hero[data-id]");if(c){openDetail(c.dataset.t,c.dataset.id);return}
  const rs=e.target.closest("[data-resume]");if(rs){const[t,i]=rs.dataset.resume.split(":");openDetail(t,i,true);return}
  const p=e.target.closest("[data-play]");if(p){
    const pr=store.get("prog",{})[p.dataset.play];
    if(pr&&pr.providerId&&pr.slug)openProviderDetail(pr.providerId,pr.slug,pr.title,pr.img,pr.sIdx||0,pr.eIdx||0,pr.t||0);
  }
});

/* ---------- Player (Tích hợp HLS M3U8 & VIP Embed) ---------- */
const V=$("#v"),EMB=$("#emb"),P=$("#player");let list=[],idx=0,idle,saveT=0,hlsInstance=null,playerMode="m3u8";
const fmt=s=>{s=Math.max(0,s|0);const h=s/3600|0,m=(s%3600)/60|0;return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s%60).padStart(2,"0")};
function toast(t,ms=2500){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),ms)}

async function openPlayer(l,i){list=l;idx=i;P.classList.add("show");await loadItem()}

function startEmbedInPlayer(it){
  playerMode="embed";
  $("#modeBtn").textContent="Chế độ: VIP";
  if(hlsInstance){hlsInstance.destroy();hlsInstance=null}
  V.pause();V.style.display="none";
  $("#midCtl").style.display="none";$("#seekRow").style.visibility="hidden";
  let url=it.embed;
  if((!url||url.includes("streamc.xyz"))&&it.m3u8)url=`https://player.phimapi.com/player/?url=${encodeURIComponent(it.m3u8)}`;
  EMB.style.display="block";EMB.src=url||"about:blank";
  toast("Đang phát chế độ VIP Iframe");
  wake();
}

async function loadItem(){
  const it=list[idx];if(!it)return;
  $("#pt").textContent=`${it.title}${it.epName?" · Tập "+it.epName:""}`;
  toast("Đang tải luồng phim…",5000);
  const pr=store.get("prog",{})[it.identifier];
  const resumeSec=it.resumeTime||((pr&&pr.eIdx===it.eIdx&&pr.sIdx===it.sIdx&&pr.t>10)?pr.t:0);

  if(playerMode==="embed"||(!it.m3u8&&it.embed)){
    startEmbedInPlayer(it);
    save();
    return;
  }

  EMB.src="about:blank";EMB.style.display="none";
  V.style.display="block";$("#midCtl").style.display="flex";$("#seekRow").style.visibility="visible";
  $("#modeBtn").textContent="Chế độ: M3U8";

  if(Hls.isSupported()){
    if(hlsInstance)hlsInstance.destroy();
    hlsInstance=new Hls({maxBufferLength:10,startFragPrefetch:true});
    hlsInstance.loadSource(it.m3u8);
    hlsInstance.attachMedia(V);
    hlsInstance.on(Hls.Events.MANIFEST_PARSED,()=>{
      if(resumeSec>10){V.currentTime=resumeSec;toast("Tiếp tục từ "+fmt(resumeSec))}else toast("Bắt đầu phát Tập "+it.epName);
      V.play().catch(()=>{});
    });
    hlsInstance.on(Hls.Events.ERROR,(_,data)=>{
      if(data.fatal){
        if(it.embed){toast("Chuyển sang luồng VIP dự phòng…");startEmbedInPlayer(it)}
        else toast("Luồng phim hiện tại bị lỗi, hãy đổi Server khác.");
      }
    });
  }else if(V.canPlayType("application/vnd.apple.mpegurl")){
    V.src=it.m3u8;
    V.onloadedmetadata=()=>{
      if(resumeSec>10){V.currentTime=resumeSec;toast("Tiếp tục từ "+fmt(resumeSec))}else toast("Bắt đầu phát Tập "+it.epName);
    };
    await V.play().catch(()=>{if(it.embed)startEmbedInPlayer(it)});
  }else if(it.embed){
    startEmbedInPlayer(it);
  }
  wake();
}

function save(){
  const it=list[idx];if(!it)return;
  const p=store.get("prog",{});
  p[it.identifier]={
    t:playerMode==="m3u8"?V.currentTime:(it.resumeTime||15),
    d:playerMode==="m3u8"?(V.duration||0):0,
    title:it.title,
    epName:it.epName,
    img:it.img,
    providerId:it.providerId,
    slug:it.slug,
    sIdx:it.sIdx,
    eIdx:it.eIdx,
    u:Date.now()
  };
  store.set("prog",p);
}
function closePlayer(){
  save();
  if(hlsInstance){hlsInstance.destroy();hlsInstance=null}
  V.pause();V.removeAttribute("src");V.load();
  EMB.src="about:blank";EMB.style.display="none";
  if(document.fullscreenElement)document.exitFullscreen?.();
  P.classList.remove("show");
  if(tab=="home"||tab=="lib")go(tab);
}
function wake(){P.classList.remove("idle");clearTimeout(idle);if(!V.paused||playerMode==="embed")idle=setTimeout(()=>P.classList.add("idle"),3200)}
const setIcon=()=>$("#ppi").innerHTML=V.paused?'<path d="M8 5v14l11-7z"/>':'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
V.onplay=V.onpause=()=>{setIcon();wake();save()};
V.ontimeupdate=()=>{if(V.duration){$("#sk").value=V.currentTime/V.duration*1000;$("#tc").textContent=fmt(V.currentTime);$("#td").textContent=fmt(V.duration)}if(Date.now()-saveT>3000){saveT=Date.now();save()}};
V.onended=()=>{if(cfg.autonext&&idx<list.length-1){toast("Tự chuyển sang: Tập "+list[idx+1].epName,3000);setTimeout(()=>{idx++;loadItem()},2000)}else P.classList.remove("idle")};
$("#sk").oninput=e=>{if(V.duration)V.currentTime=e.target.value/1000*V.duration;wake()};
$("#pp").onclick=()=>{V.paused?V.play():V.pause()};
$("#bk10").onclick=()=>{V.currentTime-=10;wake()};$("#fw10").onclick=()=>{V.currentTime+=10;wake()};
$("#pc").onclick=closePlayer;$("#pn").onclick=()=>{if(idx<list.length-1){save();idx++;loadItem()}else toast("Đã là tập cuối")};
const SP=[1,1.25,1.5,2,.75];$("#spd").onclick=()=>{const n=SP[(SP.indexOf(V.playbackRate)+1)%SP.length];V.playbackRate=n;$("#spd").textContent=n+"×"};
$("#modeBtn").onclick=()=>{
  const it=list[idx];if(!it)return;
  if(playerMode==="m3u8"){if(it.embed||it.m3u8)startEmbedInPlayer(it)}
  else if(it.m3u8){playerMode="m3u8";loadItem()}
};
$("#an").onclick=()=>{cfg.autonext=!cfg.autonext;saveCfg();$("#an").textContent="Tự chuyển: "+(cfg.autonext?"Bật":"Tắt")};$("#an").textContent="Tự chuyển: "+(cfg.autonext?"Bật":"Tắt");
$("#fs").onclick=()=>{if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else if(playerMode==="m3u8"&&V.webkitEnterFullscreen)V.webkitEnterFullscreen();else if(P.requestFullscreen)P.requestFullscreen().catch(()=>V.webkitEnterFullscreen?.());else if(P.webkitRequestFullscreen)P.webkitRequestFullscreen()};
V.addEventListener("dblclick",()=>$("#fs").click());
P.addEventListener("pointerdown",e=>{if(e.target==V||e.target==$("#ctl"))P.classList.contains("idle")?wake():(V.paused?wake():P.classList.add("idle"));else wake()});
document.addEventListener("keydown",e=>{if(!P.classList.contains("show"))return;if(e.key==" "){e.preventDefault();$("#pp").click()}if(e.key=="ArrowRight")V.currentTime+=10;if(e.key=="ArrowLeft")V.currentTime-=10;if(e.key=="f")$("#fs").click();if(e.key=="Escape"&&!document.fullscreenElement)closePlayer()});
addEventListener("pagehide",save);

go("home");
</script>
</body>
</html>
