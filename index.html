<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CineGlass</title>
<meta name="theme-color" content="#faf7fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CineGlass">
<link rel="preconnect" href="https://phimapi.com" crossorigin>
<link rel="preconnect" href="https://phim.nguonc.com" crossorigin>
<link rel="dns-prefetch" href="https://phimimg.com">
<link rel="dns-prefetch" href="https://image.tmdb.org">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<style>
:root{
  --bg:#faf7fa;
  --bg-mesh:radial-gradient(at 10% 6%,rgba(250,45,72,.10),transparent 50%),radial-gradient(at 90% 20%,rgba(255,122,89,.08),transparent 45%),radial-gradient(at 50% 92%,rgba(175,82,222,.08),transparent 55%);
  --card:rgba(255,255,255,.82);
  --text:#1c1c1e;--sub:#726e77;
  --glass-rgb:255,255,255;
  --pill-rgb:120,120,128;--pill-a:.18;
  --rim-hi:rgba(255,255,255,.95);--rim-lo:rgba(255,255,255,.45);
  --glass-shadow:0 10px 30px rgba(30,20,40,.14),0 1px 3px rgba(30,20,40,.08);
  --accent:#fa2d48;
  --accent-grad:linear-gradient(135deg,#ff375f 0%,#fa2d48 55%,#ff5e3a 100%);
  --line:rgba(250,45,72,.08);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --uikit:cubic-bezier(.32,.72,0,1);
  --ios-spring:cubic-bezier(.20,1.12,.32,1);
  --ios-bounce:cubic-bezier(.18,1.22,.34,1);
  --spring:cubic-bezier(.20,1.14,.32,1);
  --g:.02;
}
:root[data-theme=dark]{
  --bg:#0f0d13;
  --bg-mesh:radial-gradient(at 12% 8%,rgba(250,45,72,.16),transparent 52%),radial-gradient(at 88% 25%,rgba(191,90,242,.11),transparent 48%),radial-gradient(at 50% 90%,rgba(255,100,130,.09),transparent 58%);
  --card:rgba(32,28,40,.84);
  --text:#f5f5f7;--sub:#a19ca8;
  --glass-rgb:44,38,56;
  --pill-rgb:255,255,255;--pill-a:.16;
  --rim-hi:rgba(255,255,255,.55);--rim-lo:rgba(255,255,255,.22);
  --glass-shadow:0 12px 32px rgba(0,0,0,.52),0 1px 3px rgba(0,0,0,.38);
  --accent:#ff375f;--line:rgba(255,255,255,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
html,body{
  margin:0;background-color:var(--bg);background-image:var(--bg-mesh);
  color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  overflow-x:hidden;overscroll-behavior-x:none;-webkit-font-smoothing:antialiased;
}
body.playing,html.playing{background:#000!important;background-image:none!important}

#page{
  position:relative;z-index:26;
  padding:calc(var(--sat) + 12px) 0 calc(var(--sab) + 110px);
  min-height:100vh;min-height:100dvh;
  background-color:var(--bg);background-image:var(--bg-mesh);
  transform:translate3d(0,0,0);
  will-change:transform;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}

/* Lớp nền Pre-composited cho cử chỉ vuốt quay lại 120fps (Dùng visibility thay vì display:none để giữ nguyên texture trên GPU) */
#edgeBack{
  position:fixed;inset:0;z-index:24;pointer-events:none;
  visibility:hidden;overflow:hidden;
  contain:strict;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
#edgeBack.on{visibility:visible}
#edgePrev{
  position:absolute;inset:0;
  background-color:var(--bg);background-image:var(--bg-mesh);
  overflow:hidden;
  transform:translate3d(-30%,0,0);
  will-change:transform;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
#edgeDim{
  position:absolute;inset:0;background:rgba(0,0,0,.15);
  opacity:0;will-change:opacity;
}
/* Dải bóng đổ cạnh trang tách rời 100dvh siêu nhẹ (thay cho box-shadow trên #page dài 4000px) */
#edgeShadow{
  position:fixed;top:0;bottom:0;left:-24px;width:24px;z-index:27;
  pointer-events:none;visibility:hidden;
  background:linear-gradient(to right,transparent,rgba(0,0,0,.16));
  transform:translate3d(0,0,0);will-change:transform,opacity;
}
#edgeShadow.on{visibility:visible}

h1{font-size:34px;margin:8px 20px 14px;font-weight:800;background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;width:fit-content}
h2{font-size:21px;letter-spacing:-.4px;margin:26px 20px 10px;font-weight:700}
.sec-hd{display:flex;align-items:baseline;justify-content:space-between;margin:26px 20px 10px;gap:12px}
.sec-hd h2{margin:0}
.more-link{display:inline-flex;align-items:center;gap:3px;font-size:14px;font-weight:600;color:var(--accent);padding:4px 2px;transition:transform .35s var(--ios-bounce),opacity .2s}
.more-link:active{transform:translateX(4px) scale(.94);opacity:.75}
.more-link svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.scroller{display:flex;gap:13px;overflow-x:auto;padding:8px 20px 16px;scrollbar-width:none;align-items:flex-start;-webkit-overflow-scrolling:touch;contain:content}
.scroller::-webkit-scrollbar{display:none}
.card{position:relative;flex:0 0 128px;text-align:left;transition:transform .4s var(--ios-bounce);transform:translateZ(0)}
.card:active{transform:scale(.90)}
.card .p{display:block;width:128px;aspect-ratio:2/3;border-radius:18px;object-fit:cover;background:var(--card);border:.5px solid var(--line);box-shadow:0 4px 12px rgba(20,10,20,.07)}
.card b{margin-top:8px;font-size:13px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card small{color:var(--sub);font-size:12px}
.card.wide{flex-basis:230px}.card.wide .p{width:230px;aspect-ratio:16/10}
.sk{background:var(--card);border-radius:18px;flex:0 0 128px;aspect-ratio:2/3;border:.5px solid var(--line)}

/* Nhãn Coming Soon */
.cs-tag{
  position:absolute;top:8px;left:8px;z-index:2;
  padding:3px 8px;border-radius:9px;
  font-size:10px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;
  color:#fff;background:rgba(18,14,26,.88);
  border:.5px solid rgba(255,255,255,.22);
  box-shadow:0 2px 6px rgba(0,0,0,.22);
  pointer-events:none;
}
.btn.cs-btn{
  background:rgba(120,120,128,.22)!important;
  color:var(--sub)!important;
  border:1px dashed var(--line);
  cursor:default;
}

/* Nút "Xem thêm >" ở cuối mỗi hàng đề xuất */
.card.more-card{display:flex;flex-direction:column}
.card.more-card .more-box{
  width:128px;aspect-ratio:2/3;border-radius:18px;
  background:var(--card);border:1px solid var(--line);
  box-shadow:0 4px 14px rgba(250,45,72,.07),inset 0 1px 1px var(--rim-hi);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:14px;text-align:center;
  transition:transform .4s var(--ios-bounce);
}
.card.more-card:active .more-box{transform:scale(.90)}
.more-ic{
  width:46px;height:46px;border-radius:50%;
  background:var(--accent-grad);color:#fff;
  display:grid;place-items:center;
  box-shadow:0 5px 14px rgba(250,45,72,.28);
}
.more-ic svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.card.more-card .more-box b{margin:0;font-size:14px;font-weight:700;color:var(--accent)}
.card.more-card .more-box small{font-size:11.5px;color:var(--sub);line-height:1.25}

.cat-bar{display:flex;align-items:center;gap:10px;padding:4px 20px 6px}
.back-btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:8px 14px 8px 10px;border-radius:20px;
  background:var(--card);border:.5px solid var(--line);
  box-shadow:0 3px 10px rgba(0,0,0,.05);
  font-size:14px;font-weight:700;color:var(--accent);
  transition:transform .38s var(--ios-bounce);
}
.back-btn:active{transform:scale(.88)}
.back-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

.bar{position:relative;height:3.5px;background:rgba(120,120,128,.22);border-radius:4px;margin-top:6px;overflow:hidden}.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent-grad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px;padding:8px 20px;contain:layout style}
.grid .card{flex:none}.grid .card .p{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 20px}
.chip{padding:8px 14px;border-radius:18px;background:var(--card);border:.5px solid var(--line);font-size:13.5px;font-weight:600;transition:transform .38s var(--ios-bounce)}
.chip:active{transform:scale(.90)}
.chip.on{background:var(--accent-grad);color:#fff;border-color:transparent}
.search{margin:0 20px 8px;display:flex;gap:8px;align-items:center;border-radius:16px;padding:11px 14px;background:var(--card);border:.5px solid var(--line)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font-size:17px}
.list{margin:0 20px 16px;border-radius:24px;background:var(--card);border:.5px solid var(--line);overflow:hidden}
.list>div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:.5px solid var(--line)}
.list>div:last-child{border-bottom:0}
.list input[type=text],.list input[type=password]{background:none;border:0;outline:0;color:var(--text);text-align:right;flex:1;min-width:0;font-size:15px}
.list input[type=range]{flex:1;accent-color:var(--accent)}
.seg{display:flex;gap:4px;padding:3px;border-radius:12px;background:rgba(120,120,128,.16)}
.seg button{padding:6px 12px;border-radius:9px;font-size:13px;font-weight:600;transition:transform .35s var(--ios-bounce)}
.seg button:active{transform:scale(.90)}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.note{color:var(--sub);font-size:13px;margin:0 28px 14px}
.btn{background:var(--accent-grad);color:#fff;border-radius:16px;padding:12px 18px;font-weight:700;display:inline-flex;gap:8px;align-items:center;transition:transform .4s var(--ios-bounce)}
.btn:active{transform:scale(.90)}
.btn.g{background:var(--card);color:var(--accent);border:.5px solid var(--line)}
.empty{color:var(--sub);text-align:center;padding:30px}
.sp{display:flex;justify-content:center;padding:40px}
.sp i{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.prov{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.prov button{background:var(--card);border:.5px solid var(--line);border-radius:12px;padding:7px 12px;font-size:13px;font-weight:600;transition:transform .36s var(--ios-bounce)}
.prov button:active{transform:scale(.90)}
.prov button.on{background:var(--accent-grad);color:#fff;border-color:transparent}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px;max-height:210px;overflow-y:auto;margin:8px 0 14px;padding:2px;-webkit-overflow-scrolling:touch}
.ep-grid button{background:var(--card);border:.5px solid var(--line);border-radius:11px;padding:8px 6px;font-size:12px;font-weight:600;text-align:center;transition:transform .36s var(--ios-bounce)}
.ep-grid button:active{transform:scale(.88)}
.ep-grid button.on{background:var(--accent-grad);color:#fff;border-color:transparent}

/* ===== Liquid Glass dock ===== */
.dock{position:fixed;left:16px;right:16px;bottom:max(8px,calc(var(--sab) - 6px));z-index:30;display:flex;gap:10px;align-items:center;transform:translateZ(0)}
.glass{
  position:relative;
  background:rgba(var(--glass-rgb),calc(var(--g) * .7));
  -webkit-backdrop-filter:blur(calc(2px + var(--g) * 26px)) saturate(185%);
  backdrop-filter:blur(calc(2px + var(--g) * 26px)) saturate(185%);
  box-shadow:var(--glass-shadow),inset 0 1.5px 1px var(--rim-hi),inset 0 -1px 1px var(--rim-lo);
}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(145deg,var(--rim-hi),transparent 32%,transparent 66%,var(--rim-lo));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.tabs{flex:1;display:flex;height:62px;padding:4px;border-radius:31px;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .46s var(--ios-bounce)}
.tabs.press{transform:scale(1.035)}
#tabPill{position:absolute;top:4px;bottom:4px;left:0;border-radius:27px;pointer-events:none;
  background:linear-gradient(180deg,rgba(var(--pill-rgb),calc(var(--pill-a) + .06)),rgba(var(--pill-rgb),var(--pill-a)));
  box-shadow:inset 0 1px 1px var(--rim-hi),inset 0 -1px 1px var(--rim-lo),0 2px 8px rgba(0,0,0,.08);
  transform:translate3d(var(--px,0px),0,0) scale(var(--ps,1));
  transition:transform .54s var(--ios-bounce),opacity .22s,background .22s;will-change:transform}
#tabPill.press{--ps:1.10;background:linear-gradient(180deg,rgba(var(--glass-rgb),.55),rgba(var(--pill-rgb),.14));
  box-shadow:inset 0 1.5px 1.5px var(--rim-hi),inset 0 -1px 1px var(--rim-lo),0 6px 18px rgba(0,0,0,.18)}
#tabPill.off{opacity:0;--ps:.85}
.tabs button.t{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:700;letter-spacing:.1px;color:var(--text);transition:color .2s,transform .4s var(--ios-bounce)}
.tabs button.t:active{transform:scale(.86)}
.tabs button.t svg,.sbtn svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .44s var(--ios-bounce)}
.tabs button.t.on{color:var(--accent);font-weight:800}
.tabs button.t.on svg{fill:currentColor;fill-opacity:.9;transform:translateY(-1px) scale(1.08)}
.tabs button.t.hov{color:var(--accent)}
.sbtn{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--text);transition:transform .46s var(--ios-bounce),color .2s}
.sbtn:active{transform:scale(1.14)}
.sbtn.on{color:var(--accent)}
.sbtn.on svg{stroke-width:2.4}

/* ===== Sheet (Cố định transform-origin: 50% 50% để không bao giờ bị giật nhảy khi đổi hướng thu nhỏ) ===== */
#sheet{position:fixed;inset:0;z-index:50;display:none;overflow:hidden;contain:layout style}
#sheet.show{display:block}
#sheet .bd{
  position:absolute;inset:0;background:rgba(12,10,18,.52);
  opacity:0;transition:opacity .38s var(--uikit);will-change:opacity;
}
#sheet .pn{
  position:absolute;left:0;right:0;bottom:0;top:calc(var(--sat) + 12px);
  background:var(--bg);border-radius:32px;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  overscroll-behavior:none;
  padding-bottom:calc(var(--sab) + 50px);
  transform-origin:50% 50%;
  transform:translate3d(0,100%,0) scale(.95);
  opacity:1;
  transition:transform .50s var(--ios-spring),opacity .32s ease;
  box-shadow:0 -8px 30px rgba(0,0,0,.22);
  will-change:transform,opacity;backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
#sheet.open .bd{opacity:1}
#sheet.open .pn{transform:translate3d(0,0,0) scale(1)}
#sheet.dragging .pn,#sheet.dragging .bd{transition:none!important}

.sh-bar{
  position:sticky;top:0;z-index:12;
  display:flex;align-items:center;justify-content:space-between;
  height:52px;padding:8px 14px 0;
  pointer-events:none;
}
.sh-btn{
  pointer-events:auto;
  height:36px;min-width:36px;padding:0 12px;border-radius:18px;
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  background:rgba(24,22,30,.68);color:#fff;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:.5px solid rgba(255,255,255,.26);
  box-shadow:0 4px 12px rgba(0,0,0,.22);
  font-size:13px;font-weight:700;
  transition:transform .38s var(--ios-bounce),opacity .2s;
}
.sh-btn:active{transform:scale(.84)}
.sh-btn.hide{opacity:0;pointer-events:none}
.sh-btn.ic{width:36px;padding:0;border-radius:50%;font-size:16px}
.sh-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.grab{
  pointer-events:auto;
  flex:1;height:44px;display:flex;justify-content:center;align-items:flex-start;padding-top:6px;
  cursor:grab;touch-action:none;
}
.grab::before{content:"";width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.85);box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .35s var(--ios-bounce)}
#sheet.dragging .grab::before{transform:scaleX(1.28);background:var(--accent)}

.bk{aspect-ratio:16/10;margin-top:-52px;background:var(--card);position:relative}.bk img{width:100%;height:100%;object-fit:cover}.bk::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.28) 0%,transparent 32%,transparent 52%,var(--bg) 100%)}
.dt{padding:0 20px;margin-top:-34px;position:relative;z-index:1}.dt h3{font-size:28px;margin:0 0 6px}
.meta{color:var(--sub);font-size:13.5px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rate{color:var(--accent);font-weight:700}
.acts{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}
.tr{aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;margin:10px 0}.tr iframe{width:100%;height:100%;border:0}
.dt p{color:var(--sub);line-height:1.5}

/* ===== Player ===== */
#player{
  position:fixed;top:50%;left:50%;
  width:100vw;height:100vh;width:100dvw;height:100dvh;
  transform:translate3d(-50%,-50%,0) rotate(0deg) scale(1);
  transform-origin:center center;
  z-index:80;background:#000;display:none;color:#fff;
  transition:transform .50s var(--ios-spring),opacity .34s ease,border-radius .3s ease;
  user-select:none;-webkit-user-select:none;overflow:hidden;
  will-change:transform,opacity;backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
#player.show{display:block;animation:playerIn .44s var(--ios-spring)}
@keyframes playerIn{from{opacity:0;transform:translate3d(-50%,-44%,0) scale(.90)}to{opacity:1;transform:translate3d(-50%,-50%,0) scale(1)}}
#player.dragging{transition:none!important}
#player video,#player iframe{width:100%;height:100%;object-fit:contain;background:#000;border:0}
.ctl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(var(--sat) + 20px) 20px calc(var(--sab) + 20px);background:linear-gradient(rgba(0,0,0,.6),transparent 30%,transparent 70%,rgba(0,0,0,.8));z-index:10;transition:opacity .22s ease}
.ctl.hide,#player.idle .ctl{opacity:0!important;pointer-events:none!important}
.top{display:flex;align-items:center;gap:12px}.top b{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2);transition:transform .38s var(--ios-bounce)}
.rb:active{transform:scale(.84)}
.bot{display:flex;gap:12px;align-items:center}
.bot input{flex:1;accent-color:#fff}
.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);padding:10px 16px;border-radius:20px;background:rgba(0,0,0,.8);opacity:0;transition:.35s var(--ios-bounce);z-index:20;font-size:14px;pointer-events:none}
.toast.on{opacity:1}

.hero{position:relative;display:block;width:calc(100% - 40px);margin:0 20px 24px;padding:0;overflow:hidden;border-radius:28px;border:0;background:none;transform:translateZ(0);transition:transform .44s var(--ios-bounce)}
.hero:active{transform:scale(.95)}
.hero img{display:block;width:100%;height:250px;object-fit:cover;object-position:center}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.75),rgba(0,0,0,.2) 45%,transparent)}
.hero div{position:absolute;left:20px;right:20px;bottom:20px;z-index:2;color:#fff;text-align:left}
.hero span{display:block;font-size:14px}
.hero b{display:block;margin-top:4px;font-size:30px;font-weight:800}

@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>

/* ---------- BỘ LỌC CẮT QUẢNG CÁO M3U8 ---------- */
function stripAdsFromM3u8(text,baseUrl=""){
  if(!text)return text;
  const resolveUrl=u=>{if(!baseUrl||/^https?:\/\//i.test(u))return u;try{return new URL(u,baseUrl).href}catch{return u}};
  if(!text.includes("#EXT-X-DISCONTINUITY")){
    if(!baseUrl)return text;
    return text.split(/\r?\n/).map(l=>{const t=l.trim();return(!t||t.startsWith("#"))?l:resolveUrl(t)}).join("\n");
  }
  const lines=text.split(/\r?\n/),headerLines=[],blocks=[];
  let cur=[],inBody=false;
  for(const raw of lines){
    const l=raw.trim();if(!l||l==="#EXT-X-ENDLIST")continue;
    if(!inBody&&!l.startsWith("#EXTINF:")&&l!=="#EXT-X-DISCONTINUITY"){headerLines.push(l)}
    else{
      inBody=true;
      if(l==="#EXT-X-DISCONTINUITY"){if(cur.length)blocks.push(cur);cur=[]}
      else cur.push(l.startsWith("#")?l:resolveUrl(l));
    }
  }
  if(cur.length)blocks.push(cur);
  if(blocks.length<=1)return[...headerLines,...(blocks[0]||[]),"#EXT-X-ENDLIST"].join("\n");

  const stats=blocks.map(b=>{
    const urls=b.filter(x=>!x.startsWith("#"));
    const dur=b.filter(x=>x.startsWith("#EXTINF:")).reduce((s,x)=>s+(parseFloat(x.slice(8))||0),0);
    const sample=urls[0]||"";
    const prefix=sample.slice(0,Math.max(0,sample.lastIndexOf("/")));
    return{lines:b,count:urls.length,dur,prefix,sample};
  });
  const pCounts={};stats.forEach(s=>{pCounts[s.prefix]=(pCounts[s.prefix]||0)+s.count});
  let mainPrefix="",maxC=-1;
  for(const p in pCounts){if(pCounts[p]>maxC){maxC=pCounts[p];mainPrefix=p}}

  const cleanBlocks=stats.filter(s=>{
    if(/quangcao|adjump|ads|bet|casino|宣传/i.test(s.sample))return false;
    if(s.prefix!==mainPrefix&&maxC>15)return false;
    if(s.count<=12&&s.dur<45&&maxC>25)return false;
    return true;
  });
  const finalBlocks=cleanBlocks.length?cleanBlocks:stats;
  return[...headerLines,...finalBlocks.flatMap((s,i)=>i===0?s.lines:["#EXT-X-DISCONTINUITY",...s.lines]),"#EXT-X-ENDLIST"].join("\n");
}

let CleanHlsLoader=null;
try{
  if(typeof Hls!=="undefined"&&Hls.DefaultConfig?.loader){
    CleanHlsLoader=class extends Hls.DefaultConfig.loader{
      constructor(config){
        super(config);
        const origLoad=this.load.bind(this);
        this.load=function(context,config,callbacks){
          const origSuccess=callbacks.onSuccess;
          callbacks.onSuccess=function(response,stats,ctx,net){
            if(typeof response.data==="string"&&response.data.includes("#EXT-X-DISCONTINUITY")){
              response.data=stripAdsFromM3u8(response.data);
            }
            origSuccess(response,stats,ctx,net);
          };
          origLoad(context,config,callbacks);
        };
      }
    };
  }
}catch{}

const m3u8BlobCache=new Map();
async function getCleanM3u8BlobUrl(m3u8Url){
  if(!m3u8Url)return"";
  if(m3u8BlobCache.has(m3u8Url))return m3u8BlobCache.get(m3u8Url);
  try{
    const ctrl=new AbortController(),tid=setTimeout(()=>ctrl.abort(),2200);
    const masterTxt=await fetch(m3u8Url,{signal:ctrl.signal}).then(r=>r.text());
    clearTimeout(tid);
    if(!masterTxt.includes("#EXTM3U"))return m3u8Url;
    if(masterTxt.includes("#EXT-X-STREAM-INF")){
      const lines=masterTxt.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
      let subRel="";
      for(let i=0;i<lines.length;i++){
        if(lines[i].startsWith("#EXT-X-STREAM-INF")&&lines[i+1]&&!lines[i+1].startsWith("#")){subRel=lines[i+1];break}
      }
      if(subRel){
        const subUrl=new URL(subRel,m3u8Url).href;
        const ctrl2=new AbortController(),tid2=setTimeout(()=>ctrl2.abort(),2200);
        const subTxt=await fetch(subUrl,{signal:ctrl2.signal}).then(r=>r.text());
        clearTimeout(tid2);
        const cleaned=stripAdsFromM3u8(subTxt,subUrl);
        const blobUrl=URL.createObjectURL(new Blob([cleaned],{type:"application/vnd.apple.mpegurl"}));
        m3u8BlobCache.set(m3u8Url,blobUrl);
        return blobUrl;
      }
    }
    const cleaned=stripAdsFromM3u8(masterTxt,m3u8Url);
    const blobUrl=URL.createObjectURL(new Blob([cleaned],{type:"application/vnd.apple.mpegurl"}));
    m3u8BlobCache.set(m3u8Url,blobUrl);
    return blobUrl;
  }catch{return m3u8Url}
}

const VN_ENTERTAINMENT_REGEX=/(\bgameshow\b|game show|reality|concert|live show|liveshow|talkshow|talk show|podcast|tạp kỹ|tap ky|chương trình|chuong trinh|2 ngay 1 dem|anh trai|chi dep|em xinh|running man|chay di cho chi|nhanh nhu chop|nguoi ay la ai|ca si mat na|masked singer|rap viet|king of rap|thuong vu bac ty|shark tank|mai am gia dinh viet|bo oi minh di dau the|hanh trinh ruc ro|sao nhap ngu|on gioi cau day roi|thach thuc danh hai|dau truong tieng cuoi|ban muon hen ho|vo chong son|ky uc vui ve|7 nu cuoi xuan|me vang nha|ba la sieu nhan|dau truong gia toc|tan binh toan nang|vietnam idol|the face|the voice|giong hat viet|cuoc dua ky thu|amazing race|hoa hau|miss universe|miss grand|miss world|tao quan|gap nhau cuoi nam|vtv awards|wechoice|lan song xanh|hoi ngo danh hai|bi mat dem chu nhat|chon ai day|xuan ha thu dong|bien cua hy vong|nha tro destiny)/i;

function isVnEntertainmentShow(item){
  if(!item)return true;
  if(item.type==="tvshows")return true;
  if(Array.isArray(item.category)&&item.category.some(c=>c.slug==="tv-shows"||/tv\s*shows|truyen hinh thực tế|chương trình/i.test(c.name||"")))return true;
  const gIds=item.genre_ids||(item.genres||[]).map(g=>g.id)||[];
  if(gIds.some(id=>[10764,10767,10763,99,10402].includes(id)))return true;
  const t1=norm(item.title||item.name||"");
  const t2=norm(item.originTitle||item.origin_name||item.original_name||item.original_title||"");
  if(VN_ENTERTAINMENT_REGEX.test(t1)||VN_ENTERTAINMENT_REGEX.test(t2))return true;
  return false;
}

const searchCache=new Map(),detailCache=new Map(),streamAvailCache=new Map();
async function fetchWithTimeout(url,ms=3200){
  const ctrl=new AbortController(),id=setTimeout(()=>ctrl.abort(),ms);
  try{const res=await fetch(url,{signal:ctrl.signal});clearTimeout(id);if(!res.ok) throw new Error(`HTTP ${res.status}`);return await res.json()}catch(e){clearTimeout(id);throw e}
}
async function fetchFromProvider(provider,keyword=""){
  const ck=`${provider.id}:${keyword||"latest"}`;
  if(searchCache.has(ck))return searchCache.get(ck);
  try{
    const url=keyword?provider.searchUrl(keyword):provider.latestUrl();
    const json=await fetchWithTimeout(url,3200);
    let rawItems=json?.data?.items||json?.items||[];
    if(provider.id==="kk_vn")rawItems=rawItems.filter(it=>!isVnEntertainmentShow(it));
    const imgDomain=json?.data?.APP_DOMAIN_CDN_IMAGE?(json.data.APP_DOMAIN_CDN_IMAGE.endsWith("/")?json.data.APP_DOMAIN_CDN_IMAGE:json.data.APP_DOMAIN_CDN_IMAGE+"/"):provider.imgPrefix;
    const items=rawItems.map(it=>{
      let thumb=it.poster_url||it.thumb_url||"";
      if(thumb&&!thumb.startsWith("http"))thumb=imgDomain+thumb;
      return{title:it.name,originTitle:it.origin_name||it.original_name||"",slug:it.slug,year:it.year||"",thumb,providerId:provider.id,providerName:provider.name};
    });
    const resObj={provider,items};searchCache.set(ck,resObj);return resObj;
  }catch{return{provider,items:[],error:true}}
}
async function rescueKkphimM3u8(slug,title,originTitle=""){
  try{
    const d=await fetchWithTimeout(`https://phimapi.com/phim/${slug}`,2500);
    if(d?.episodes?.length&&d.episodes[0]?.server_data?.length)return d.episodes.map(s=>({server_name:`⚡ KKPhim (${s.server_name})`,server_data:s.server_data}));
  }catch{}
  const queries=[title,originTitle].filter(Boolean);
  for(const q of queries){
    try{
      const s=await fetchWithTimeout(`https://phimapi.com/v1/api/tim-kiem?keyword=${encodeURIComponent(q)}&limit=2`,2500);
      const first=s?.data?.items?.[0];
      if(first?.slug){
        const d2=await fetchWithTimeout(`https://phimapi.com/phim/${first.slug}`,2500);
        if(d2?.episodes?.length)return d2.episodes.map(srv=>({server_name:`⚡ KKPhim (${srv.server_name})`,server_data:srv.server_data}));
      }
    }catch{}
  }
  return[];
}
async function fetchProviderMovieDetail(providerId,slug,fallbackTitle=""){
  const ck=`${providerId}:${slug}`;
  if(detailCache.has(ck))return detailCache.get(ck);
  const provider=PROVIDERS.find(p=>p.id===providerId)||PROVIDERS[0];
  const data=await fetchWithTimeout(provider.detailUrl(slug),3500);
  const movie=data.movie||data?.data?.item||{};
  const title=movie.name||fallbackTitle||"Phim";
  const originTitle=movie.origin_name||movie.original_name||"";
  let servers=[];
  if(provider.type==="nguonc"){
    const rescued=await rescueKkphimM3u8(slug,title,originTitle);
    const nguoncSrv=(movie.episodes||[]).map(s=>({
      server_name:`🔗 NguonC (${s.server_name})`,
      server_data:(s.items||[]).map(ep=>({name:ep.name,link_m3u8:ep.m3u8||"",link_embed:ep.embed||""}))
    }));
    servers=[...rescued,...nguoncSrv];
  }else{
    const rawEps=data.episodes||data?.data?.item?.episodes||[];
    servers=rawEps.map(s=>({server_name:`⚡ ${s.server_name}`,server_data:s.server_data||[]}));
  }
  let thumb=movie.poster_url||movie.thumb_url||"";
  if(thumb&&!thumb.startsWith("http"))thumb=provider.imgPrefix+thumb;
  let backdrop=movie.thumb_url||movie.poster_url||thumb;
  if(backdrop&&!backdrop.startsWith("http"))backdrop=provider.imgPrefix+backdrop;
  const res={movie,title,originTitle,overview:movie.content||movie.description||"",year:movie.year||"",thumb,backdrop,servers,providerId,slug};
  detailCache.set(ck,res);
  const firstM3u8=servers[0]?.server_data?.[0]?.link_m3u8;
  if(firstM3u8)getCleanM3u8BlobUrl(firstM3u8);
  return res;
}

function isMatchTitle(item,viTitle,origTitle){
  const nT=norm(item.title),nO=norm(item.originTitle);
  const qV=norm(viTitle),qO=norm(origTitle);
  if(qV&&nT&&(nT===qV||nT.includes(qV)||qV.includes(nT)))return true;
  if(qO&&nO&&(nO===qO||nO.includes(qO)||qO.includes(nO)))return true;
  if(qO&&nT&&(nT===qO||nT.includes(qO)))return true;
  return false;
}

async function findStreamForTmdb(viTitle,origTitle,tmdbId=""){
  const queries=[...new Set([viTitle,origTitle].filter(Boolean))];
  const nguoncP=PROVIDERS.find(p=>p.id==="nguonc")||PROVIDERS[5];
  const kkSearches=await Promise.all(queries.map(q=>fetchFromProvider(PROVIDERS[0],q)));
  const kkItems=kkSearches.flatMap(r=>r.items).filter(x=>isMatchTitle(x,viTitle,origTitle));
  if(kkItems.length){
    try{
      const det=await fetchProviderMovieDetail(kkItems[0].providerId,kkItems[0].slug,kkItems[0].title);
      if(det.servers.length&&det.servers[0].server_data?.length){
        if(tmdbId)streamAvailCache.set(String(tmdbId),true);
        return det;
      }
    }catch{}
  }
  const ngSearches=await Promise.all(queries.map(q=>fetchFromProvider(nguoncP,q)));
  const ngItems=ngSearches.flatMap(r=>r.items).filter(x=>isMatchTitle(x,viTitle,origTitle));
  if(ngItems.length){
    try{
      const det=await fetchProviderMovieDetail(ngItems[0].providerId,ngItems[0].slug,ngItems[0].title);
      if(det.servers.length&&det.servers[0].server_data?.length){
        if(tmdbId)streamAvailCache.set(String(tmdbId),true);
        return det;
      }
    }catch{}
  }
  if(tmdbId){
    streamAvailCache.set(String(tmdbId),false);
    markCardComingSoon(tmdbId);
  }
  return null;
}

function markCardComingSoon(tmdbId){
  $("#page")?.querySelectorAll(`.card[data-id="${tmdbId}"]`).forEach(card=>{
    if(!card.querySelector(".cs-tag")){
      card.insertAdjacentHTML("afterbegin",`<span class="cs-tag">Coming Soon</span>`);
    }
  });
}

const checkQueue=[];let checkingBusy=false;
function queueStreamCheck(cardsScope=document){
  cardsScope.querySelectorAll(".card[data-id]:not([data-checked])").forEach(c=>{
    c.dataset.checked="1";
    const id=c.dataset.id,vi=c.dataset.vi||"",or=c.dataset.or||"";
    if(streamAvailCache.has(id)){
      if(streamAvailCache.get(id)===false)markCardComingSoon(id);
      return;
    }
    checkQueue.push({id,vi,or});
  });
  scheduleIdleCheck();
}
function scheduleIdleCheck(){
  if(checkingBusy||!checkQueue.length)return;
  checkingBusy=true;
  const step=async()=>{
    if(!checkQueue.length){checkingBusy=false;return}
    if(userInteracting||$("#player")?.classList.contains("show")){
      setTimeout(step,500);
      return;
    }
    const item=checkQueue.shift();
    if(item&&!streamAvailCache.has(item.id)){
      try{
        const kk=await fetchFromProvider(PROVIDERS[0],item.vi||item.or);
        let ok=kk.items.some(x=>isMatchTitle(x,item.vi,item.or));
        if(!ok&&item.or&&item.or!==item.vi){
          const kk2=await fetchFromProvider(PROVIDERS[0],item.or);
          ok=kk2.items.some(x=>isMatchTitle(x,item.vi,item.or));
        }
        streamAvailCache.set(item.id,ok);
        if(!ok)markCardComingSoon(item.id);
      }catch{}
    }
    setTimeout(step,180);
  };
  setTimeout(step,400);
}

function saveCurrentViewSnapshot(){

  if(!pg||!pg.firstChild)return;

  while(pg.firstChild)holder.appendChild(pg.firstChild);

    type:curView.type,
    key:curView.key,
    tab,
    scrollY:window.scrollY||0,
    scrollers,
    holder
  });
  if(pageHistory.length>8)pageHistory.shift();
  /* Gắn sẵn trang vừa lưu vào #edgePrev ngay lập tức để GPU rasterize sẵn trước khi người dùng vuốt */
  mountTopHistoryToEdgePrev();
}

function syncTabUI(k){
  const i=TABS.findIndex(t=>t[0]===k);
  tbs.forEach((b,n)=>{b.classList.toggle("on",n===i);b.classList.remove("hov")});
  sBtn.classList.toggle("on",k==="search");
  pill.classList.toggle("off",i<0);
  if(i>=0)placePill(i);
}

function placePill(i,x){
  const b=tbs[i];if(!b)return;
  pill.style.width=b.offsetWidth+"px";
  pill.style.setProperty("--px",(x??b.offsetLeft)+"px");
}
function go(k,pushHist=true){
  if(pushHist&&$("#page").firstChild&&(curView.type!=="tab"||curView.key!==k)){
    saveCurrentViewSnapshot();
  }
  tab=k;curView={type:"tab",key:k};
  const id=++navId;
  syncTabUI(k);
  window.scrollTo(0,0);
  ({home:pHome,lib:pLib,search:pSearch,me:pMe})[k](id);
}
sBtn.onclick=()=>go("search");

function restorePreviousPage(){
  const prev=pageHistory.pop();
  if(!prev){
    if(curView.type!=="tab"||curView.key!=="home"){
      go("home",false);
      return true;
    }
    return false;
  }
  ++navId;
  tab=prev.tab;
  curView={type:prev.type,key:prev.key};
  syncTabUI(tab);
  const pg=$("#page");
  pg.innerHTML="";
  prev.holder.style.transform="";
  while(prev.holder.firstChild)pg.appendChild(prev.holder.firstChild);
  const scEls=[...pg.querySelectorAll(".scroller")];
  (prev.scrollers||[]).forEach((sl,idx)=>{if(scEls[idx])scEls[idx].scrollLeft=sl});
  window.scrollTo(0,prev.scrollY||0);
  mountTopHistoryToEdgePrev();
  return true;
}

let drag=null;
const idxAt=x=>{let best=0,d=1e9;tbs.forEach((b,n)=>{const c=b.offsetLeft+b.offsetWidth/2,dd=Math.abs(c-x);if(dd<d){d=dd;best=n}});return best};
tabsEl.addEventListener("pointerdown",e=>{
  const r=tabsEl.getBoundingClientRect();
  drag={r,idx:idxAt(e.clientX-r.left)};
  tabsEl.setPointerCapture(e.pointerId);
  pill.classList.remove("off");pill.classList.add("press");tabsEl.classList.add("press");
  moveDrag(e);
});
function moveDrag(e){
  if(!drag)return;
  const x=e.clientX-drag.r.left,w=tbs[0].offsetWidth;
  const px=Math.min(tbs[tbs.length-1].offsetLeft,Math.max(tbs[0].offsetLeft,x-w/2));
  drag.idx=idxAt(x);pill.style.width=tbs[drag.idx].offsetWidth+"px";pill.style.setProperty("--px",px+"px");
  tbs.forEach((b,n)=>b.classList.toggle("hov",n===drag.idx));
}
tabsEl.addEventListener("pointermove",e=>{if(drag)moveDrag(e)});
function endDrag(commit){
  if(!drag)return;const i=drag.idx;drag=null;
  pill.classList.remove("press");tabsEl.classList.remove("press");
  commit?go(TABS[i][0]):syncTabUI(tab);
}
tabsEl.addEventListener("pointerup",()=>endDrag(true));
tabsEl.addEventListener("pointercancel",()=>endDrag(false));
tabsEl.addEventListener("click",e=>{if(e.detail===0){const b=e.target.closest("button.t");if(b)go(b.dataset.k)}});

async function tmdb(path,q={}){
  if(!cfg.tmdb)throw new Error("nokey");
  const u=new URL("https://api.themoviedb.org/3"+path);u.searchParams.set("language","vi-VN");
  const h={};if(cfg.tmdb.startsWith("eyJ"))h.Authorization="Bearer "+cfg.tmdb;else u.searchParams.set("api_key",cfg.tmdb);
  for(const k in q)u.searchParams.set(k,q[k]);
  const r=await fetch(u,{headers:h});if(!r.ok)throw new Error(r.status);return r.json();
}
const cache=new Map();const ctmdb=(p,q)=>{const k=p+JSON.stringify(q||{});if(!cache.has(k))cache.set(k,tmdb(p,q).catch(e=>{cache.delete(k);throw e}));return cache.get(k)};

const getYearNum=m=>{
  if(m.year)return parseInt(m.year,10)||0;
  const d=m.first_air_date||m.release_date||"";

};
const getDateScore=m=>{
  const d=m.first_air_date||m.release_date||(m.year?`${m.year}-01-01`:"");
  return d?new Date(d).getTime()||0:0;
};

async function fetchNetflixRow(pg=1){
  const today=new Date().toISOString().slice(0,10);
  const [krNetNew,krNetPop,krWatchVN]=await Promise.all([
    ctmdb("/discover/tv",{with_networks:213,with_original_language:"ko",without_genres:"10764,10767,10763,99","first_air_date.lte":today,"vote_count.gte":1,sort_by:"first_air_date.desc",page:pg}).catch(()=>({results:[]})),
    ctmdb("/discover/tv",{with_networks:213,with_original_language:"ko",without_genres:"10764,10767,10763,99","first_air_date.lte":today,sort_by:"popularity.desc",page:pg}).catch(()=>({results:[]})),
    ctmdb("/discover/tv",{with_watch_providers:8,watch_region:"VN",with_original_language:"ko",without_genres:"10764,10767,10763,99","first_air_date.lte":today,sort_by:"first_air_date.desc",page:pg}).catch(()=>({results:[]}))
  ]);
  const seen=new Set(),merged=[];
  const all=[...(krNetNew.results||[]),...(krWatchVN.results||[]),...(krNetPop.results||[])];
  all.forEach(m=>{
    if(m&&m.poster_path&&!seen.has(m.id)){
      seen.add(m.id);
      merged.push({...m,media_type:"tv"});
    }
  });
  merged.sort((a,b)=>(getYearNum(b)-getYearNum(a))||(getDateScore(b)-getDateScore(a))||((b.popularity||0)-(a.popularity||0)));
  return merged;
}

async function fetchVietnamRow(pg=1){
  const [mvVi,tvVi,kkVn]=await Promise.all([
    ctmdb("/discover/movie",{with_original_language:"vi",without_genres:"99,10402",sort_by:"popularity.desc",page:pg}).catch(()=>({results:[]})),
    ctmdb("/discover/tv",{with_original_language:"vi",with_type:"2|4",without_genres:"10764,10767,10763,99,10402",sort_by:"popularity.desc",page:pg}).catch(()=>({results:[]})),
    fetchWithTimeout(`https://phimapi.com/v1/api/quoc-gia/viet-nam?page=${pg}&limit=24`,3200).catch(()=>null)
  ]);
  const imgDomain=kkVn?.data?.APP_DOMAIN_CDN_IMAGE?(kkVn.data.APP_DOMAIN_CDN_IMAGE.endsWith("/")?kkVn.data.APP_DOMAIN_CDN_IMAGE:kkVn.data.APP_DOMAIN_CDN_IMAGE+"/"):"https://phimimg.com/";
  const kkItems=(kkVn?.data?.items||[]).filter(it=>!isVnEntertainmentShow(it)).map(it=>{
    let thumb=it.poster_url||it.thumb_url||"";
    if(thumb&&!thumb.startsWith("http"))thumb=imgDomain+thumb;
    return{_isProv:true,title:it.name,originTitle:it.origin_name||"",slug:it.slug,year:it.year||"",thumb,providerId:"kk_vn",providerName:"Phim Việt",poster_path:thumb};
  });
  const tmdbItems=[
    ...(mvVi.results||[]).filter(x=>x.poster_path&&!isVnEntertainmentShow(x)).map(x=>({...x,media_type:"movie"})),
    ...(tvVi.results||[]).filter(x=>x.poster_path&&!isVnEntertainmentShow(x)).map(x=>({...x,media_type:"tv"}))
  ];
  const combined=[],seenNames=new Set();
  kkItems.forEach(x=>{const n=norm(x.title);if(n&&!seenNames.has(n)){seenNames.add(n);combined.push(x)}});
  tmdbItems.forEach(x=>{const n=norm(ttl(x));if(n&&!seenNames.has(n)){seenNames.add(n);combined.push(x)}});
  return combined;
}

async function openCategory(rowIdx,pushHist=true){
  const r=ROWS[rowIdx];if(!r)return;
  if(pushHist)saveCurrentViewSnapshot();
  curView={type:"cat",key:rowIdx};
  const id=++navId;
  window.scrollTo(0,0);
  const pg=$("#page");
  pg.innerHTML=`
    <div class="cat-bar"><button class="back-btn" id="catBack"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg> Quay lại</button></div>
    <h1>${esc(r.t)}</h1>
    ${r.sub&&r.sub()?`<div class="note" style="margin-top:-8px">${esc(r.sub())}</div>`:""}
    <div class="grid" id="catGrid"></div>
    <div id="catMoreWrap" style="text-align:center;padding:18px 20px"><div class="sp"><i></i></div></div>
  `;
  $("#page #catBack").onclick=()=>{if(!restorePreviousPage())go("home",false)};

  let curPage=0,loading=false,ended=false;
  const seenKeys=new Set();

  async function loadNextBatch(batchCount=3){
    if(loading||ended||id!==navId)return;
    loading=true;
    const wrap=$("#page #catMoreWrap");
    if(wrap)wrap.innerHTML=`<div class="sp"><i></i></div>`;
    try{
      const pages=[];
      for(let k=1;k<=batchCount;k++)pages.push(curPage+k);
      curPage+=batchCount;
      const resList=await Promise.all(pages.map(p=>r.p(p).catch(()=>[])));
      if(id!==navId)return;
      let items=resList.flat().filter(m=>{
        if(!m||(!m.poster_path&&!m._isProv)||m.media_type==="person")return false;
        const k=m._isProv?`p:${m.slug}`:`t:${m.id}`;
        if(seenKeys.has(k))return false;
        seenKeys.add(k);
        return true;
      });
      if(r.t==="Phim trên Netflix"){
        items.sort((a,b)=>(getYearNum(b)-getYearNum(a))||(getDateScore(b)-getDateScore(a))||((b.popularity||0)-(a.popularity||0)));
      }
      if(!items.length){
        ended=true;
        if(wrap)wrap.innerHTML=seenKeys.size?`<div class="note" style="text-align:center;margin:10px 0">Đã hiển thị toàn bộ ${seenKeys.size} phim trong danh mục này.</div>`:`<div class="empty">Không có dữ liệu</div>`;
        return;
      }
      const grid=$("#page #catGrid");
      if(grid){
        const startRank=seenKeys.size-items.length;
        grid.insertAdjacentHTML("beforeend",items.map((m,idx)=>cardHTML(m,startRank+idx,r.rank)).join(""));
        queueStreamCheck(grid);
      }
      if(wrap){
        wrap.innerHTML=`<button class="btn g" id="loadMoreCatBtn">Tải thêm phim <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"><path d="M9 6l6 6-6 6"/></svg></button>`;
        $("#page #loadMoreCatBtn").onclick=()=>loadNextBatch(2);
      }
    }catch{
      if(wrap)wrap.innerHTML=`<div class="empty">Không tải thêm được dữ liệu</div>`;
    }finally{
      loading=false;
    }
  }
  await loadNextBatch(3);
}

/* ---------- Sheet Chi Tiết Phim (Giữ cố định transform-origin: 50% 50% để không bị nhảy khung khi thu nhỏ về góc phải hoặc góc dưới) ---------- */
let shT,activeStreamData=null,activeSrvIdx=0,activeEpIdx=0;
const sheetEl=$("#sheet"),sheetPn=$("#sheet .pn"),sheetBd=$("#sheet .bd"),shClose=$("#shClose"),shBack=$("#shBack"),shGrab=$("#shGrab");
const sheetHistory=[];
let currentSheetAction=null;

function updateSheetBackBtn(){
  shBack.classList.toggle("hide",sheetHistory.length===0);
}

sheetBd.addEventListener("touchmove",e=>{if(e.cancelable)e.preventDefault()},{passive:false});

function resetSheetInlineStyles(){
  sheetPn.style.transition="";
  sheetPn.style.transform="";
  sheetPn.style.opacity="";
  sheetBd.style.transition="";
  sheetBd.style.opacity="";
}

function openSheet(){
  markInteraction(600);
  clearTimeout(shT);
  sheetEl.classList.remove("dragging");
  resetSheetInlineStyles();
  sheetPn.scrollTop=0;
  updateSheetBackBtn();
  if(!sheetEl.classList.contains("show")){
    sheetEl.classList.add("show");
    requestAnimationFrame(()=>requestAnimationFrame(()=>sheetEl.classList.add("open")));
  }else{
    sheetEl.classList.add("open");
  }
}

/* dir = "down" (thu nhỏ xuống dưới) | "right" (thu nhỏ về góc phải) */
function closeSheet(dir="down"){
  markInteraction(450);
  ytStop();
  clearTimeout(shT);
  sheetHistory.length=0;
  currentSheetAction=null;
  updateSheetBackBtn();
  sheetEl.classList.remove("dragging");

  sheetPn.style.transition="transform .36s cubic-bezier(.22,1,.36,1), opacity .30s ease";
  sheetBd.style.transition="opacity .32s ease";
  if(dir==="right"){
    /* Thu nhỏ liên tục về phía góc phải với cùng tâm 50% 50%, không nhảy khung */
    sheetPn.style.transform="translate3d(54%, 8%, 0) scale(.32)";
  }else{
    /* Thu nhỏ liên tục xuống phía dưới với cùng tâm 50% 50% */
    sheetPn.style.transform="translate3d(0, 68%, 0) scale(.38)";
  }
  sheetPn.style.opacity="0";
  sheetBd.style.opacity="0";

  shT=setTimeout(()=>{
    sheetEl.classList.remove("open","show");
    resetSheetInlineStyles();
    $("#sc").innerHTML="";
  },360);
}

function backOrCloseSheet(dir="down"){
  if(sheetHistory.length>0){
    const prev=sheetHistory.pop();
    currentSheetAction=null;
    updateSheetBackBtn();
    prev();
  }else{
    closeSheet(dir);
  }
}
sheetBd.onclick=()=>closeSheet("down");
shClose.onclick=e=>{e.stopPropagation();closeSheet("down")};
shGrab.onclick=e=>{e.stopPropagation();closeSheet("down")};
shBack.onclick=e=>{e.stopPropagation();backOrCloseSheet("right")};

/* Cử chỉ vuốt trên Sheet: Cập nhật trực tiếp 1:1 không qua rAF trễ nhịp, giữ cố định transform-origin 50% 50% */
(()=>{
  let x0=0,y0=0,dx=0,dy=0,t0=0,mode="",canPullDown=false,canSwipeRight=false;

  sheetPn.addEventListener("touchstart",e=>{
    if(e.touches.length!==1)return;
    const t=e.touches[0];
    x0=t.clientX;y0=t.clientY;dx=0;dy=0;t0=Date.now();mode="";
    const onHeader=!!e.target.closest(".sh-bar,.grab,.bk");
    const inHorizScroller=!!e.target.closest(".scroller");
    canPullDown=(sheetPn.scrollTop<=2)||onHeader;
    canSwipeRight=(x0<=56)||(!inHorizScroller&&x0<=window.innerWidth*0.52);
  },{passive:true});

  sheetPn.addEventListener("touchmove",e=>{
    if(!y0)return;
    const t=e.touches[0];
    const curX=t.clientX-x0,curY=t.clientY-y0;

    if(!mode){
      if(canSwipeRight&&curX>8&&Math.abs(curX)>Math.abs(curY)*1.15){
        mode="edge-x";
        sheetEl.classList.add("dragging");
      }else if(canPullDown&&curY>8&&curY>Math.abs(curX)*1.12){
        mode="pull-y";
        sheetEl.classList.add("dragging");
      }else if(Math.abs(curY)>8||Math.abs(curX)>8){
        mode="scroll";
      }
    }

    if(mode==="scroll"){
      const atTop=sheetPn.scrollTop<=0&&curY>0;
      const atBot=(sheetPn.scrollTop+sheetPn.clientHeight>=sheetPn.scrollHeight-1)&&curY<0;
      if((atTop||atBot)&&e.cancelable&&!e.target.closest(".scroller,.ep-grid")){
        e.preventDefault();
      }
      return;
    }

    if(mode==="pull-y"){
      if(e.cancelable)e.preventDefault();
      dy=Math.max(0,curY);
      const damp=dy<180?dy:180+(dy-180)*0.52;
      const p=Math.min(1,damp/window.innerHeight);
      const sc=1-p*0.36;
      sheetPn.style.transform=`translate3d(0,${damp}px,0) scale(${sc})`;
      sheetBd.style.opacity=String(Math.max(0,1-p*1.2));
    }else if(mode==="edge-x"){
      if(e.cancelable)e.preventDefault();
      dx=Math.max(0,curX);
      const p=Math.min(1,dx/window.innerWidth);
      const sc=1-p*0.44;
      /* Dịch chuyển tâm sang phải kết hợp thu nhỏ đồng thời về góc phải */
      sheetPn.style.transform=`translate3d(${dx*0.78}px,${dx*0.08}px,0) scale(${sc})`;
      sheetBd.style.opacity=String(Math.max(0,1-p*1.1));
    }
  },{passive:false});

  const endSheetTouch=()=>{
    if(!mode||mode==="scroll"){y0=0;mode="";return}
    const dt=Math.max(1,Date.now()-t0);
    sheetEl.classList.remove("dragging");

    if(mode==="pull-y"){
      const vy=dy/dt;
      if(dy>75||vy>0.35){
        closeSheet("down");
      }else{
        sheetPn.style.transition="transform .48s var(--ios-bounce)";
        sheetPn.style.transform="translate3d(0,0,0) scale(1)";
        sheetBd.style.opacity="1";
      }
    }else if(mode==="edge-x"){
      const vx=dx/dt;
      if(dx>window.innerWidth*0.20||vx>0.32){
        if(sheetHistory.length>0){
          sheetPn.style.transition="transform .30s cubic-bezier(.22,1,.36,1), opacity .26s ease";
          sheetPn.style.transform="translate3d(54%, 8%, 0) scale(.32)";
          sheetPn.style.opacity="0";
          setTimeout(()=>{
            resetSheetInlineStyles();
            backOrCloseSheet("right");
          },250);
        }else{
          closeSheet("right");
        }
      }else{
        sheetPn.style.transition="transform .48s var(--ios-bounce)";
        sheetPn.style.transform="translate3d(0,0,0) scale(1)";
        sheetBd.style.opacity="1";
      }
    }
    y0=0;dx=0;dy=0;mode="";
  };
  sheetPn.addEventListener("touchend",endSheetTouch,{passive:true});
  sheetPn.addEventListener("touchcancel",endSheetTouch,{passive:true});
})();

/* ---------- Cử Chỉ Vuốt Sang Phải 120fps Không Độ Trễ (Zero-Allocation & Pre-Composited GPU Layer) ---------- */
(()=>{
  const edgeWrap=$("#edgeBack"),edgePrev=$("#edgePrev"),edgeDim=$("#edgeDim"),edgeShadow=$("#edgeShadow"),pg=$("#page");
  let x0=0,y0=0,dx=0,lastX=0,lastT=0,vx=0,swiping=false,aborted=false,animating=false,W=window.innerWidth;
  addEventListener("resize",()=>{W=window.innerWidth});

  window.addEventListener("touchstart",e=>{
    if(animating||e.touches.length!==1)return;
    if(P.classList.contains("show")||sheetEl.classList.contains("show"))return;
    if(!pageHistory.length&&curView.type!=="cat")return;
    const t=e.touches[0];
    if(e.target.closest(".dock,input[type=range]"))return;

    const inHorizScroller=!!e.target.closest(".scroller");
    const isCatView=(curView.type==="cat");
    /* Trong giao diện mở rộng đề xuất (isCatView), cho phép vuốt từ giữa màn hình (tới 85% màn hình); ở các trang khác vuốt từ cạnh trái hoặc vùng không có thanh trượt ngang */
    const maxStartX=isCatView?(W*0.85):(inHorizScroller?42:(W*0.52));
    if(t.clientX>maxStartX)return;

    x0=t.clientX;y0=t.clientY;dx=0;
    lastX=x0;lastT=performance.now();vx=0;
    swiping=false;aborted=false;
  },{passive:true});

  window.addEventListener("touchmove",e=>{
    if(!x0||aborted||animating)return;
    const t=e.touches[0];
    const curX=t.clientX-x0,curY=t.clientY-y0;

    if(!swiping){
      if(Math.abs(curY)>Math.abs(curX)*0.85||curX<6){
        if(Math.abs(curY)>9)aborted=true;
        return;
      }
      swiping=true;
      x0=t.clientX; /* Đặt lại mốc 0 ngay tại điểm bắt đầu nhận diện để không bị giật nhảy 6px đầu */
      pg.style.transition="none";
      edgePrev.style.transition="none";
      edgeDim.style.transition="none";
      edgeShadow.style.transition="none";
      edgeWrap.classList.add("on");
      edgeShadow.classList.add("on");
    }

    if(swiping){
      if(e.cancelable)e.preventDefault();
      const now=performance.now();
      const dt=now-lastT;
      if(dt>4){
        vx=(t.clientX-lastX)/dt;
        lastX=t.clientX;lastT=now;
      }
      dx=Math.max(0,Math.min(W,t.clientX-x0));
      const p=dx/W;
      /* Trượt ngang 1:1 thuần translate3d trên GPU (không scale #page, không reflow) */
      pg.style.transform=`translate3d(${dx}px,0,0)`;
      edgeShadow.style.transform=`translate3d(${dx}px,0,0)`;
      edgeShadow.style.opacity=String(1-p);
      edgePrev.style.transform=`translate3d(${(-30*(1-p))}%,0,0)`;
      edgeDim.style.opacity=String((1-p)*0.9);
    }
  },{passive:false});

  const endEdgeSwipe=()=>{
    if(!swiping){x0=0;return}
    swiping=false;x0=0;
    const commit=(dx>W*0.24)||(vx>0.35&&dx>24);
    /* Thời gian hoàn tất tự động khớp với vận tốc hất ngón tay */
    const rem=commit?(W-dx):dx;
    const ms=Math.max(190,Math.min(320,Math.round(rem/Math.max(0.75,Math.abs(vx))*0.55)));
    const ease=`${ms}ms cubic-bezier(.20,1,.30,1)`;

    animating=true;
    pg.style.transition=`transform ${ease}`;
    edgeShadow.style.transition=`transform ${ease}, opacity ${ms}ms ease`;
    edgePrev.style.transition=`transform ${ease}`;
    edgeDim.style.transition=`opacity ${ms}ms ease`;

    if(commit){
      pg.style.transform=`translate3d(${W}px,0,0)`;
      edgeShadow.style.transform=`translate3d(${W}px,0,0)`;
      edgeShadow.style.opacity="0";
      edgePrev.style.transform=`translate3d(0%,0,0)`;
      edgeDim.style.opacity="0";
      setTimeout(()=>{
        pg.style.transition="none";
        pg.style.transform="translate3d(0,0,0)";
        edgeWrap.classList.remove("on");
        edgeShadow.classList.remove("on");
        restorePreviousPage();
        animating=false;
      },ms+10);
    }else{
      pg.style.transform=`translate3d(0px,0,0)`;
      edgeShadow.style.transform=`translate3d(0px,0,0)`;
      edgePrev.style.transform=`translate3d(-30%,0,0)`;
      edgeDim.style.opacity="1";
      setTimeout(()=>{
        pg.style.transition="none";
        pg.style.transform="translate3d(0,0,0)";
        edgeWrap.classList.remove("on");
        edgeShadow.classList.remove("on");
        animating=false;
      },ms+10);
    }
  };
  window.addEventListener("touchend",endEdgeSwipe,{passive:true});
  window.addEventListener("touchcancel",endEdgeSwipe,{passive:true});
})();

const V=$("#v"),EMB=$("#emb"),P=$("#player"),CTL=$("#ctl");let list=[],idx=0,idle,saveT=0,hlsInstance=null,playerMode="m3u8";

function startEmbedInPlayer(it){

async function startNativeVideoM3u8(it,resumeSec){
  const cleanUrl=await getCleanM3u8BlobUrl(it.m3u8);
  V.src=cleanUrl||it.m3u8;
  V.onloadedmetadata=()=>{
    if(resumeSec>10&&resumeSec<V.duration-20){V.currentTime=resumeSec;toast("Tiếp tục từ "+fmt(resumeSec))}
    else toast("Đang phát Tập "+it.epName+" (Đã lọc QC)");
  };
  try{await V.play()}catch{}
}

async function loadItem(){
  const it=list[idx];if(!it)return;
  $("#pt").textContent=`${it.title}${it.epName?" · Tập "+it.epName:""}`;
  toast("Đang nạp luồng siêu tốc…",4000);
  const pr=store.get("prog",{})[it.identifier];
  const resumeSec=it.resumeTime||((pr&&pr.eIdx===it.eIdx&&pr.sIdx===it.sIdx&&pr.t>10)?pr.t:0);

  if(list[idx+1]?.m3u8)setTimeout(()=>getCleanM3u8BlobUrl(list[idx+1].m3u8),2000);

  if(playerMode==="embed"||(!it.m3u8&&it.embed)){
    startEmbedInPlayer(it);
    save();
    return;
  }

  P.classList.remove("embed-mode");
  EMB.src="about:blank";EMB.style.display="none";
  V.style.display="block";

  if(typeof Hls!=="undefined"&&Hls.isSupported()){
    if(hlsInstance)hlsInstance.destroy();
    hlsInstance = new Hls({
      loader:CleanHlsLoader||Hls.DefaultConfig.loader,
      startFragPrefetch:true,
      maxBufferLength:20,
      maxMaxBufferLength:40,
      manifestLoadingTimeOut:8000,
      fragLoadingTimeOut:10000
    });
    hlsInstance.loadSource(it.m3u8);
    hlsInstance.attachMedia(V);
    hlsInstance.on(Hls.Events.MANIFEST_PARSED,()=>{
      if(resumeSec>10){V.currentTime=resumeSec;toast("Tiếp tục từ "+fmt(resumeSec))}
      else toast("Đang phát Tập "+it.epName+" (Đã lọc QC)");
      V.play().catch(()=>{});
    });
    hlsInstance.on(Hls.Events.ERROR,(_,data)=>{
      if(data.fatal){
        if(data.type===Hls.ErrorTypes.MEDIA_ERROR){
          hlsInstance.recoverMediaError();
        }else if(V.canPlayType("application/vnd.apple.mpegurl")){
          hlsInstance.destroy();hlsInstance=null;
          startNativeVideoM3u8(it,resumeSec);
        }else if(it.embed){
          startEmbedInPlayer(it);
        }else{
          toast("Luồng phim hiện tại bị lỗi, hãy đổi Server khác.");
        }
      }
    });
  }else if(V.canPlayType("application/vnd.apple.mpegurl")){
    await startNativeVideoM3u8(it,resumeSec);
  }else if(it.embed){
    startEmbedInPlayer(it);
  }
  wake();
}

function save(){
  const it=list[idx];if(!it)return;
  const p=store.get("prog",{});
  p[it.identifier]={
    t:playerMode==="m3u8"?V.currentTime:(it.resumeTime||15),
    d:playerMode==="m3u8"?(V.duration||0):0,
    title:it.title,
    epName:it.epName,
    img:it.img,
    providerId:it.providerId,
    slug:it.slug,
    sIdx:it.sIdx,
    eIdx:it.eIdx,

  store.set("prog",p);
}

function closePlayer(dir="down"){

/* Vuốt Player trực tiếp 1:1:
   - Vuốt từ góc/cạnh trái sang phải -> Thu nhỏ về góc phải
   - Vuốt từ trên xuống -> Thu nhỏ xuống góc dưới */
let pDragging=false;
(()=>{
  let px0=0,py0=0,pdx=0,pdy=0,pMode="";
  P.addEventListener("touchstart",e=>{
    if(P.classList.contains("rot")||document.fullscreenElement)return;
    const t=e.touches[0];
    if(t.clientY<150||t.clientX<65){
      px0=t.clientX;py0=t.clientY;
      pdx=0;pdy=0;pMode="";
      pDragging=false;
    }else{px0=0;py0=0}
  },{passive:true});

  P.addEventListener("touchmove",e=>{
    if((!py0&&!px0)||P.classList.contains("rot"))return;
    const t=e.touches[0];
    const dx=t.clientX-px0,dy=t.clientY-py0;
    if(!pMode){
      if(px0<65&&dx>8&&Math.abs(dx)>Math.abs(dy)){pMode="x"}
      else if(py0<150&&dy>8&&Math.abs(dy)>Math.abs(dx)){pMode="y"}
      else return;
      pDragging=true;
      P.classList.add("dragging");
      P.style.borderRadius="34px";
    }
    if(pMode==="y"&&dy>0){
      pdy=Math.pow(dy,0.92);
      const sc=Math.max(0.68,1-pdy/1100);
      P.style.transform=`translate3d(-50%,calc(-50% + ${pdy}px),0) scale(${sc})`;
    }else if(pMode==="x"&&dx>0){
      pdx=dx;
      const sc=Math.max(0.62,1-pdx/950);
      P.style.transform=`translate3d(calc(-50% + ${pdx*0.85}px),calc(-50% + ${pdx*0.08}px),0) scale(${sc})`;
    }
  },{passive:true});

  const endPlayerDrag=()=>{
    if(!pDragging)return;
    P.classList.remove("dragging");
    if(pMode==="x"&&pdx>80){
      closePlayer("right");
    }else if(pMode==="y"&&pdy>80){
      closePlayer("down");
    }else{
      P.style.transition="transform .48s var(--ios-bounce), border-radius .3s ease";
      P.style.transform="";
      P.style.borderRadius="";
    }
    setTimeout(()=>{pDragging=false},60);
    px0=0;py0=0;pdx=0;pdy=0;pMode="";
  };
  P.addEventListener("touchend",endPlayerDrag,{passive:true});
  P.addEventListener("touchcancel",endPlayerDrag,{passive:true});
})();

  padding:max(18px,var(--sab)) max(24px,calc(var(--sab) + 12px)) max(18px,var(--sat)) max(24px,calc(var(--sat) + 12px))!important;
}`;
document.head.appendChild(st);

const fsb=$("#fs"),pq=matchMedia("(orientation:portrait)");
const FS_ENTER='<svg viewBox="0 0 24 24" style="fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
const FS_EXIT='<svg viewBox="0 0 24 24" style="fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
let fsOn=false;
const real=()=>document.fullscreenElement||document.webkitFullscreenElement;

function applyRot(){
  const need=fsOn&&pq.matches;
  const wasRot=P.classList.contains("rot");
  if(wasRot&&!need){
    P.classList.remove("rot");
    P.classList.add("rot-out");
    setTimeout(()=>P.classList.remove("rot-out"),430);
  }else if(!wasRot&&need){
    P.classList.remove("rot-out");
    P.classList.add("rot");
  }
  fsb.innerHTML=fsOn?FS_EXIT:FS_ENTER;
  applyCfg();
}

async function enterFS(){
  fsOn=true;
  applyRot();
  try{
    const f=P.requestFullscreen||P.webkitRequestFullscreen;
    if(f)await f.call(P);
  }catch{}
  try{await screen.orientation?.lock?.("landscape")}catch{}
  applyRot();
  wake();
}

function exitFS(){
  if(!fsOn&&!real())return;
  fsOn=false;
  try{screen.orientation?.unlock?.()}catch{}
  try{
    if(real())(document.exitFullscreen||document.webkitExitFullscreen).call(document);
  }catch{}
  applyRot();
  wake();
}

fsb.onclick=e=>{
  e.stopPropagation();
  fsOn?exitFS():enterFS();
};
pq.addEventListener("change",applyRot);
addEventListener("resize",applyRot);
addEventListener("orientationchange",applyRot);
["fullscreenchange","webkitfullscreenchange"].forEach(t=>document.addEventListener(t,()=>{if(fsOn&&!real()&&!P.classList.contains("rot"))exitFS()}));
const closeOrig=closePlayer;
closePlayer=function(dir="down"){exitFS();closeOrig(dir)};
})();
</script>
