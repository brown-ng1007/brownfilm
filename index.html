<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#000;--sub:#6c6c70;--glass:rgba(255,255,255,.62);--accent:#0a84ff;--line:rgba(60,60,67,.16);--shadow:0 8px 30px rgba(0,0,0,.12);--r:22px;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
:root[data-theme=dark]{--bg:#000;--card:#1c1c1e;--text:#fff;--sub:#98989f;--glass:rgba(30,30,32,.6);--line:rgba(255,255,255,.14);--shadow:0 8px 30px rgba(0,0,0,.55)}
@media(prefers-color-scheme:dark){:root[data-theme=auto]{--bg:#000;--card:#1c1c1e;--text:#fff;--sub:#98989f;--glass:rgba(30,30,32,.6);--line:rgba(255,255,255,.14);--shadow:0 8px 30px rgba(0,0,0,.55)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
img{display:block}
#page{padding:calc(var(--sat) + 12px) 0 calc(var(--sab) + 110px);min-height:100vh;animation:fade .28s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
::view-transition-old(root){animation:.25s ease both fadeout}::view-transition-new(root){animation:.4s cubic-bezier(.2,.8,.2,1) both in}
@keyframes fadeout{to{opacity:0;transform:scale(.98)}}
.glass{background:var(--glass);border:.5px solid var(--line)}
.tabs.glass{-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transform:translateZ(0);will-change:transform}
#player .glass{background:rgba(0,0,0,.45);border-color:rgba(255,255,255,.12)}
#rows section{content-visibility:auto;contain-intrinsic-size:auto 250px}
body.sheeted #page{visibility:hidden}
h1{font-size:34px;letter-spacing:-.8px;margin:8px 20px 14px;font-weight:800}
h2{font-size:21px;letter-spacing:-.4px;margin:26px 20px 10px;font-weight:700}
.scroller{contain:layout paint;display:flex;gap:12px;overflow-x:auto;padding:4px 20px 14px;scroll-snap-type:x proximity;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.card{flex:0 0 128px;scroll-snap-align:start;text-align:left;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.card:active{transform:scale(.94)}
.card .p{width:128px;aspect-ratio:2/3;border-radius:16px;object-fit:cover;background:var(--card)}
.card b{display:block;font-size:13px;margin-top:8px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card small{color:var(--sub);font-size:12px}
.card.wide{flex-basis:230px}.card.wide .p{width:230px;aspect-ratio:16/10}
.bar{position:relative;height:3px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:6px;overflow:hidden}.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.sk{background:var(--card);border-radius:16px;flex:0 0 128px;aspect-ratio:2/3}
@keyframes sh{to{background-position:-200% 0}}
.hero{margin:0 20px;position:relative;border-radius:30px;overflow:hidden;aspect-ratio:4/5;max-height:62vh;width:calc(100% - 40px);display:block;text-align:left;color:#fff}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.85))}
.hero div{position:absolute;left:20px;right:20px;bottom:20px;z-index:1}.hero b{font-size:28px;letter-spacing:-.6px;display:block}.hero span{opacity:.8;font-size:14px}
.tabs{position:fixed;left:16px;right:16px;bottom:calc(var(--sab) + 12px);z-index:30;display:flex;border-radius:32px;padding:6px;box-shadow:var(--shadow)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:26px;font-size:10.5px;font-weight:600;color:var(--sub);transition:.3s}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent);background:rgba(120,120,128,.16)}
.search{margin:0 20px 8px;display:flex;gap:8px;align-items:center;border-radius:14px;padding:10px 14px;background:rgba(120,120,128,.16)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px;padding:8px 20px}
.grid .card{flex:none}.grid .card .p{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 20px}.chip{padding:8px 14px;border-radius:20px;background:rgba(120,120,128,.16);font-size:14px}
.list{margin:0 20px 16px;border-radius:var(--r);background:var(--card);overflow:hidden}
.list>div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:.5px solid var(--line)}.list>div:last-child{border:0}
.list input[type=text],.list input[type=password]{background:none;border:0;outline:0;color:var(--text);text-align:right;flex:1;min-width:0;font-size:15px}
.seg{display:flex;background:rgba(120,120,128,.2);border-radius:10px;padding:2px}.seg button{padding:6px 12px;border-radius:8px;font-size:14px;font-weight:600}.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.note{color:var(--sub);font-size:13px;margin:0 28px 14px}
.btn{background:var(--accent);color:#fff;border-radius:14px;padding:12px 18px;font-weight:700;display:inline-flex;gap:8px;align-items:center;transition:transform .2s}.btn:active{transform:scale(.95)}.btn.g{background:rgba(120,120,128,.22);color:var(--text)}
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.show{display:block}
#sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .35s}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;top:calc(var(--sat) + 22px);background:var(--bg);border-radius:30px 30px 0 0;overflow-y:auto;transform:translate3d(0,100%,0);transition:transform .42s cubic-bezier(.2,.9,.2,1);will-change:transform;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(var(--sab) + 30px)}
#sheet.open .bd{opacity:1}#sheet.open .pn{transform:translate3d(0,0,0)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto;position:sticky;top:6px;z-index:3}
.bk{position:relative;aspect-ratio:16/10;margin-top:-18px}.bk img{width:100%;height:100%;object-fit:cover}.bk:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,var(--bg))}
.dt{padding:0 20px;margin-top:-34px;position:relative;z-index:1}.dt h3{font-size:28px;letter-spacing:-.6px;margin:0 0 6px}.meta{color:var(--sub);font-size:14px;display:flex;gap:10px;flex-wrap:wrap}
.rate{color:#ffb800;font-weight:700}.acts{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}.dt p{line-height:1.5}
.prov{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}.prov span{background:var(--card);border-radius:12px;padding:7px 12px;font-size:13px;font-weight:600}
.tr{aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;margin:10px 0}.tr iframe{width:100%;height:100%;border:0}
#player{position:fixed;inset:0;z-index:80;background:#000;display:none;color:#fff;user-select:none;-webkit-user-select:none}
#player.show{display:block;animation:in .4s}
#player video{width:100%;height:100%;object-fit:contain;background:#000}
.ctl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(var(--sat) + 12px) 16px calc(var(--sab) + 16px);background:linear-gradient(rgba(0,0,0,.55),transparent 30%,transparent 60%,rgba(0,0,0,.7));transition:opacity .35s}
#player.idle .ctl{opacity:0;pointer-events:none}
.top{display:flex;align-items:center;gap:12px}.top b{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}.rb svg{width:22px;height:22px;fill:#fff}
.mid{display:flex;justify-content:center;align-items:center;gap:36px}.mid .rb{width:54px;height:54px}.mid .big{width:80px;height:80px}.mid .big svg{width:34px;height:34px}
.bot .row{display:flex;align-items:center;gap:10px;font-size:12px;font-variant-numeric:tabular-nums}
.bot input[type=range]{flex:1;accent-color:#fff;height:24px}
.bot .row2{display:flex;justify-content:space-between;margin-top:6px}
.toast{position:absolute;left:50%;bottom:calc(var(--sab) + 120px);transform:translate(-50%,20px);padding:12px 18px;border-radius:20px;opacity:0;transition:.4s;z-index:3;white-space:nowrap;font-size:14px}.toast.on{opacity:1;transform:translate(-50%,0)}
.sp{display:flex;justify-content:center;padding:40px}.sp i{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.empty{color:var(--sub);text-align:center;padding:30px 40px}
</style>
</head>
<body>
<div id="page"></div>
<nav class="tabs glass" id="tabs"></nav>
<div id="sheet"><div class="bd"></div><div class="pn"><div class="grab"></div><div id="sc"></div></div></div>
<div id="player">
  <video id="v" playsinline webkit-playsinline preload="metadata"></video>
  <div class="ctl" id="ctl">
    <div class="top"><button class="rb glass" id="pc" aria-label="Đóng"><svg viewBox="0 0 24 24"><path d="M6.4 5L5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6z"/></svg></button><b id="pt"></b><button class="rb glass" id="pn" aria-label="Tập sau"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zM16 6h2v12h-2z"/></svg></button></div>
    <div class="mid"><button class="rb glass" id="bk10"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 11-6 6H4a8 8 0 108-8z"/></svg></button><button class="rb big glass" id="pp"><svg viewBox="0 0 24 24" id="ppi"><path d="M8 5v14l11-7z"/></svg></button><button class="rb glass" id="fw10"><svg viewBox="0 0 24 24" style="transform:scaleX(-1)"><path d="M12 5V1L7 6l5 5V7a6 6 0 11-6 6H4a8 8 0 108-8z"/></svg></button></div>
    <div class="bot"><div class="row"><span id="tc">0:00</span><input type="range" id="sk" min="0" max="1000" value="0"><span id="td">0:00</span></div>
    <div class="row2"><button class="chip glass" id="spd">1×</button><button class="chip glass" id="an">Tự chuyển: Bật</button><button class="rb glass" id="fs" aria-label="Toàn màn hình"><svg viewBox="0 0 24 24"><path d="M5 5h5v2H7v3H5zm9 0h5v5h-2V7h-3zM5 14h2v3h3v2H5zm12 0h2v5h-5v-2h3z"/></svg></button></div></div>
  </div>
  <div class="toast glass" id="toast"></div>
</div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
const norm=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").toLowerCase();
const vt=fn=>fn();
let cfg=Object.assign({theme:"auto",tmdb:"",omdb:"",autonext:true},store.get("cfg",{}));
const DEFAULT_TMDB="3309069624518eb702e51e01c9ad58f8";if(!cfg.tmdb)cfg.tmdb=DEFAULT_TMDB;if(!cfg.omdb)cfg.omdb="8299aee2";
const saveCfg=()=>{store.set("cfg",cfg);applyTheme()};
function applyTheme(){document.documentElement.dataset.theme=cfg.theme;const dark=cfg.theme=="dark"||(cfg.theme=="auto"&&matchMedia("(prefers-color-scheme:dark)").matches);document.querySelector('meta[name=theme-color]').content=dark?"#000000":"#f2f2f7"}
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",applyTheme);applyTheme();

/* ---------- TMDB ---------- */
const IMG="https://image.tmdb.org/t/p/";
async function tmdb(path,q={}){
  if(!cfg.tmdb)throw new Error("nokey");
  const u=new URL("https://api.themoviedb.org/3"+path);u.searchParams.set("language","vi-VN");
  const h={};if(cfg.tmdb.startsWith("eyJ"))h.Authorization="Bearer "+cfg.tmdb;else u.searchParams.set("api_key",cfg.tmdb);
  for(const k in q)u.searchParams.set(k,q[k]);
  const r=await fetch(u,{headers:h});if(!r.ok)throw new Error(r.status);return r.json();
}
const cache=new Map();const ctmdb=(p,q)=>{const k=p+JSON.stringify(q||{});if(!cache.has(k))cache.set(k,tmdb(p,q).catch(e=>{cache.delete(k);throw e}));return cache.get(k)};
const ROWS=[
 {t:"Xu hướng tuần này",f:()=>ctmdb("/trending/all/week").then(d=>d.results)},
 {t:"Gợi ý cho bạn",f:async()=>{const h=store.get("seen",[]);if(!h.length)return(await ctmdb("/movie/popular")).results;const l=h[0];return(await ctmdb(`/${l.type}/${l.id}/recommendations`)).results},sub:()=>{const h=store.get("seen",[]);return h.length?"Dựa trên: "+h[0].title:""}},
 {t:"Hay nhất mọi thời đại",f:async()=>{const a=await Promise.all([1,2,3].map(p=>ctmdb("/movie/top_rated",{page:p})));return a.flatMap(x=>x.results).sort((a,b)=>b.vote_average-a.vote_average)},rank:1},
 {t:"Phim trên Netflix",f:async()=>(await ctmdb("/discover/movie",{with_watch_providers:8,watch_region:"VN",sort_by:"popularity.desc"})).results},
 {t:"Châu Tinh Trì",f:async()=>{const p=await ctmdb("/search/person",{query:"Stephen Chow"});const id=p.results[0]?.id;return(await ctmdb("/discover/movie",{with_people:id,sort_by:"vote_average.desc","vote_count.gte":100})).results}},
 {t:"Đang chiếu rạp Việt Nam",f:async()=>(await ctmdb("/movie/now_playing",{region:"VN"})).results},
 {t:"Đang chiếu rạp quốc tế",f:async()=>(await ctmdb("/movie/now_playing",{region:"US"})).results},
];
const poster=(m,w="w342")=>m.poster_path?IMG+w+m.poster_path:"data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="2" height="3"><rect width="2" height="3" fill="#8884"/></svg>');
const ttl=m=>m.title||m.name||"";
const cardHTML=(m,i,rank)=>m.media_type=="person"?"":`<button class="card" data-t="${m.media_type||(m.first_air_date?"tv":"movie")}" data-id="${m.id}"><img class="p" loading="lazy" decoding="async" src="${poster(m)}" alt=""><b>${rank?(i+1)+". ":""}${esc(ttl(m))}</b><small>★ ${(m.vote_average||0).toFixed(1)} · ${(m.release_date||m.first_air_date||"").slice(0,4)}</small></button>`;

/* ---------- Pages ---------- */
const ICON={home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',lib:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M10 9l5 3-5 3z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',me:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'};
const TABS=[["home","Khám phá"],["lib","Thư viện"],["search","Tìm kiếm"],["me","Cài đặt"]];
let tab="home";
$("#tabs").innerHTML=TABS.map(([k,l])=>`<button data-k="${k}"><svg viewBox="0 0 24 24">${ICON[k]}</svg>${l}</button>`).join("");
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(b)go(b.dataset.k)};
function go(k){tab=k;vt(()=>{[...$("#tabs").children].forEach(b=>b.classList.toggle("on",b.dataset.k==k));$("#page").style.animation="none";void $("#page").offsetWidth;$("#page").style.animation="";scrollTo(0,0);({home:pHome,lib:pLib,search:pSearch,me:pMe})[k]()})}
const keyNote=()=>`<div class="empty">Cần khoá API TMDB miễn phí để hiện danh sách phim.<br><br><button class="btn" onclick="go('me')">Mở Cài đặt</button></div>`;
const contRow=()=>{
  const p=store.get("prog",{}),y=store.get("ytprog",{});
  const a=[...Object.entries(p).map(([id,v])=>({k:"a",id,...v})),...Object.entries(y).map(([id,v])=>({k:"y",id,...v}))].filter(v=>v.t>10&&v.t<v.d-15).sort((a,b)=>b.u-a.u);
  if(!a.length)return"";
  return`<h2>Xem tiếp</h2><div class="scroller">${a.map(v=>v.k=="a"
   ?`<button class="card wide" data-play="${v.id}"><img class="p" src="https://archive.org/services/img/${v.id}" alt=""><b>${esc(v.title)}</b><div class="bar"><i style="width:${v.t/v.d*100}%"></i></div></button>`
   :`<button class="card wide" data-resume="${v.type}:${v.id}"><img class="p" src="${v.img}" alt=""><b>Trailer · ${esc(v.title)}</b><div class="bar"><i style="width:${v.t/v.d*100}%"></i></div></button>`).join("")}</div>`};
async function pHome(){
  const pg=$("#page");pg.innerHTML=`<h1>Khám phá</h1>${contRow()}<div id="rows"></div>`;
  if(!cfg.tmdb){$("#rows").innerHTML=keyNote();return}
  $("#rows").innerHTML=ROWS.map((r,i)=>`<section id="r${i}"><h2>${r.t}</h2>${r.sub?`<div class="note" style="margin:-6px 20px 6px" id="s${i}"></div>`:""}<div class="scroller">${'<div class="sk"></div>'.repeat(4)}</div></section>`).join("");
  ROWS.forEach(async(r,i)=>{try{let d=(await r.f()).filter(m=>m.poster_path);if(i==0&&d[0]){const h=d[0];$("#page").insertAdjacentHTML("afterbegin",`<button class="hero" data-t="${h.media_type||"movie"}" data-id="${h.id}"><img src="${IMG}w780${h.backdrop_path||h.poster_path}" alt=""><div><span>Nổi bật tuần này</span><b>${esc(ttl(h))}</b><span>★ ${h.vote_average.toFixed(1)}</span></div></button>`);const hh=$("#page h1");$("#page").prepend(hh);}
    $(`#r${i} .scroller`).innerHTML=d.slice(0,20).map((m,j)=>cardHTML(m,j,r.rank)).join("")||'<div class="empty">Không có dữ liệu</div>';if(r.sub)$(`#s${i}`).textContent=r.sub()}catch(e){$(`#r${i} .scroller`).innerHTML=`<div class="empty">${e.message=="401"?"Khoá API không đúng":"Không tải được"}</div>`}});
}
let LIB=null;
async function loadLib(){if(LIB)return LIB;const u="https://archive.org/advancedsearch.php?q=collection%3Afeature_films+AND+mediatype%3Amovies&fl%5B%5D=identifier&fl%5B%5D=title&fl%5B%5D=year&rows=60&sort%5B%5D=downloads+desc&output=json";const r=await fetch(u).then(r=>r.json());return LIB=r.response.docs}
async function pLib(){
  $("#page").innerHTML=`<h1>Thư viện</h1><div class="note" style="margin-top:-8px">Phim phạm vi công cộng từ Internet Archive – xem miễn phí, hợp pháp.</div>${contRow()}<div class="sp"><i></i></div>`;
  try{const d=await loadLib();if(tab!="lib")return;$("#page .sp").outerHTML=`<h2>Tất cả phim</h2><div class="grid">${d.map((m,i)=>`<button class="card" data-lib="${i}"><img class="p" loading="lazy" decoding="async" src="https://archive.org/services/img/${m.identifier}" alt=""><b>${esc(m.title)}</b><small>${m.year||""}</small></button>`).join("")}</div>`}catch{$("#page .sp").outerHTML='<div class="empty">Không tải được thư viện</div>'}
}
let st;
function pSearch(){
  const rec=store.get("recent",[]);
  $("#page").innerHTML=`<h1>Tìm kiếm</h1><label class="search glass"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ICON.search}</svg><input id="q" placeholder="Tên phim, diễn viên…" autocomplete="off" enterkeyhint="search"></label><div id="res">${rec.length?`<h2>Gần đây</h2><div class="chips">${rec.map(r=>`<button class="chip" data-q="${esc(r)}">${esc(r)}</button>`).join("")}</div>`:`<div class="empty">Gõ để tìm. Không cần gõ dấu tiếng Việt.</div>`}</div>`;
  $("#q").oninput=e=>{clearTimeout(st);st=setTimeout(()=>doSearch(e.target.value.trim()),300)};
  $("#page").onclick=e=>{const c=e.target.closest("[data-q]");if(c){$("#q").value=c.dataset.q;doSearch(c.dataset.q)}};
}
async function doSearch(q){
  const res=$("#res");if(!res)return;if(q.length<2){pSearch();return}
  res.innerHTML='<div class="sp"><i></i></div>';let h="";
  try{const l=(await loadLib()).map((m,i)=>[m,i]).filter(([m])=>norm(m.title).includes(norm(q))).slice(0,12);
   if(l.length)h+=`<h2>Xem miễn phí</h2><div class="grid">${l.map(([m,i])=>`<button class="card" data-lib="${i}"><img class="p" src="https://archive.org/services/img/${m.identifier}" alt=""><b>${esc(m.title)}</b><small>${m.year||""}</small></button>`).join("")}</div>`}catch{}
  if(cfg.tmdb){try{const d=(await tmdb("/search/multi",{query:q})).results.filter(m=>m.media_type!="person"&&m.poster_path);
   if(d.length)h+=`<h2>Kết quả TMDB</h2><div class="grid">${d.map(m=>cardHTML(m)).join("")}</div>`}catch{}}
  if($("#q")?.value.trim()!=q)return;
  res.innerHTML=h||'<div class="empty">Không tìm thấy kết quả.</div>';
  const r=[q,...store.get("recent",[]).filter(x=>x!=q)].slice(0,8);store.set("recent",r);
}
function pMe(){
  $("#page").innerHTML=`<h1>Cài đặt</h1>
  <h2 style="font-size:14px;color:var(--sub);text-transform:uppercase;margin-bottom:6px">Giao diện</h2>
  <div class="list"><div><span>Chế độ</span><span class="seg" id="th">${[["auto","Hệ thống"],["light","Sáng"],["dark","Tối"]].map(([k,l])=>`<button data-v="${k}" class="${cfg.theme==k?"on":""}">${l}</button>`).join("")}</span></div></div>
  <h2 style="font-size:14px;color:var(--sub);text-transform:uppercase;margin-bottom:6px">Nguồn dữ liệu</h2>
  <div class="list"><div><span>TMDB key</span><input type="password" id="k1" placeholder="Dán khoá API" value="${esc(cfg.tmdb)}"></div><div><span>OMDb key</span><input type="password" id="k2" placeholder="Tuỳ chọn – điểm IMDb" value="${esc(cfg.omdb)}"></div></div>
  <p class="note">Lấy khoá miễn phí tại themoviedb.org/settings/api (TMDB) và omdbapi.com (điểm IMDb). Khoá chỉ lưu trên máy bạn.</p>
  <div style="padding:0 20px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="sv">Lưu & tải lại</button><button class="btn g" id="cl">Xoá tiến trình xem</button></div>
  <p class="note" style="margin-top:18px">Thêm vào màn hình chính: Safari → Chia sẻ → Thêm vào MH chính. Phim trên Netflix/rạp được hiển thị thông tin và nơi xem hợp pháp, không phát lại trong app.</p>`;
  $("#th").onclick=e=>{const b=e.target.closest("button");if(!b)return;vt(()=>{cfg.theme=b.dataset.v;saveCfg();[...$("#th").children].forEach(x=>x.classList.toggle("on",x==b))})};
  $("#sv").onclick=()=>{cfg.tmdb=$("#k1").value.trim();cfg.omdb=$("#k2").value.trim();saveCfg();cache.clear();go("home")};
  $("#cl").onclick=()=>{store.set("prog",{});store.set("seen",[]);alert("Đã xoá")};
}

/* ---------- Detail sheet ---------- */
let shT;function openSheet(){const s=$("#sheet");clearTimeout(shT);s.classList.add("show");requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add("open")));shT=setTimeout(()=>document.body.classList.add("sheeted"),480)}
function closeSheet(){ytStop();clearTimeout(shT);document.body.classList.remove("sheeted");const s=$("#sheet");s.classList.remove("open");setTimeout(()=>{s.classList.remove("show");$("#sc").innerHTML=""},450)}
$("#sheet .bd").onclick=closeSheet;
(()=>{let y0=0;const pn=$("#sheet .pn");pn.addEventListener("touchstart",e=>y0=e.touches[0].clientY,{passive:true});pn.addEventListener("touchend",e=>{if(pn.scrollTop<=0&&e.changedTouches[0].clientY-y0>110)closeSheet()})})();
/* YouTube trailer + tiến trình */
let YTP=null,ytTimer=null,ytMeta=null,ytReady=null;
function loadYT(){return ytReady||(ytReady=new Promise(res=>{if(window.YT&&YT.Player)return res();window.onYouTubeIframeAPIReady=res;const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";document.head.appendChild(s)}))}
function ytSave(){try{if(!YTP||!ytMeta||!YTP.getDuration)return;const d=YTP.getDuration(),t=YTP.getCurrentTime();if(!d||!(t>=0))return;const p=store.get("ytprog",{});if(t>d-15)delete p[ytMeta.k];else p[ytMeta.k]={t,d,title:ytMeta.title,img:ytMeta.img,type:ytMeta.k.split(":")[0],id:ytMeta.k.split(":")[1],u:Date.now()};store.set("ytprog",p)}catch{}}
async function ytPlay(key,k,title,img,start){
  await loadYT();ytMeta={k,title,img};clearInterval(ytTimer);
  YTP=new YT.Player("ytp",{videoId:key,width:"100%",height:"100%",playerVars:{autoplay:1,playsinline:1,rel:0,start:Math.floor(start||0),origin:location.origin},events:{onStateChange:e=>{if(e.data==2||e.data==0)ytSave()}}});
  ytTimer=setInterval(ytSave,3000);
}
function ytStop(){ytSave();clearInterval(ytTimer);try{YTP?.destroy()}catch{}YTP=null}
addEventListener("pagehide",ytSave);document.addEventListener("visibilitychange",()=>{if(document.hidden)ytSave()});
async function openDetail(type,id,auto){
  $("#sc").innerHTML='<div class="sp"><i></i></div>';openSheet();
  try{
    const m=await tmdb(`/${type}/${id}`,{append_to_response:"videos,watch/providers,recommendations,external_ids",include_video_language:"vi,en,null"});
    const seen=[{id,type,title:ttl(m)},...store.get("seen",[]).filter(x=>x.id!=id)].slice(0,20);store.set("seen",seen);
    const tr=(m.videos?.results||[]).find(v=>v.site=="YouTube"&&v.type=="Trailer")||(m.videos?.results||[])[0];
    const pv=m["watch/providers"]?.results?.VN||{},names=[...new Set([...(pv.flatrate||[]),...(pv.rent||[]),...(pv.buy||[])].map(x=>x.provider_name))];
    const rt=m.runtime?m.runtime+" phút":(m.number_of_seasons?m.number_of_seasons+" mùa":"");
    $("#sc").innerHTML=`<div class="bk"><img src="${m.backdrop_path?IMG+"w780"+m.backdrop_path:poster(m,"w500")}" alt=""></div><div class="dt"><h3>${esc(ttl(m))}</h3>
    <div class="meta"><span class="rate">★ ${m.vote_average.toFixed(1)} TMDB</span><span id="imdb"></span><span>${(m.release_date||m.first_air_date||"").slice(0,4)}</span><span>${rt}</span><span>${(m.genres||[]).map(g=>esc(g.name)).join(", ")}</span></div>
    <div class="acts"><a class="btn" style="text-decoration:none" href="${pv.link||`https://www.themoviedb.org/${type}/${id}/watch?locale=VN`}" target="_blank" rel="noopener">🎬 Xem phim</a>${tr?`<button class="btn g" id="tb">▶ Xem trailer</button>`:""}</div>
    <div id="trw"></div>${names.length?`<b>Có thể xem trên</b><div class="prov">${names.map(n=>`<span>${esc(n)}</span>`).join("")}</div>`:`<div class="note" style="margin:0 0 8px">Chưa có dịch vụ hợp pháp nào tại Việt Nam cho phim này. Phim đang chiếu rạp thì xem ở rạp.</div>`}
    <p>${esc(m.overview||"Chưa có mô tả tiếng Việt.")}</p>
    ${m.recommendations?.results?.length?`<h2 style="margin-left:0">Tương tự</h2><div class="scroller" style="margin:0 -20px">${m.recommendations.results.filter(x=>x.poster_path).slice(0,12).map(x=>cardHTML({...x,media_type:type})).join("")}</div>`:""}</div>`;
    const yk=type+":"+id,old=store.get("ytprog",{})[yk];
    if(old&&old.t>10&&old.t<old.d-15&&$("#tb"))$("#tb").textContent="▶ Xem tiếp trailer ("+fmt(old.t)+")";
    $("#tb")?.addEventListener("click",()=>{$("#trw").innerHTML=`<div class="tr"><div id="ytp"></div></div>`;$("#tb").remove();ytPlay(tr.key,yk,ttl(m),m.backdrop_path?IMG+"w780"+m.backdrop_path:poster(m),old&&old.t<old.d-15?old.t:0)});
    if(auto&&$("#tb"))$("#tb").click();
    const iid=m.external_ids?.imdb_id;if(cfg.omdb&&iid)fetch(`https://www.omdbapi.com/?apikey=${cfg.omdb}&i=${iid}`).then(r=>r.json()).then(o=>{if(o.imdbRating&&o.imdbRating!="N/A")$("#imdb").innerHTML=`<b class="rate">IMDb ${o.imdbRating}</b>`}).catch(()=>{});
  }catch(e){$("#sc").innerHTML=`<div class="empty">Không tải được chi tiết.</div>`}
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".card[data-id],.hero[data-id]");if(c){openDetail(c.dataset.t,c.dataset.id);return}
  const rs=e.target.closest("[data-resume]");if(rs){const[t,i]=rs.dataset.resume.split(":");openDetail(t,i,true);return}
  const l=e.target.closest("[data-lib]");if(l){LIB&&openPlayer(LIB,+l.dataset.lib);return}
  const p=e.target.closest("[data-play]");if(p){loadLib().then(d=>{const i=d.findIndex(x=>x.identifier==p.dataset.play);openPlayer(d,i<0?0:i)})}
});

/* ---------- Player ---------- */
const V=$("#v"),P=$("#player");let list=[],idx=0,idle,saveT=0;
const fmt=s=>{s=Math.max(0,s|0);const h=s/3600|0,m=(s%3600)/60|0;return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s%60).padStart(2,"0")};
function toast(t,ms=2500){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),ms)}
async function openPlayer(l,i){list=l;idx=i;P.classList.add("show");await loadItem()}
async function loadItem(){
  const it=list[idx];$("#pt").textContent=it.title;toast("Đang tải…",8000);
  try{
    const m=await fetch(`https://archive.org/metadata/${it.identifier}`).then(r=>r.json());
    const f=(m.files||[]).filter(f=>/\.mp4$/i.test(f.name)&&!/trailer/i.test(f.name)).sort((a,b)=>(/h\.?264/i.test(b.format||"")?1:0)-(/h\.?264/i.test(a.format||"")?1:0)||(+a.size||0)-(+b.size||0))[0];
    if(!f)throw 0;
    V.src=`https://archive.org/download/${it.identifier}/${encodeURIComponent(f.name)}`;
    const pr=store.get("prog",{})[it.identifier];
    V.onloadedmetadata=()=>{if(pr&&pr.t>10&&pr.t<V.duration-30){V.currentTime=pr.t;toast("Tiếp tục từ "+fmt(pr.t))}else toast("Bắt đầu phát");};
    await V.play().catch(()=>{});
  }catch{toast("Phim này chưa phát được, chuyển phim khác.");}
  wake();
}
