<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CineGlass</title>
<meta name="theme-color" content="#faf7fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CineGlass">
<link rel="preconnect" href="https://phimapi.com" crossorigin>
<link rel="preconnect" href="https://phim.nguonc.com" crossorigin>
<link rel="dns-prefetch" href="https://phimimg.com">
<link rel="dns-prefetch" href="https://image.tmdb.org">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<style>
:root{
  --bg:#faf7fa;
  --bg-mesh:radial-gradient(at 10% 6%,rgba(250,45,72,.10),transparent 50%),radial-gradient(at 90% 20%,rgba(255,122,89,.08),transparent 45%),radial-gradient(at 50% 92%,rgba(175,82,222,.08),transparent 55%);
  --card:rgba(255,255,255,.82);
  --text:#1c1c1e;--sub:#726e77;
  --glass-rgb:255,255,255;
  --pill-rgb:120,120,128;--pill-a:.18;
  --rim-hi:rgba(255,255,255,.95);--rim-lo:rgba(255,255,255,.45);
  --glass-shadow:0 10px 30px rgba(30,20,40,.14),0 1px 3px rgba(30,20,40,.08);
  --accent:#fa2d48;
  --accent-grad:linear-gradient(135deg,#ff375f 0%,#fa2d48 55%,#ff5e3a 100%);
  --line:rgba(250,45,72,.08);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  /* Đường cong lò xo nguyên bản của hiệu ứng vuốt dọc mà bạn yêu thích */
  --spring:cubic-bezier(.2,1.25,.35,1);
  --close-ease:cubic-bezier(.22,1,.36,1);
  --g:.02;
}
:root[data-theme=dark]{
  --bg:#0f0d13;
  --bg-mesh:radial-gradient(at 12% 8%,rgba(250,45,72,.16),transparent 52%),radial-gradient(at 88% 25%,rgba(191,90,242,.11),transparent 48%),radial-gradient(at 50% 90%,rgba(255,100,130,.09),transparent 58%);
  --card:rgba(32,28,40,.84);
  --text:#f5f5f7;--sub:#a19ca8;
  --glass-rgb:44,38,56;
  --pill-rgb:255,255,255;--pill-a:.16;
  --rim-hi:rgba(255,255,255,.55);--rim-lo:rgba(255,255,255,.22);
  --glass-shadow:0 12px 32px rgba(0,0,0,.52),0 1px 3px rgba(0,0,0,.38);
  --accent:#ff375f;--line:rgba(255,255,255,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
html,body{
  margin:0;background-color:var(--bg);background-image:var(--bg-mesh);
  color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  overflow-x:hidden;overscroll-behavior-x:none;-webkit-font-smoothing:antialiased;
}
body.playing,html.playing{background:#000!important;background-image:none!important}

#page{
  position:relative;z-index:10;
  padding:calc(var(--sat) + 12px) 0 calc(var(--sab) + 110px);
  min-height:100vh;min-height:100dvh;
  background-color:var(--bg);background-image:var(--bg-mesh);
  transform-origin:50% 50%;
  transform:translate3d(0,0,0) scale(1);
  transition:transform .52s var(--spring),opacity .35s ease;
  will-change:transform;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
#page.dragging{transition:none!important}

/* ===== Giao diện Mở Rộng Đề Xuất (#catOverlay): Dùng chung kiến trúc 120Hz CoreAnimation với #sheet ===== */
#catOverlay{position:fixed;inset:0;z-index:24;display:none;overflow:hidden;contain:layout style}
#catOverlay.show{display:block}
#catOverlay .bd{
  position:absolute;inset:0;background:rgba(15,10,20,.44);
  opacity:0;transition:opacity .38s ease;will-change:opacity;
}
#catOverlay .pn{
  position:absolute;inset:0;
  padding:calc(var(--sat) + 12px) 0 calc(var(--sab) + 110px);
  background-color:var(--bg);background-image:var(--bg-mesh);
  border-radius:32px;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  overscroll-behavior:none;
  transform-origin:50% 50%;
  transform:translate3d(100%,0,0) scale(.94);
  opacity:1;
  transition:transform .52s var(--spring),opacity .36s ease;
  box-shadow:-10px 0 34px rgba(0,0,0,.22);
  will-change:transform,opacity;backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
#catOverlay.open .bd{opacity:1}
#catOverlay.open .pn{transform:translate3d(0,0,0) scale(1)}
#catOverlay.dragging .pn,#catOverlay.dragging .bd{transition:none!important}

h1{font-size:34px;margin:8px 20px 14px;font-weight:800;background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;width:fit-content}
h2{font-size:21px;letter-spacing:-.4px;margin:26px 20px 10px;font-weight:700}
.sec-hd{display:flex;align-items:baseline;justify-content:space-between;margin:26px 20px 10px;gap:12px}
.sec-hd h2{margin:0}
.more-link{display:inline-flex;align-items:center;gap:3px;font-size:14px;font-weight:600;color:var(--accent);padding:4px 2px;transition:transform .35s var(--spring),opacity .2s}
.more-link:active{transform:translateX(4px) scale(.94);opacity:.75}
.more-link svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.scroller{display:flex;gap:13px;overflow-x:auto;padding:8px 20px 16px;scrollbar-width:none;align-items:flex-start;-webkit-overflow-scrolling:touch;contain:content}
.scroller::-webkit-scrollbar{display:none}
.card{position:relative;flex:0 0 128px;text-align:left;transition:transform .4s var(--spring);transform:translateZ(0)}
.card:active{transform:scale(.90)}
.card .p{display:block;width:128px;aspect-ratio:2/3;border-radius:18px;object-fit:cover;background:var(--card);border:.5px solid var(--line);box-shadow:0 4px 12px rgba(20,10,20,.07)}
.card b{margin-top:8px;font-size:13px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card small{color:var(--sub);font-size:12px}
.card.wide{flex-basis:230px}.card.wide .p{width:230px;aspect-ratio:16/10}
.sk{background:var(--card);border-radius:18px;flex:0 0 128px;aspect-ratio:2/3;border:.5px solid var(--line)}

/* Nhãn Coming Soon */
.cs-tag{
  position:absolute;top:8px;left:8px;z-index:2;
  padding:3px 8px;border-radius:9px;
  font-size:10px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;
  color:#fff;background:rgba(18,14,26,.88);
  border:.5px solid rgba(255,255,255,.22);
  box-shadow:0 2px 6px rgba(0,0,0,.22);
  pointer-events:none;
}
.btn.cs-btn{
  background:rgba(120,120,128,.22)!important;
  color:var(--sub)!important;
  border:1px dashed var(--line);
  cursor:default;
}

/* Nút "Xem thêm >" ở cuối mỗi hàng đề xuất */
.card.more-card{display:flex;flex-direction:column}
.card.more-card .more-box{
  width:128px;aspect-ratio:2/3;border-radius:18px;
  background:var(--card);border:1px solid var(--line);
  box-shadow:0 4px 14px rgba(250,45,72,.07),inset 0 1px 1px var(--rim-hi);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:14px;text-align:center;
  transition:transform .4s var(--spring);
}
.card.more-card:active .more-box{transform:scale(.90)}
.more-ic{
  width:46px;height:46px;border-radius:50%;
  background:var(--accent-grad);color:#fff;
  display:grid;place-items:center;
  box-shadow:0 5px 14px rgba(250,45,72,.28);
}
.more-ic svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.card.more-card .more-box b{margin:0;font-size:14px;font-weight:700;color:var(--accent)}
.card.more-card .more-box small{font-size:11.5px;color:var(--sub);line-height:1.25}

.cat-bar{display:flex;align-items:center;gap:10px;padding:4px 20px 6px}
.back-btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:8px 14px 8px 10px;border-radius:20px;
  background:var(--card);border:.5px solid var(--line);
  box-shadow:0 3px 10px rgba(0,0,0,.05);
  font-size:14px;font-weight:700;color:var(--accent);
  transition:transform .38s var(--spring);
}
.back-btn:active{transform:scale(.88)}
.back-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

.bar{position:relative;height:3.5px;background:rgba(120,120,128,.22);border-radius:4px;margin-top:6px;overflow:hidden}.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent-grad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px;padding:8px 20px;contain:layout style}
.grid .card{flex:none}.grid .card .p{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 20px}
.chip{padding:8px 14px;border-radius:18px;background:var(--card);border:.5px solid var(--line);font-size:13.5px;font-weight:600;transition:transform .38s var(--spring)}
.chip:active{transform:scale(.90)}
.chip.on{background:var(--accent-grad);color:#fff;border-color:transparent}
.search{margin:0 20px 8px;display:flex;gap:8px;align-items:center;border-radius:16px;padding:11px 14px;background:var(--card);border:.5px solid var(--line)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font-size:17px}
.list{margin:0 20px 16px;border-radius:24px;background:var(--card);border:.5px solid var(--line);overflow:hidden}
.list>div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:.5px solid var(--line)}
.list>div:last-child{border-bottom:0}
.list input[type=text],.list input[type=password]{background:none;border:0;outline:0;color:var(--text);text-align:right;flex:1;min-width:0;font-size:15px}
.list input[type=range]{flex:1;accent-color:var(--accent)}
.seg{display:flex;gap:4px;padding:3px;border-radius:12px;background:rgba(120,120,128,.16)}
.seg button{padding:6px 12px;border-radius:9px;font-size:13px;font-weight:600;transition:transform .35s var(--spring)}
.seg button:active{transform:scale(.90)}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.note{color:var(--sub);font-size:13px;margin:0 28px 14px}
.btn{background:var(--accent-grad);color:#fff;border-radius:16px;padding:12px 18px;font-weight:700;display:inline-flex;gap:8px;align-items:center;transition:transform .4s var(--spring)}
.btn:active{transform:scale(.90)}
.btn.g{background:var(--card);color:var(--accent);border:.5px solid var(--line)}
.empty{color:var(--sub);text-align:center;padding:30px}
.sp{display:flex;justify-content:center;padding:40px}
.sp i{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.prov{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.prov button{background:var(--card);border:.5px solid var(--line);border-radius:12px;padding:7px 12px;font-size:13px;font-weight:600;transition:transform .36s var(--spring)}
.prov button:active{transform:scale(.90)}
.prov button.on{background:var(--accent-grad);color:#fff;border-color:transparent}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px;max-height:210px;overflow-y:auto;margin:8px 0 14px;padding:2px;-webkit-overflow-scrolling:touch}
.ep-grid button{background:var(--card);border:.5px solid var(--line);border-radius:11px;padding:8px 6px;font-size:12px;font-weight:600;text-align:center;transition:transform .36s var(--spring)}
.ep-grid button:active{transform:scale(.88)}
.ep-grid button.on{background:var(--accent-grad);color:#fff;border-color:transparent}

/* ===== Liquid Glass dock ===== */
.dock{position:fixed;left:16px;right:16px;bottom:max(8px,calc(var(--sab) - 6px));z-index:30;display:flex;gap:10px;align-items:center;transform:translateZ(0)}
.glass{
  position:relative;
  background:rgba(var(--glass-rgb),calc(var(--g) * .7));
  -webkit-backdrop-filter:blur(calc(2px + var(--g) * 26px)) saturate(185%);
  backdrop-filter:blur(calc(2px + var(--g) * 26px)) saturate(185%);
  box-shadow:var(--glass-shadow),inset 0 1.5px 1px var(--rim-hi),inset 0 -1px 1px var(--rim-lo);
}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(145deg,var(--rim-hi),transparent 32%,transparent 66%,var(--rim-lo));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.tabs{flex:1;display:flex;height:62px;padding:4px;border-radius:31px;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .45s var(--spring)}
.tabs.press{transform:scale(1.03)}
#tabPill{position:absolute;top:4px;bottom:4px;left:0;border-radius:27px;pointer-events:none;
  background:linear-gradient(180deg,rgba(var(--pill-rgb),calc(var(--pill-a) + .06)),rgba(var(--pill-rgb),var(--pill-a)));
  box-shadow:inset 0 1px 1px var(--rim-hi),inset 0 -1px 1px var(--rim-lo),0 2px 8px rgba(0,0,0,.08);
  transform:translate3d(var(--px,0px),0,0) scale(var(--ps,1));
  transition:transform .52s var(--spring),opacity .22s,background .22s;will-change:transform}
#tabPill.press{--ps:1.10;background:linear-gradient(180deg,rgba(var(--glass-rgb),.55),rgba(var(--pill-rgb),.14));
  box-shadow:inset 0 1.5px 1.5px var(--rim-hi),inset 0 -1px 1px var(--rim-lo),0 6px 18px rgba(0,0,0,.18)}
#tabPill.off{opacity:0;--ps:.85}
.tabs button.t{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:700;letter-spacing:.1px;color:var(--text);transition:color .2s,transform .4s var(--spring)}
.tabs button.t:active{transform:scale(.86)}
.tabs button.t svg,.sbtn svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .42s var(--spring)}
.tabs button.t.on{color:var(--accent);font-weight:800}
.tabs button.t.on svg{fill:currentColor;fill-opacity:.9;transform:translateY(-1px) scale(1.08)}
.tabs button.t.hov{color:var(--accent)}
.sbtn{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--text);transition:transform .45s var(--spring),color .2s}
.sbtn:active{transform:scale(1.14)}
.sbtn.on{color:var(--accent)}
.sbtn.on svg{stroke-width:2.4}

/* ===== Sheet: Dùng chính xác CoreAnimation CSS .52s var(--spring) của vuốt dọc cho cả 2 chiều ===== */
#sheet{position:fixed;inset:0;z-index:50;display:none;overflow:hidden;contain:layout style}
#sheet.show{display:block}
#sheet .bd{
  position:absolute;inset:0;background:rgba(15,10,20,.46);
  opacity:0;transition:opacity .38s ease;will-change:opacity;
}
#sheet .pn{
  position:absolute;left:0;right:0;bottom:0;top:calc(var(--sat) + 12px);
  background:var(--bg);border-radius:32px;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  overscroll-behavior:none;
  padding-bottom:calc(var(--sab) + 50px);
  transform-origin:50% 50%;
  transform:translate3d(0,100%,0) scale(1);
  opacity:1;
  transition:transform .52s var(--spring),opacity .36s ease;
  box-shadow:0 -10px 36px rgba(0,0,0,.25);
  will-change:transform,opacity;backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
#sheet.open .bd{opacity:1}
#sheet.open .pn{transform:translate3d(0,0,0) scale(1)}
#sheet.dragging .pn,#sheet.dragging .bd{transition:none!important}

.sh-bar{
  position:sticky;top:0;z-index:12;
  display:flex;align-items:center;justify-content:space-between;
  height:52px;padding:8px 14px 0;
  pointer-events:none;
}
.sh-btn{
  pointer-events:auto;
  height:36px;min-width:36px;padding:0 12px;border-radius:18px;
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  background:rgba(24,22,30,.68);color:#fff;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:.5px solid rgba(255,255,255,.26);
  box-shadow:0 4px 12px rgba(0,0,0,.22);
  font-size:13px;font-weight:700;
  transition:transform .38s var(--spring),opacity .2s;
}
.sh-btn:active{transform:scale(.84)}
.sh-btn.hide{opacity:0;pointer-events:none}
.sh-btn.ic{width:36px;padding:0;border-radius:50%;font-size:16px}
.sh-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.grab{
  pointer-events:auto;
  flex:1;height:44px;display:flex;justify-content:center;align-items:flex-start;padding-top:6px;
  cursor:grab;touch-action:none;
}
.grab::before{content:"";width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.85);box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .35s var(--spring)}
#sheet.dragging .grab::before{transform:scaleX(1.28);background:var(--accent)}

.bk{aspect-ratio:16/10;margin-top:-52px;background:var(--card);position:relative}.bk img{width:100%;height:100%;object-fit:cover}.bk::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.28) 0%,transparent 32%,transparent 52%,var(--bg) 100%)}
.dt{padding:0 20px;margin-top:-34px;position:relative;z-index:1}.dt h3{font-size:28px;margin:0 0 6px}
.meta{color:var(--sub);font-size:13.5px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rate{color:var(--accent);font-weight:700}
.acts{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}
.tr{aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;margin:10px 0}.tr iframe{width:100%;height:100%;border:0}
.dt p{color:var(--sub);line-height:1.5}

/* ===== Player: Dùng chính xác CoreAnimation CSS .52s var(--spring) ===== */
#player{
  position:fixed;top:50%;left:50%;
  width:100vw;height:100vh;width:100dvw;height:100dvh;
  transform:translate3d(-50%,-50%,0) rotate(0deg) scale(1);
  transform-origin:center center;
  z-index:80;background:#000;display:none;color:#fff;
  transition:transform .52s var(--spring),opacity .36s ease,border-radius .35s ease;
  user-select:none;-webkit-user-select:none;overflow:hidden;
  will-change:transform,opacity;backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
#player.show{display:block;animation:playerIn .46s var(--spring)}
@keyframes playerIn{from{opacity:0;transform:translate3d(-50%,-44%,0) scale(.90)}to{opacity:1;transform:translate3d(-50%,-50%,0) scale(1)}}
#player.dragging{transition:none!important}
#player video,#player iframe{width:100%;height:100%;object-fit:contain;background:#000;border:0}
.ctl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(var(--sat) + 20px) 20px calc(var(--sab) + 20px);background:linear-gradient(rgba(0,0,0,.6),transparent 30%,transparent 70%,rgba(0,0,0,.8));z-index:10;transition:opacity .22s ease}
.ctl.hide,#player.idle .ctl{opacity:0!important;pointer-events:none!important}
.top{display:flex;align-items:center;gap:12px}.top b{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2);transition:transform .38s var(--spring)}
.rb:active{transform:scale(.84)}
.bot{display:flex;gap:12px;align-items:center}
.bot input{flex:1;accent-color:#fff}
.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);padding:10px 16px;border-radius:20px;background:rgba(0,0,0,.8);opacity:0;transition:.35s var(--spring);z-index:20;font-size:14px;pointer-events:none}
.toast.on{opacity:1}

.hero{position:relative;display:block;width:calc(100% - 40px);margin:0 20px 24px;padding:0;overflow:hidden;border-radius:28px;border:0;background:none;transform:translateZ(0);transition:transform .44s var(--spring)}
.hero:active{transform:scale(.95)}
.hero img{display:block;width:100%;height:250px;object-fit:cover;object-position:center}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.75),rgba(0,0,0,.2) 45%,transparent)}
.hero div{position:absolute;left:20px;right:20px;bottom:20px;z-index:2;color:#fff;text-align:left}
.hero span{display:block;font-size:14px}
.hero b{display:block;margin-top:4px;font-size:30px;font-weight:800}

@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}


/* ===== CineGlass Personal Library · Liquid Glass Evolution ===== */
.library-shell{width:100%;max-width:1480px;margin:0 auto;padding:8px 20px calc(var(--sab) + 124px)}
.lib-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:8px 0 20px}
.lib-kicker{display:block;color:var(--accent);font-size:10px;font-weight:850;letter-spacing:1.5px;text-transform:uppercase;margin:0 0 5px}
.library-shell .lib-heading h1{margin:0;font-size:clamp(28px,4vw,38px);line-height:1.05;letter-spacing:-1.1px}
.lib-heading p{margin:8px 0 0;color:var(--sub);font-size:13px}
.lib-heading-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lib-heading-actions .btn{white-space:nowrap}
.lib-layout{display:grid;grid-template-columns:minmax(210px,260px) minmax(0,1fr);gap:18px;align-items:start}
.lib-sidebar,.lib-panel{min-width:0;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(var(--glass-rgb),.62),rgba(var(--glass-rgb),.34));box-shadow:var(--glass-shadow),inset 0 1px 0 var(--rim-hi);-webkit-backdrop-filter:blur(22px) saturate(155%);backdrop-filter:blur(22px) saturate(155%)}
.lib-sidebar{padding:15px;position:sticky;top:12px;display:flex;flex-direction:column;gap:18px}
.lib-block-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:800;margin:0 0 10px}
.lib-block-title small{font-size:10px;font-weight:650;color:var(--sub)}
.lib-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lib-stat{border:1px solid var(--line);background:rgba(var(--glass-rgb),.42);border-radius:15px;padding:11px 10px;min-width:0}
.lib-stat b{display:block;font-size:22px;line-height:1.1;font-weight:850;letter-spacing:-.6px}
.lib-stat span{display:block;margin-top:4px;font-size:10px;color:var(--sub);font-weight:650}
.lib-recent-list{display:flex;flex-direction:column;gap:7px}
.lib-recent{width:100%;display:flex;align-items:center;gap:9px;text-align:left;padding:8px;border-radius:13px;background:rgba(var(--glass-rgb),.32);border:1px solid transparent;transition:background .2s,border-color .2s,transform .35s var(--spring)}
.lib-recent:active{transform:scale(.97)}
.lib-recent:hover{background:rgba(var(--glass-rgb),.58);border-color:var(--line)}
.lib-recent .lib-recent-icon{width:32px;height:42px;flex:none;border-radius:8px;display:grid;place-items:center;background:var(--accent-grad);color:#fff;font-size:12px;font-weight:900;overflow:hidden}
.lib-recent .lib-recent-icon img{width:100%;height:100%;object-fit:cover}
.lib-recent b{display:block;font-size:11px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-recent small{display:block;color:var(--sub);font-size:10px;margin-top:3px}
.lib-muted{color:var(--sub);font-size:11px;line-height:1.5}
.lib-main{display:flex;flex-direction:column;gap:17px;min-width:0}
.lib-hero{position:relative;isolation:isolate;display:flex;align-items:flex-end;min-height:270px;padding:23px;border-radius:24px;overflow:hidden;color:#fff;background:#201c2b;box-shadow:0 14px 34px rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.18);text-align:left;width:100%;}
.lib-hero::before{content:"";position:absolute;inset:0;z-index:-2;background-image:var(--lib-cover),radial-gradient(circle at 78% 24%,rgba(255,75,108,.48),transparent 38%),linear-gradient(130deg,#262032,#514050);background-position:center;background-size:cover;transform:scale(1.015);transition:transform .8s var(--spring)}
.lib-hero:hover::before{transform:scale(1.055)}
.lib-hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(8,7,13,.88) 0%,rgba(8,7,13,.56) 48%,rgba(8,7,13,.10) 100%),linear-gradient(0deg,rgba(8,7,13,.38),transparent 70%)}
.lib-hero-copy{max-width:580px}
.lib-hero-eyebrow{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid rgba(255,255,255,.25);border-radius:99px;background:rgba(255,255,255,.13);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase}
.lib-hero h2{font-size:clamp(24px,3.3vw,36px);line-height:1.08;letter-spacing:-.8px;margin:12px 0 7px;color:#fff}
.lib-hero p{font-size:12px;line-height:1.5;color:rgba(255,255,255,.78);margin:0 0 14px;max-width:520px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lib-hero-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;color:rgba(255,255,255,.84);font-size:11px;margin-bottom:13px}
.lib-hero-actions{display:flex;gap:8px;flex-wrap:wrap}
.lib-hero .btn{border:1px solid rgba(255,255,255,.22);box-shadow:0 5px 16px rgba(0,0,0,.18)}
.lib-hero .btn.g{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.lib-hero-empty{min-height:220px;align-items:center;justify-content:center;text-align:center}
.lib-hero-empty .lib-hero-copy{max-width:440px;margin:auto}
.lib-hero-empty::after{background:linear-gradient(120deg,rgba(18,15,26,.78),rgba(18,15,26,.38))}
.lib-section{min-width:0}
.lib-section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 0 10px}
.lib-section-head h2{font-size:17px;letter-spacing:-.3px;margin:0;font-weight:800}
.lib-section-head p{font-size:11px;color:var(--sub);margin:4px 0 0}
.lib-inline-count{font-size:10px;color:var(--sub);font-weight:700;white-space:nowrap}
.lib-continue .scroller{padding-left:2px;padding-right:2px}
.lib-filter-row{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.lib-filter-row::-webkit-scrollbar{display:none}
.lib-filter{flex:none;border:1px solid var(--line);border-radius:99px;padding:8px 13px;background:rgba(var(--glass-rgb),.42);font-size:11px;font-weight:750;color:var(--sub);transition:all .25s var(--spring)}
.lib-filter.on{background:var(--accent-grad);color:#fff;border-color:transparent;box-shadow:0 5px 14px rgba(250,45,72,.2)}
.lib-saved-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:14px}
.lib-item{position:relative;min-width:0}
.lib-item-open{width:100%;display:block;text-align:left;border-radius:17px;overflow:hidden;padding:0;transition:transform .38s var(--spring)}
.lib-item-open:active{transform:scale(.95)}
.lib-item-poster{position:relative;display:block;width:100%;aspect-ratio:2/3;overflow:hidden;border-radius:17px;background:var(--card);border:1px solid var(--line);box-shadow:0 5px 16px rgba(0,0,0,.09)}
.lib-item-poster img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .65s var(--spring)}
.lib-item-open:hover .lib-item-poster img{transform:scale(1.045)}
.lib-item-badge{position:absolute;left:7px;top:7px;max-width:calc(100% - 14px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:99px;padding:5px 8px;background:rgba(16,14,22,.72);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:9px;font-weight:800;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.lib-item-fav{position:absolute;right:7px;top:7px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:rgba(16,14,22,.65);color:#ff6682;border:1px solid rgba(255,255,255,.2);font-size:14px}
.lib-item-copy{display:block;padding:8px 2px 0}
.lib-item-copy b{display:block;font-size:12px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lib-item-copy small{display:block;color:var(--sub);font-size:10px;margin-top:4px}
.lib-item-remove{position:absolute;right:6px;bottom:45px;width:27px;height:27px;display:grid;place-items:center;border-radius:50%;background:rgba(15,13,19,.78);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:13px;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s}
.lib-item:hover .lib-item-remove,.lib-item:focus-within .lib-item-remove{opacity:1;transform:translateY(0)}
.lib-empty{padding:26px 16px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--sub);font-size:12px;background:rgba(var(--glass-rgb),.2)}
.lib-source-catalog{padding:15px;border:1px solid var(--line);border-radius:22px;background:rgba(var(--glass-rgb),.24)}
.lib-source-catalog .grid{padding:5px 0 0;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:12px}
.lib-source-catalog .chips{padding:3px 0 8px}
.lib-detail-controls{margin:11px 0 8px;padding:11px;border-radius:17px;background:rgba(var(--glass-rgb),.38);border:1px solid var(--line)}
.lib-detail-controls .lib-detail-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.lib-detail-controls label{font-size:12px;font-weight:700;color:var(--sub)}
.lib-detail-controls select{min-width:150px;max-width:100%;padding:9px 12px;border-radius:12px;border:1px solid var(--line);outline:0;background:var(--card);color:var(--text);font:inherit;font-size:12px}
.lib-detail-controls .lib-fav-btn,.lib-detail-controls .lib-remove-btn{padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:750}
.lib-detail-controls .lib-fav-btn.on{color:#fff;background:linear-gradient(135deg,#ff5977,#e62d5c);border-color:transparent}
.lib-detail-hint{font-size:10px;color:var(--sub);margin-top:7px}
@media(max-width:760px){
  .library-shell{padding-left:14px;padding-right:14px}
  .lib-layout{grid-template-columns:1fr;gap:13px}
  .lib-sidebar{position:static;display:grid;grid-template-columns:1fr;gap:13px;padding:12px}
  .lib-stat-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .lib-stat{padding:9px 7px}
  .lib-stat b{font-size:18px}
  .lib-stat span{font-size:9px}
  .lib-recent-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .lib-hero{min-height:245px;padding:17px}
  .lib-saved-grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
  .lib-heading{align-items:flex-start}
}
@media(max-width:430px){
  .lib-heading{display:block}
  .lib-heading-actions{margin-top:12px}
  .lib-stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lib-recent-list{grid-template-columns:1fr}
  .lib-hero{min-height:225px}
  .lib-detail-controls .lib-detail-row{align-items:stretch}
  .lib-detail-controls select{flex:1}
}



/* ===== CineGlass 2.1 · Frosted cinema dashboard ===== */
:root{
  --bg:#e7e7e4;
  --bg-mesh:radial-gradient(ellipse at 12% 12%,rgba(255,255,255,.8),transparent 40%),radial-gradient(ellipse at 90% 18%,rgba(190,195,202,.42),transparent 38%),radial-gradient(ellipse at 72% 88%,rgba(216,204,211,.42),transparent 42%);
  --card:rgba(255,255,255,.72);
  --text:#24242a;--sub:#777780;
  --glass-rgb:245,245,244;
  --pill-rgb:255,255,255;--pill-a:.48;
  --rim-hi:rgba(255,255,255,.92);--rim-lo:rgba(255,255,255,.32);
  --glass-shadow:0 16px 42px rgba(44,45,50,.12),0 2px 8px rgba(44,45,50,.06);
  --accent:#fa526d;
  --accent-grad:linear-gradient(135deg,#ff7188 0%,#fa526d 58%,#eb765c 100%);
  --line:rgba(70,70,80,.10);
}
:root[data-theme=dark]{
  --bg:#111116;
  --bg-mesh:radial-gradient(ellipse at 15% 8%,rgba(118,96,135,.24),transparent 43%),radial-gradient(ellipse at 88% 23%,rgba(77,91,119,.2),transparent 40%),radial-gradient(ellipse at 55% 95%,rgba(139,74,91,.17),transparent 48%);
  --card:rgba(34,33,42,.82);--text:#f6f4f6;--sub:#aaa7b1;
  --glass-rgb:38,37,45;--pill-rgb:255,255,255;--pill-a:.15;
  --rim-hi:rgba(255,255,255,.3);--rim-lo:rgba(255,255,255,.12);
  --glass-shadow:0 18px 48px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.2);
  --accent:#ff6b85;--line:rgba(255,255,255,.1);
}
html,body{min-height:100%;background:var(--bg);background-image:var(--bg-mesh);background-attachment:fixed}
body{position:relative;min-height:100vh}
.cg-ambient{position:fixed;inset:-7%;z-index:0;pointer-events:none;opacity:.62;filter:blur(34px);background:radial-gradient(ellipse at 20% 28%,rgba(255,255,255,.82),transparent 28%),radial-gradient(ellipse at 75% 32%,rgba(173,181,189,.55),transparent 28%),radial-gradient(ellipse at 62% 84%,rgba(225,171,182,.42),transparent 28%)}
:root[data-theme=dark] .cg-ambient{opacity:.4}
.cg-topbar{position:sticky;top:12px;z-index:35;width:min(1300px,calc(100% - 126px));min-height:72px;margin:14px auto 14px;padding:10px 14px;display:grid;grid-template-columns:auto minmax(155px,220px) minmax(0,1fr) auto;align-items:center;gap:16px;border:1px solid rgba(255,255,255,.72);border-radius:25px;background:rgba(248,248,247,.56);-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);box-shadow:0 12px 36px rgba(40,42,48,.09),inset 0 1px 0 rgba(255,255,255,.85)}
:root[data-theme=dark] .cg-topbar{background:rgba(27,26,34,.72);border-color:rgba(255,255,255,.14);box-shadow:0 14px 40px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.1)}
.cg-brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:var(--text)}
.cg-brand-mark{width:38px;height:38px;display:grid;place-items:center;flex:none;border-radius:13px;background:var(--accent-grad);color:#fff;font-size:21px;font-weight:900;box-shadow:0 7px 18px rgba(250,82,109,.26)}
.cg-brand-copy{display:flex;flex-direction:column;line-height:1.05;white-space:nowrap}
.cg-brand-copy b{font-size:15px;letter-spacing:-.4px;font-weight:850}
.cg-brand-copy small{margin-top:4px;color:var(--sub);font-size:8px;letter-spacing:1.15px;font-weight:850}
.cg-global-search{height:40px;min-width:0;display:flex;align-items:center;gap:8px;padding:0 11px;border:1px solid rgba(100,100,110,.08);border-radius:14px;background:rgba(120,120,128,.10)}
.cg-global-search svg,.cg-top-actions svg,.cg-heading-search svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;color:var(--sub)}
.cg-global-search input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:600 12px/1.2 inherit}
.cg-global-search input::placeholder{color:var(--sub)}
.cg-global-search kbd{flex:none;padding:3px 5px;border-radius:6px;background:rgba(120,120,128,.14);color:var(--sub);font:700 10px/1.2 inherit}
.cg-category-nav{display:flex;align-items:center;justify-content:center;gap:4px;min-width:0;overflow-x:auto;scrollbar-width:none}
.cg-category-nav::-webkit-scrollbar{display:none}
.cg-category-btn{flex:none;padding:9px 12px;border-radius:99px;color:var(--sub);font-size:11px;font-weight:750;white-space:nowrap;transition:background .2s,color .2s,transform .25s var(--spring)}
.cg-category-btn:hover{background:rgba(255,255,255,.42);color:var(--text)}
.cg-category-btn.on{background:rgba(255,255,255,.75);color:var(--text);box-shadow:inset 0 1px rgba(255,255,255,.9),0 2px 8px rgba(40,40,50,.06)}
:root[data-theme=dark] .cg-category-btn.on{background:rgba(255,255,255,.13);color:#fff;box-shadow:inset 0 1px rgba(255,255,255,.16)}
.cg-top-actions{display:flex;align-items:center;gap:9px}
.cg-icon-btn,.cg-profile-btn{width:38px;height:38px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.38);color:var(--text);position:relative}
.cg-profile-btn{border-radius:14px;background:rgba(255,255,255,.54);font-size:11px;font-weight:900}
.cg-profile-btn span{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#8e9eb6,#596b84);color:white}
.cg-profile-btn i{position:absolute;right:5px;top:5px;width:6px;height:6px;border-radius:50%;background:#67c9a3;border:1px solid rgba(255,255,255,.9)}
.cg-rail{position:fixed;left:max(14px,calc((100vw - 1420px)/2));top:50%;z-index:32;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;padding:9px;border:1px solid rgba(255,255,255,.7);border-radius:23px;background:rgba(246,246,245,.45);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);box-shadow:0 12px 32px rgba(30,30,40,.1),inset 0 1px rgba(255,255,255,.8)}
:root[data-theme=dark] .cg-rail{background:rgba(26,25,33,.7);border-color:rgba(255,255,255,.13)}
.cg-rail-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:14px;color:var(--sub);transition:background .2s,color .2s,transform .3s var(--spring)}
.cg-rail-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cg-rail-btn:hover,.cg-rail-btn.on{background:rgba(255,255,255,.7);color:var(--accent);box-shadow:0 3px 10px rgba(35,35,45,.06)}
:root[data-theme=dark] .cg-rail-btn:hover,:root[data-theme=dark] .cg-rail-btn.on{background:rgba(255,255,255,.1)}
#page{width:min(1300px,calc(100% - 126px));min-height:calc(100dvh - 112px);margin:0 auto 28px;padding:23px;border:1px solid rgba(255,255,255,.74);border-radius:32px;background:linear-gradient(140deg,rgba(250,250,249,.62),rgba(239,239,238,.34));-webkit-backdrop-filter:blur(30px) saturate(155%);backdrop-filter:blur(30px) saturate(155%);box-shadow:0 20px 58px rgba(38,40,48,.10),inset 0 1px 0 rgba(255,255,255,.88);overflow:visible}
:root[data-theme=dark] #page{background:linear-gradient(140deg,rgba(34,33,42,.79),rgba(22,22,29,.58));border-color:rgba(255,255,255,.13);box-shadow:0 22px 60px rgba(0,0,0,.32),inset 0 1px rgba(255,255,255,.12)}
#page h1{margin:0;color:var(--text);background:none;-webkit-text-fill-color:currentColor;font-size:clamp(27px,3vw,36px);letter-spacing:-1.2px}
#page h2{font-size:17px;letter-spacing:-.35px}
#page .note{color:var(--sub)}
#page .btn{box-shadow:0 5px 16px rgba(250,82,109,.14)}
.dock{display:none}
.cg-home-layout{display:grid;grid-template-columns:minmax(205px,245px) minmax(0,1fr);gap:21px;align-items:start;max-width:100%;margin:0 auto}
.cg-home-sidebar{display:flex;flex-direction:column;gap:13px;min-width:0}
.cg-side-panel{padding:14px;border:1px solid rgba(255,255,255,.72);border-radius:21px;background:linear-gradient(145deg,rgba(255,255,255,.58),rgba(255,255,255,.27));box-shadow:0 10px 26px rgba(40,40,50,.06),inset 0 1px rgba(255,255,255,.9);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);min-width:0}
:root[data-theme=dark] .cg-side-panel{background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));border-color:rgba(255,255,255,.11);box-shadow:0 10px 26px rgba(0,0,0,.12),inset 0 1px rgba(255,255,255,.08)}
.cg-panel-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 11px}
.cg-panel-heading>b{font-size:12px;font-weight:850;letter-spacing:-.15px}
.cg-panel-heading>span,.cg-panel-heading>button{font-size:9px;color:var(--sub);font-weight:800;letter-spacing:.5px}
.cg-panel-heading>button{white-space:nowrap}
.cg-recent-list{display:flex;flex-direction:column;gap:7px}
.cg-recent-item{display:flex;align-items:center;gap:9px;width:100%;min-width:0;padding:7px;border:1px solid transparent;border-radius:13px;text-align:left;background:rgba(255,255,255,.27);transition:background .2s,transform .25s var(--spring)}
.cg-recent-item:hover{background:rgba(255,255,255,.63)}
:root[data-theme=dark] .cg-recent-item{background:rgba(255,255,255,.045)}
.cg-recent-poster{width:34px;height:45px;display:grid;place-items:center;flex:none;border-radius:8px;overflow:hidden;background:var(--accent-grad);color:#fff;font-size:12px;font-weight:900}
.cg-recent-poster img{width:100%;height:100%;object-fit:cover}
.cg-recent-copy{flex:1;min-width:0}
.cg-recent-copy b{display:block;font-size:10.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cg-recent-copy small{display:block;margin-top:4px;color:var(--sub);font-size:9px}
.cg-recent-arrow{font-size:12px;color:var(--sub)}
.cg-empty-note{padding:14px 6px;color:var(--sub);font-size:10.5px;line-height:1.55}
.cg-home-sidebar .cg-side-continue .scroller{display:flex;flex-direction:column;overflow:visible;padding:0;gap:8px}
.cg-home-sidebar .cg-side-continue h2{margin:0 0 9px;font-size:12px}

  --text:#29292d;--sub:#77777d;

}
:root[data-theme=dark]{
  --bg:#17171b;--card:rgba(30,29,36,.24);--glass-rgb:255,255,255;

/* ---------- BỘ LỌC CẮT QUẢNG CÁO M3U8 ---------- */
function stripAdsFromM3u8(text,baseUrl=""){
  if(!text)return text;
  const resolveUrl=u=>{if(!baseUrl||/^https?:\/\//i.test(u))return u;try{return new URL(u,baseUrl).href}catch{return u}};
  if(!text.includes("#EXT-X-DISCONTINUITY")){
    if(!baseUrl)return text;
    return text.split(/\r?\n/).map(l=>{const t=l.trim();return(!t||t.startsWith("#"))?l:resolveUrl(t)}).join("\n");
  }
  const lines=text.split(/\r?\n/),headerLines=[],blocks=[];
  let cur=[],inBody=false;
  for(const raw of lines){
    const l=raw.trim();if(!l||l==="#EXT-X-ENDLIST")continue;
    if(!inBody&&!l.startsWith("#EXTINF:")&&l!=="#EXT-X-DISCONTINUITY"){headerLines.push(l)}
    else{
      inBody=true;
      if(l==="#EXT-X-DISCONTINUITY"){if(cur.length)blocks.push(cur);cur=[]}
      else cur.push(l.startsWith("#")?l:resolveUrl(l));
    }
  }
  if(cur.length)blocks.push(cur);
  if(blocks.length<=1)return[...headerLines,...(blocks[0]||[]),"#EXT-X-ENDLIST"].join("\n");

  const stats=blocks.map(b=>{
    const urls=b.filter(x=>!x.startsWith("#"));
    const dur=b.filter(x=>x.startsWith("#EXTINF:")).reduce((s,x)=>s+(parseFloat(x.slice(8))||0),0);
    const sample=urls[0]||"";
    const prefix=sample.slice(0,Math.max(0,sample.lastIndexOf("/")));
    return{lines:b,count:urls.length,dur,prefix,sample};
  });
  const pCounts={};stats.forEach(s=>{pCounts[s.prefix]=(pCounts[s.prefix]||0)+s.count});
  let mainPrefix="",maxC=-1;
  for(const p in pCounts){if(pCounts[p]>maxC){maxC=pCounts[p];mainPrefix=p}}

  const cleanBlocks=stats.filter(s=>{
    if(/quangcao|adjump|ads|bet|casino|宣传/i.test(s.sample))return false;
    if(s.prefix!==mainPrefix&&maxC>15)return false;
    if(s.count<=12&&s.dur<45&&maxC>25)return false;
    return true;
  });
  const finalBlocks=cleanBlocks.length?cleanBlocks:stats;
  return[...headerLines,...finalBlocks.flatMap((s,i)=>i===0?s.lines:["#EXT-X-DISCONTINUITY",...s.lines]),"#EXT-X-ENDLIST"].join("\n");
}

let CleanHlsLoader=null;
try{
  if(typeof Hls!=="undefined"&&Hls.DefaultConfig?.loader){
    CleanHlsLoader=class extends Hls.DefaultConfig.loader{
      constructor(config){
        super(config);
        const origLoad=this.load.bind(this);
        this.load=function(context,config,callbacks){
          const origSuccess=callbacks.onSuccess;
          callbacks.onSuccess=function(response,stats,ctx,net){
            if(typeof response.data==="string"&&response.data.includes("#EXT-X-DISCONTINUITY")){
              response.data=stripAdsFromM3u8(response.data);
            }
            origSuccess(response,stats,ctx,net);
          };
          origLoad(context,config,callbacks);
        };
      }
    };
  }
}catch{}

const m3u8BlobCache=new Map();
async function getCleanM3u8BlobUrl(m3u8Url){
  if(!m3u8Url)return"";
  if(m3u8BlobCache.has(m3u8Url))return m3u8BlobCache.get(m3u8Url);
  try{
    const ctrl=new AbortController(),tid=setTimeout(()=>ctrl.abort(),2200);
    const masterTxt=await fetch(m3u8Url,{signal:ctrl.signal}).then(r=>r.text());
    clearTimeout(tid);
    if(!masterTxt.includes("#EXTM3U"))return m3u8Url;
    if(masterTxt.includes("#EXT-X-STREAM-INF")){
      const lines=masterTxt.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
      let subRel="";
      for(let i=0;i<lines.length;i++){
        if(lines[i].startsWith("#EXT-X-STREAM-INF")&&lines[i+1]&&!lines[i+1].startsWith("#")){subRel=lines[i+1];break}
      }
      if(subRel){
        const subUrl=new URL(subRel,m3u8Url).href;
        const ctrl2=new AbortController(),tid2=setTimeout(()=>ctrl2.abort(),2200);
        const subTxt=await fetch(subUrl,{signal:ctrl2.signal}).then(r=>r.text());
        clearTimeout(tid2);
        const cleaned=stripAdsFromM3u8(subTxt,subUrl);
        const blobUrl=URL.createObjectURL(new Blob([cleaned],{type:"application/vnd.apple.mpegurl"}));
        m3u8BlobCache.set(m3u8Url,blobUrl);
        return blobUrl;
      }
    }
    const cleaned=stripAdsFromM3u8(masterTxt,m3u8Url);
    const blobUrl=URL.createObjectURL(new Blob([cleaned],{type:"application/vnd.apple.mpegurl"}));
    m3u8BlobCache.set(m3u8Url,blobUrl);
    return blobUrl;
  }catch{return m3u8Url}
}

const VN_ENTERTAINMENT_REGEX=/(\bgameshow\b|game show|reality|concert|live show|liveshow|talkshow|talk show|podcast|tạp kỹ|tap ky|chương trình|chuong trinh|2 ngay 1 dem|anh trai|chi dep|em xinh|running man|chay di cho chi|nhanh nhu chop|nguoi ay la ai|ca si mat na|masked singer|rap viet|king of rap|thuong vu bac ty|shark tank|mai am gia dinh viet|bo oi minh di dau the|hanh trinh ruc ro|sao nhap ngu|on gioi cau day roi|thach thuc danh hai|dau truong tieng cuoi|ban muon hen ho|vo chong son|ky uc vui ve|7 nu cuoi xuan|me vang nha|ba la sieu nhan|dau truong gia toc|tan binh toan nang|vietnam idol|the face|the voice|giong hat viet|cuoc dua ky thu|amazing race|hoa hau|miss universe|miss grand|miss world|tao quan|gap nhau cuoi nam|vtv awards|wechoice|lan song xanh|hoi ngo danh hai|bi mat dem chu nhat|chon ai day|xuan ha thu dong|bien cua hy vong|nha tro destiny)/i;

function isVnEntertainmentShow(item){
  if(!item)return true;
  if(item.type==="tvshows")return true;
  if(Array.isArray(item.category)&&item.category.some(c=>c.slug==="tv-shows"||/tv\s*shows|truyen hinh thực tế|chương trình/i.test(c.name||"")))return true;
  const gIds=item.genre_ids||(item.genres||[]).map(g=>g.id)||[];
  if(gIds.some(id=>[10764,10767,10763,99,10402].includes(id)))return true;
  const t1=norm(item.title||item.name||"");
  const t2=norm(item.originTitle||item.origin_name||item.original_name||item.original_title||"");
  if(VN_ENTERTAINMENT_REGEX.test(t1)||VN_ENTERTAINMENT_REGEX.test(t2))return true;
  return false;
}

async function fetchWithTimeout(url,ms=3200){
  const ctrl=new AbortController(),id=setTimeout(()=>ctrl.abort(),ms);
  try{const res=await fetch(url,{signal:ctrl.signal});clearTimeout(id);if(!res.ok) throw new Error(`HTTP ${res.status}`);return await res.json()}catch(e){clearTimeout(id);throw e}
}
async function fetchFromProvider(provider,keyword=""){
  const ck=`${provider.id}:${keyword||"latest"}`;

    const items=rawItems.map(it=>{

    });

async function rescueKkphimM3u8(slug,title,originTitle=""){
  try{

    if(d?.episodes?.length&&d.episodes[0]?.server_data?.length)return d.episodes.map(s=>({server_name:`⚡ KKPhim (${s.server_name})`,server_data:s.server_data}));
  }catch{}
  const queries=[title,originTitle].filter(Boolean);
  for(const q of queries){
    try{
      const s=await fetchWithTimeout(`https://phimapi.com/v1/api/tim-kiem?keyword=${encodeURIComponent(q)}&limit=2`,2500);
      const first=s?.data?.items?.[0];
      if(first?.slug){

async function fetchProviderMovieDetail(providerId,slug,fallbackTitle=""){
  const ck=`${providerId}:${slug}`;
  if(detailCache.has(ck))return detailCache.get(ck);
  const provider=PROVIDERS.find(p=>p.id===providerId)||PROVIDERS[0];
  const data=await fetchWithTimeout(provider.detailUrl(slug),3500);
  const movie=data.movie||data?.data?.item||{};
  const title=movie.name||fallbackTitle||"Phim";
  const originTitle=movie.origin_name||movie.original_name||"";
  let servers=[];
  if(provider.type==="nguonc"){
    const rescued=await rescueKkphimM3u8(slug,title,originTitle);
    const nguoncSrv=(movie.episodes||[]).map(s=>({
      server_name:`🔗 NguonC (${s.server_name})`,
      server_data:(s.items||[]).map(ep=>({name:ep.name,link_m3u8:ep.m3u8||"",link_embed:ep.embed||""}))
    }));
    servers=[...rescued,...nguoncSrv];
  }else{
    const rawEps=data.episodes||data?.data?.item?.episodes||[];
    servers=rawEps.map(s=>({server_name:`⚡ ${s.server_name}`,server_data:s.server_data||[]}));
  }
  let thumb=movie.poster_url||movie.thumb_url||"";
  if(thumb&&!thumb.startsWith("http"))thumb=provider.imgPrefix+thumb;
  let backdrop=movie.thumb_url||movie.poster_url||thumb;
  if(backdrop&&!backdrop.startsWith("http"))backdrop=provider.imgPrefix+backdrop;
  const res={movie,title,originTitle,overview:movie.content||movie.description||"",year:movie.year||"",thumb,backdrop,servers,providerId,slug};
  detailCache.set(ck,res);
  const firstM3u8=servers[0]?.server_data?.[0]?.link_m3u8;
  if(firstM3u8)getCleanM3u8BlobUrl(firstM3u8);
  return res;
}

function isMatchTitle(item,viTitle,origTitle){
  const nT=norm(item.title),nO=norm(item.originTitle);
  const qV=norm(viTitle),qO=norm(origTitle);
  if(qV&&nT&&(nT===qV||nT.includes(qV)||qV.includes(nT)))return true;
  if(qO&&nO&&(nO===qO||nO.includes(qO)||qO.includes(nO)))return true;
  if(qO&&nT&&(nT===qO||nT.includes(qO)))return true;
  return false;
}

async function findStreamForTmdb(viTitle,origTitle,tmdbId=""){
  const queries=[...new Set([viTitle,origTitle].filter(Boolean))];
  const nguoncP=PROVIDERS.find(p=>p.id==="nguonc")||PROVIDERS[5];
  const kkSearches=await Promise.all(queries.map(q=>fetchFromProvider(PROVIDERS[0],q)));
  const kkItems=kkSearches.flatMap(r=>r.items).filter(x=>isMatchTitle(x,viTitle,origTitle));
  if(kkItems.length){
    try{
      const det=await fetchProviderMovieDetail(kkItems[0].providerId,kkItems[0].slug,kkItems[0].title);
      if(det.servers.length&&det.servers[0].server_data?.length){
        if(tmdbId)streamAvailCache.set(String(tmdbId),true);
        return det;
      }
    }catch{}
  }
  const ngSearches=await Promise.all(queries.map(q=>fetchFromProvider(nguoncP,q)));
  const ngItems=ngSearches.flatMap(r=>r.items).filter(x=>isMatchTitle(x,viTitle,origTitle));
  if(ngItems.length){
    try{
      const det=await fetchProviderMovieDetail(ngItems[0].providerId,ngItems[0].slug,ngItems[0].title);
      if(det.servers.length&&det.servers[0].server_data?.length){
        if(tmdbId)streamAvailCache.set(String(tmdbId),true);
        return det;
      }
    }catch{}
  }
  if(tmdbId){
    streamAvailCache.set(String(tmdbId),false);
    markCardComingSoon(tmdbId);
  }
  return null;
}

function markCardComingSoon(tmdbId){
  document.querySelectorAll(`.card[data-id="${tmdbId}"]`).forEach(card=>{
    if(!card.querySelector(".cs-tag")){
      card.insertAdjacentHTML("afterbegin",`<span class="cs-tag">Coming Soon</span>`);
    }
  });
}

const checkQueue=[];let checkingBusy=false;
function queueStreamCheck(cardsScope=document){
  cardsScope.querySelectorAll(".card[data-id]:not([data-checked])").forEach(c=>{
    c.dataset.checked="1";
    const id=c.dataset.id,vi=c.dataset.vi||"",or=c.dataset.or||"";
    if(streamAvailCache.has(id)){
      if(streamAvailCache.get(id)===false)markCardComingSoon(id);
      return;
    }
    checkQueue.push({id,vi,or});
  });
  scheduleIdleCheck();
}
function scheduleIdleCheck(){
  if(checkingBusy||!checkQueue.length)return;
  checkingBusy=true;
  const step=async()=>{
    if(!checkQueue.length){checkingBusy=false;return}
    if(userInteracting||$("#player")?.classList.contains("show")){
      setTimeout(step,500);
      return;
    }
    const item=checkQueue.shift();
    if(item&&!streamAvailCache.has(item.id)){
      try{
        const kk=await fetchFromProvider(PROVIDERS[0],item.vi||item.or);
        let ok=kk.items.some(x=>isMatchTitle(x,item.vi,item.or));
        if(!ok&&item.or&&item.or!==item.vi){
          const kk2=await fetchFromProvider(PROVIDERS[0],item.or);
          ok=kk2.items.some(x=>isMatchTitle(x,item.vi,item.or));
        }
        streamAvailCache.set(item.id,ok);
        if(!ok)markCardComingSoon(item.id);
      }catch{}
    }
    setTimeout(step,180);
  };
  setTimeout(step,400);
}

/* Mở giao diện mở rộng đề xuất (#catOverlay) bằng đúng cơ chế CoreAnimation .52s var(--spring) của #sheet */
async function openCategory(rowIdx){
  const r=ROWS[rowIdx];if(!r)return;
  clearTimeout(catT);
  const id=++catId;
  catOpen=true;
  catOverlay.classList.remove("dragging");
  resetCatInlineStyles();
  catView.scrollTop=0;
  catView.innerHTML=`
    <div class="cat-bar"><button class="back-btn" id="catBack"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg> Quay lại</button></div>
    <h1>${esc(r.t)}</h1>
    ${r.sub&&r.sub()?`<div class="note" style="margin-top:-8px">${esc(r.sub())}</div>`:""}
    <div class="grid" id="catGrid"></div>
    <div id="catMoreWrap" style="text-align:center;padding:18px 20px"><div class="sp"><i></i></div></div>
  `;
  $("#catBack").onclick=()=>closeCategoryView("right");

  if(!catOverlay.classList.contains("show")){
    catOverlay.classList.add("show");
    requestAnimationFrame(()=>requestAnimationFrame(()=>catOverlay.classList.add("open")));
  }else{
    catOverlay.classList.add("open");
  }

  let curPage=0,loading=false,ended=false;
  const seenKeys=new Set();

  async function loadNextBatch(batchCount=3){
    if(loading||ended||id!==catId||!catOpen)return;
    loading=true;
    const wrap=$("#catMoreWrap");
    if(wrap)wrap.innerHTML=`<div class="sp"><i></i></div>`;
    try{
      const pages=[];
      for(let k=1;k<=batchCount;k++)pages.push(curPage+k);
      curPage+=batchCount;
      const resList=await Promise.all(pages.map(p=>r.p(p).catch(()=>[])));
      if(id!==catId||!catOpen)return;
      let items=resList.flat().filter(m=>{
        if(!m||(!m.poster_path&&!m._isProv)||m.media_type==="person")return false;
        const k=m._isProv?`p:${m.slug}`:`t:${m.id}`;
        if(seenKeys.has(k))return false;
        seenKeys.add(k);
        return true;
      });
      if(r.t==="Phim trên Netflix"){
        items.sort((a,b)=>(getYearNum(b)-getYearNum(a))||(getDateScore(b)-getDateScore(a))||((b.popularity||0)-(a.popularity||0)));
      }
      if(!items.length){
        ended=true;
        if(wrap)wrap.innerHTML=seenKeys.size?`<div class="note" style="text-align:center;margin:10px 0">Đã hiển thị toàn bộ ${seenKeys.size} phim trong danh mục này.</div>`:`<div class="empty">Không có dữ liệu</div>`;
        return;
      }
      const grid=$("#catGrid");
      if(grid){
        const startRank=seenKeys.size-items.length;
        grid.insertAdjacentHTML("beforeend",items.map((m,idx)=>cardHTML(m,startRank+idx,r.rank)).join(""));
        queueStreamCheck(grid);
      }
      if(wrap){
        wrap.innerHTML=`<button class="btn g" id="loadMoreCatBtn">Tải thêm phim <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"><path d="M9 6l6 6-6 6"/></svg></button>`;
        $("#loadMoreCatBtn").onclick=()=>loadNextBatch(2);
      }
    }catch{
      if(wrap)wrap.innerHTML=`<div class="empty">Không tải thêm được dữ liệu</div>`;
    }finally{
      loading=false;
    }
  }
  await loadNextBatch(3);
}

/* Vuốt ngang từ giữa màn hình sang phải trên #catView: Dùng CHÍNH XÁC công thức Math.pow(delta, 0.92) + .52s var(--spring) của vuốt dọc */
(()=>{
  let x0=0,y0=0,dx=0,dy=0,t0=0,mode="";

  catView.addEventListener("touchstart",e=>{
    if(!catOpen||e.touches.length!==1||sheetEl.classList.contains("show")||P.classList.contains("show"))return;
    const t=e.touches[0];
    if(t.clientX>window.innerWidth*0.88){x0=0;return}
    x0=t.clientX;y0=t.clientY;dx=0;dy=0;t0=Date.now();mode="";
  },{passive:true});

  catView.addEventListener("touchmove",e=>{
    if(!catOpen||!x0)return;
    const t=e.touches[0];
    const rawDx=t.clientX-x0,rawDy=t.clientY-y0;

    if(!mode){
      /* Khóa sớm UIScrollView ngay từ pixel đầu tiên nếu ngón tay đi ngang sang phải */
      if(rawDx>0&&Math.abs(rawDx)>Math.abs(rawDy)*1.05){
        if(e.cancelable)e.preventDefault();
        if(rawDx>4){
          mode="swipe-x";
          x0=t.clientX;y0=t.clientY;
          catOverlay.classList.add("dragging");
        }
        return;
      }else if(Math.abs(rawDy)>5||rawDx<-5){
        mode="scroll";
        return;
      }
      return;
    }

    if(mode==="swipe-x"){
      if(e.cancelable)e.preventDefault();
      const deltaX=Math.max(0,t.clientX-x0);
      const deltaY=t.clientY-y0;
      /* Công thức y hệt vuốt dọc: Math.pow(delta, 0.92) + thu nhỏ nhẹ theo tỷ lệ */
      dx=Math.pow(deltaX,0.92);
      dy=deltaY*0.20;
      const sc=Math.max(0.82,1-dx/1350);
      catView.style.transform=`translate3d(${dx}px,${dy}px,0) scale(${sc})`;
      catBd.style.opacity=String(Math.max(0,1-dx/380));
    }
  },{passive:false});

  const endCatTouch=()=>{
    if(mode!=="swipe-x"){x0=0;mode="";return}
    const dt=Math.max(1,Date.now()-t0);
    const vx=dx/dt;
    catOverlay.classList.remove("dragging");
    if(dx>85||vx>0.38){
      closeCategoryView("shrink-right");
    }else{
      /* Xóa inline transform để CSS .52s var(--spring) trên CoreAnimation 120Hz bật nảy mượt về chỗ cũ y hệt vuốt dọc */
      catView.style.transform="";
      catBd.style.opacity="";
    }
    x0=0;dx=0;dy=0;mode="";
  };
  catView.addEventListener("touchend",endCatTouch,{passive:true});
  catView.addEventListener("touchcancel",endCatTouch,{passive:true});
})();

let LIB=null,libFilter="all",libStatusFilter="all";
const LIBRARY_KEY="cg_personal_library_v1";
const LIBRARY_STATUSES={watchlist:"Muốn xem",watching:"Đang xem",watched:"Đã xem"};
function libraryEntries(){return store.get(LIBRARY_KEY,[]).filter(x=>x&&x.key)}
function libraryKey(meta){
  if(meta.type==="provider")return `provider:${meta.providerId}:${meta.slug}`;
  return `tmdb:${meta.type}:${meta.id}`;
}
function saveLibraryMeta(meta,patch={}){
  const items=libraryEntries(),key=libraryKey(meta),at=items.findIndex(x=>x.key===key),old=at>=0?items[at]:{};
  const next={...old,...meta,...patch,key,createdAt:old.createdAt||Date.now(),updatedAt:Date.now()};
  if(at>=0)items[at]=next;else items.unshift(next);
  store.set(LIBRARY_KEY,items);
  return next;
}
function removeLibraryEntry(key){store.set(LIBRARY_KEY,libraryEntries().filter(x=>x.key!==key))}
function findLibraryEntry(meta){const key=libraryKey(meta);return libraryEntries().find(x=>x.key===key)||null}
function tmdbLibraryMeta(m,type,id){
  return {type,id:String(id),title:ttl(m),originalTitle:m.original_title||m.original_name||"",poster:poster(m,"w500"),backdrop:m.backdrop_path?IMG+"w780"+m.backdrop_path:poster(m,"w500"),year:(m.release_date||m.first_air_date||"").slice(0,4),overview:m.overview||"",rating:m.vote_average||0};
}

/* ============================================================================
   BẢNG CHI TIẾT PHIM (#sheet):
   Vuốt ngang & Vuốt dọc dùng CHUNG công thức Math.pow(delta, 0.92) + CSS .52s var(--spring)
   - Vuốt từ trái sang phải -> Thu nhỏ mượt về GÓC PHẢI
   - Vuốt từ trên xuống hoặc bấm ✕ -> Thu nhỏ mượt xuống GÓC DƯỚI
   - Khi thả tay sớm -> Xóa class .dragging & xóa transform để CSS .52s var(--spring) nảy 120Hz
   ============================================================================ */
let shT,activeStreamData=null,activeSrvIdx=0,activeEpIdx=0;
const sheetEl=$("#sheet"),sheetPn=$("#sheet .pn"),sheetBd=$("#sheet .bd"),shClose=$("#shClose"),shBack=$("#shBack"),shGrab=$("#shGrab");
const sheetHistory=[];
let currentSheetAction=null;

function updateSheetBackBtn(){
  shBack.classList.toggle("hide",sheetHistory.length===0);
}

sheetBd.addEventListener("touchmove",e=>{if(e.cancelable)e.preventDefault()},{passive:false});

function resetSheetInlineStyles(){
  sheetPn.style.transition="";
  sheetPn.style.transform="";
  sheetPn.style.opacity="";
  sheetBd.style.transition="";
  sheetBd.style.opacity="";
}

function openSheet(){
  markInteraction(500);
  clearTimeout(shT);
  sheetEl.classList.remove("dragging");
  resetSheetInlineStyles();
  sheetPn.scrollTop=0;
  updateSheetBackBtn();
  if(!sheetEl.classList.contains("show")){
    sheetEl.classList.add("show");
    requestAnimationFrame(()=>requestAnimationFrame(()=>sheetEl.classList.add("open")));
  }else{
    sheetEl.classList.add("open");
  }
}

/* dir = "down" (thu nhỏ xuống góc dưới) | "right" (thu nhỏ về góc phải) */
function closeSheet(dir="down"){
  markInteraction(450);
  ytStop();
  clearTimeout(shT);
  sheetHistory.length=0;
  currentSheetAction=null;
  updateSheetBackBtn();
  sheetEl.classList.remove("dragging");

  sheetPn.style.transition="transform .44s var(--close-ease), opacity .34s ease";
  sheetBd.style.transition="opacity .34s ease";
  if(dir==="right"){
    sheetPn.style.transform="translate3d(52%, 6%, 0) scale(.32)";
  }else{
    sheetPn.style.transform="translate3d(0, 65%, 0) scale(.36)";
  }
  sheetPn.style.opacity="0";
  sheetBd.style.opacity="0";

  shT=setTimeout(()=>{
    sheetEl.classList.remove("open","show");
    resetSheetInlineStyles();
    $("#sc").innerHTML="";
  },430);
}

function backOrCloseSheet(dir="down"){
  if(sheetHistory.length>0){
    const prev=sheetHistory.pop();
    currentSheetAction=null;
    updateSheetBackBtn();
    sheetPn.style.transition="transform .34s var(--close-ease), opacity .28s ease";
    sheetPn.style.transform="translate3d(48%, 5%, 0) scale(.36)";
    sheetPn.style.opacity="0";
    setTimeout(()=>{
      resetSheetInlineStyles();
      prev();
    },260);
  }else{
    closeSheet(dir);
  }
}
sheetBd.onclick=()=>closeSheet("down");
shClose.onclick=e=>{e.stopPropagation();closeSheet("down")};
shGrab.onclick=e=>{e.stopPropagation();closeSheet("down")};
shBack.onclick=e=>{e.stopPropagation();backOrCloseSheet("right")};

/* Cử chỉ vuốt trên #sheet: Khóa UIScrollView ngay từ pixel đầu tiên, dùng chung Math.pow(delta, 0.92) + .52s var(--spring) */
(()=>{
  let x0=0,y0=0,dx=0,dy=0,t0=0,mode="",canPullDown=false,canSwipeRight=false;

  sheetPn.addEventListener("touchstart",e=>{
    if(e.touches.length!==1)return;
    const t=e.touches[0];
    x0=t.clientX;y0=t.clientY;dx=0;dy=0;t0=Date.now();mode="";
    const onHeader=!!e.target.closest(".sh-bar,.grab,.bk");
    const inHorizScroller=!!e.target.closest(".scroller");
    canPullDown=(sheetPn.scrollTop<=2)||onHeader;
    canSwipeRight=(x0<=64)||(!inHorizScroller&&x0<=window.innerWidth*0.58);
  },{passive:true});

  sheetPn.addEventListener("touchmove",e=>{
    if(!y0)return;
    const t=e.touches[0];
    const rawDx=t.clientX-x0,rawDy=t.clientY-y0;

    if(!mode){
      /* Khóa sớm UIScrollView ngay khi ngón tay nhích sang phải hoặc kéo xuống */
      if(canSwipeRight&&rawDx>0&&Math.abs(rawDx)>Math.abs(rawDy)*1.05){
        if(e.cancelable)e.preventDefault();
        if(rawDx>4){
          mode="edge-x";
          x0=t.clientX;y0=t.clientY;
          sheetEl.classList.add("dragging");
        }
        return;
      }else if(canPullDown&&rawDy>0&&Math.abs(rawDy)>Math.abs(rawDx)*1.05){
        if(e.cancelable)e.preventDefault();
        if(rawDy>4){
          mode="pull-y";
          x0=t.clientX;y0=t.clientY;
          sheetEl.classList.add("dragging");
        }
        return;
      }else if(Math.abs(rawDy)>5||Math.abs(rawDx)>5){
        mode="scroll";
      }
      return;
    }

    if(mode==="scroll"){
      const atTop=sheetPn.scrollTop<=0&&rawDy>0;
      const atBot=(sheetPn.scrollTop+sheetPn.clientHeight>=sheetPn.scrollHeight-1)&&rawDy<0;
      if((atTop||atBot)&&e.cancelable&&!e.target.closest(".scroller,.ep-grid")){
        e.preventDefault();
      }
      return;
    }

    if(mode==="pull-y"){
      if(e.cancelable)e.preventDefault();
      const deltaY=Math.max(0,t.clientY-y0);
      const deltaX=(t.clientX-x0)*0.22;
      dy=Math.pow(deltaY,0.92);
      const sc=Math.max(0.80,1-dy/1350);
      sheetPn.style.transform=`translate3d(${deltaX}px,${dy}px,0) scale(${sc})`;
      sheetBd.style.opacity=String(Math.max(0,1-dy/380));
    }else if(mode==="edge-x"){
      if(e.cancelable)e.preventDefault();
      const deltaX=Math.max(0,t.clientX-x0);
      const deltaY=(t.clientY-y0)*0.22;
      /* Dùng chính xác công thức Math.pow(deltaX, 0.92) và tỷ lệ scale của vuốt dọc */
      dx=Math.pow(deltaX,0.92);
      const sc=Math.max(0.80,1-dx/1350);
      sheetPn.style.transform=`translate3d(${dx}px,${deltaY}px,0) scale(${sc})`;
      sheetBd.style.opacity=String(Math.max(0,1-dx/380));
    }
  },{passive:false});

  const endSheetTouch=()=>{
    if(!mode||mode==="scroll"){y0=0;mode="";return}
    const dt=Math.max(1,Date.now()-t0);
    sheetEl.classList.remove("dragging");

    if(mode==="pull-y"){
      const vy=dy/dt;
      if(dy>85||vy>0.38){
        closeSheet("down");
      }else{
        sheetPn.style.transform="";
        sheetBd.style.opacity="";
      }
    }else if(mode==="edge-x"){
      const vx=dx/dt;
      if(dx>85||vx>0.38){
        backOrCloseSheet("right");
      }else{
        /* Xóa transform để CSS .52s var(--spring) bật nảy 120Hz về chỗ cũ y hệt như vuốt dọc */
        sheetPn.style.transform="";
        sheetBd.style.opacity="";
      }
    }
    y0=0;dx=0;dy=0;mode="";
  };
  sheetPn.addEventListener("touchend",endSheetTouch,{passive:true});
  sheetPn.addEventListener("touchcancel",endSheetTouch,{passive:true});
})();

/* Vuốt ngang từ cạnh trái trên các Tab chính (Thư viện / Tìm kiếm / Cài đặt) dùng cùng công thức Math.pow + .52s var(--spring) */
(()=>{
  let x0=0,y0=0,dx=0,t0=0,mode="";

  window.addEventListener("touchstart",e=>{
    if(e.touches.length!==1||catOpen||sheetEl.classList.contains("show")||P.classList.contains("show"))return;
    if(!tabHistory.length&&tab==="home")return;
    const t=e.touches[0];
    if(t.clientX>48||e.target.closest(".dock,input[type=range],.scroller")){x0=0;return}
    x0=t.clientX;y0=t.clientY;dx=0;t0=Date.now();mode="";
  },{passive:true});

  window.addEventListener("touchmove",e=>{
    if(!x0||catOpen||sheetEl.classList.contains("show")||P.classList.contains("show"))return;
    const t=e.touches[0];
    const rawDx=t.clientX-x0,rawDy=t.clientY-y0;
    if(!mode){
      if(rawDx>0&&Math.abs(rawDx)>Math.abs(rawDy)*1.05){
        if(e.cancelable)e.preventDefault();
        if(rawDx>4){
          mode="tab-x";
          x0=t.clientX;y0=t.clientY;
          pageEl.classList.add("dragging");
        }
        return;
      }else if(Math.abs(rawDy)>5||rawDx<-5){
        mode="scroll";
      }
      return;
    }
    if(mode==="tab-x"){
      if(e.cancelable)e.preventDefault();
      const deltaX=Math.max(0,t.clientX-x0);
      dx=Math.pow(deltaX,0.92);
      const sc=Math.max(0.86,1-dx/1500);
      pageEl.style.transform=`translate3d(${dx}px,0,0) scale(${sc})`;
    }
  },{passive:false});

  const endTabTouch=()=>{
    if(mode!=="tab-x"){x0=0;mode="";return}
    const dt=Math.max(1,Date.now()-t0);
    const vx=dx/dt;
    pageEl.classList.remove("dragging");
    if(dx>85||vx>0.38){
      const prevTab=tabHistory.pop()||"home";
      pageEl.style.transform="";
      go(prevTab,false);
    }else{
      pageEl.style.transform="";
    }
    x0=0;dx=0;mode="";
  };
  window.addEventListener("touchend",endTabTouch,{passive:true});
  window.addEventListener("touchcancel",endTabTouch,{passive:true});
})();

/* ---------- Player (Đồng bộ công thức Math.pow(delta, 0.92) + .52s var(--spring) cho cả vuốt dọc & vuốt ngang) ---------- */
const V=$("#v"),EMB=$("#emb"),P=$("#player"),CTL=$("#ctl");let list=[],idx=0,idle,saveT=0,hlsInstance=null,playerMode="m3u8";
const fmt=s=>{s=Math.max(0,s|0);const h=s/3600|0,m=(s%3600)/60|0;return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s%60).padStart(2,"0")};
function toast(t,ms=2500){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),ms)}

function resetPlayerInlineStyles(){
  P.style.transition="";
  P.style.transform="";
  P.style.borderRadius="";
  P.style.opacity="";
}

async function openPlayer(l,i){
  list=l;idx=i;
  V.controls=false;
  V.setAttribute("playsinline","");
  V.setAttribute("webkit-playsinline","true");
  resetPlayerInlineStyles();
  P.classList.add("show");
  CTL.classList.remove("hide");
  applyCfg();
  await loadItem();
}

function startEmbedInPlayer(it){
  playerMode="embed";
  P.classList.add("embed-mode");
  P.classList.remove("idle");
  CTL.classList.remove("hide");
  clearTimeout(idle);
  if(hlsInstance){hlsInstance.destroy();hlsInstance=null}
  V.pause();V.style.display="none";
  let url=it.embed;
  if((!url||url.includes("streamc.xyz"))&&it.m3u8)url=`https://player.phimapi.com/player/?url=${encodeURIComponent(it.m3u8)}`;
  EMB.style.display="block";EMB.src=url||"about:blank";
  toast("Chế độ VIP • Bấm nút ✕ góc trái trên để đóng");
}

async function startNativeVideoM3u8(it,resumeSec){
  const cleanUrl=await getCleanM3u8BlobUrl(it.m3u8);
  V.src=cleanUrl||it.m3u8;
  V.onloadedmetadata=()=>{
    if(resumeSec>10&&resumeSec<V.duration-20){V.currentTime=resumeSec;toast("Tiếp tục từ "+fmt(resumeSec))}
    else toast("Đang phát Tập "+it.epName+" (Đã lọc QC)");
  };
  try{await V.play()}catch{}
}

async function loadItem(){
  const it=list[idx];if(!it)return;
  $("#pt").textContent=`${it.title}${it.epName?" · Tập "+it.epName:""}`;
  toast("Đang nạp luồng siêu tốc…",4000);
  const pr=store.get("prog",{})[it.identifier];
  const resumeSec=it.resumeTime||((pr&&pr.eIdx===it.eIdx&&pr.sIdx===it.sIdx&&pr.t>10)?pr.t:0);

  if(list[idx+1]?.m3u8)setTimeout(()=>getCleanM3u8BlobUrl(list[idx+1].m3u8),2000);

  if(playerMode==="embed"||(!it.m3u8&&it.embed)){
    startEmbedInPlayer(it);
    save();
    return;
  }

  P.classList.remove("embed-mode");
  EMB.src="about:blank";EMB.style.display="none";
  V.style.display="block";

  if(typeof Hls!=="undefined"&&Hls.isSupported()){
    if(hlsInstance)hlsInstance.destroy();
    hlsInstance = new Hls({
      loader:CleanHlsLoader||Hls.DefaultConfig.loader,
      startFragPrefetch:true,
      maxBufferLength:20,
      maxMaxBufferLength:40,
      manifestLoadingTimeOut:8000,
      fragLoadingTimeOut:10000
    });
    hlsInstance.loadSource(it.m3u8);
    hlsInstance.attachMedia(V);
    hlsInstance.on(Hls.Events.MANIFEST_PARSED,()=>{
      if(resumeSec>10){V.currentTime=resumeSec;toast("Tiếp tục từ "+fmt(resumeSec))}
      else toast("Đang phát Tập "+it.epName+" (Đã lọc QC)");
      V.play().catch(()=>{});
    });
    hlsInstance.on(Hls.Events.ERROR,(_,data)=>{
      if(data.fatal){
        if(data.type===Hls.ErrorTypes.MEDIA_ERROR){
          hlsInstance.recoverMediaError();
        }else if(V.canPlayType("application/vnd.apple.mpegurl")){
          hlsInstance.destroy();hlsInstance=null;
          startNativeVideoM3u8(it,resumeSec);
        }else if(it.embed){
          startEmbedInPlayer(it);
        }else{
          toast("Luồng phim hiện tại bị lỗi, hãy đổi Server khác.");
        }
      }
    });
  }else if(V.canPlayType("application/vnd.apple.mpegurl")){
    await startNativeVideoM3u8(it,resumeSec);
  }else if(it.embed){
    startEmbedInPlayer(it);
  }
  wake();
}

function save(){
  const it=list[idx];if(!it)return;
  const p=store.get("prog",{});
  p[it.identifier]={
    t:playerMode==="m3u8"?V.currentTime:(it.resumeTime||15),
    d:playerMode==="m3u8"?(V.duration||0):0,
    title:it.title,
    epName:it.epName,
    img:it.img,
    providerId:it.providerId,
    slug:it.slug,
    sIdx:it.sIdx,
    eIdx:it.eIdx,
    u:Date.now()
  };
  store.set("prog",p);
}

/* Đóng Player theo hướng: "right" (thu nhỏ về góc phải) | "down" (thu nhỏ xuống góc dưới) */
function closePlayer(dir="down"){
  save();
  clearTimeout(idle);
  if(hlsInstance){hlsInstance.destroy();hlsInstance=null}
  V.pause();
  P.classList.remove("dragging");
  if(document.fullscreenElement||document.webkitFullscreenElement){
    (document.exitFullscreen||document.webkitExitFullscreen)?.call(document);
  }
  P.style.borderRadius="36px";
  P.style.transition="transform .42s var(--close-ease), opacity .34s ease, border-radius .3s ease";
  if(dir==="right"){
    P.style.transform="translate3d(4%, -44%, 0) scale(.30)";
  }else{
    P.style.transform="translate3d(-50%, 16%, 0) scale(.34)";
  }
  P.style.opacity="0";

  setTimeout(()=>{
    V.removeAttribute("src");V.load();
    EMB.src="about:blank";EMB.style.display="none";
    resetPlayerInlineStyles();
    P.classList.remove("show","idle","embed-mode");
    CTL.classList.remove("hide");
    applyCfg();
    if(!sheetEl.classList.contains("show")&&!catOpen&&(tab=="home"||tab=="lib"))go(tab,false);
  },410);
}
function hideControls(){
  clearTimeout(idle);
  P.classList.add("idle");
  CTL.classList.add("hide");
}
function wake(){
  P.classList.remove("idle");
  CTL.classList.remove("hide");
  clearTimeout(idle);
  if(!V.paused&&playerMode==="m3u8")idle=setTimeout(hideControls,3500);
}
$("#pc").onclick=e=>{e.stopPropagation();closePlayer("down")};
$("#pp").onclick=e=>{e.stopPropagation();V.paused?V.play():V.pause();wake()};

/* Vuốt Player: Vuốt ngang & vuốt dọc dùng chung công thức Math.pow(delta, 0.92) + .52s var(--spring) */
let pDragging=false;
(()=>{
  let px0=0,py0=0,pdx=0,pdy=0,t0=0,pMode="";
  P.addEventListener("touchstart",e=>{
    if(P.classList.contains("rot")||document.fullscreenElement)return;
    const t=e.touches[0];
    if(t.clientY<160||t.clientX<75){
      px0=t.clientX;py0=t.clientY;
      pdx=0;pdy=0;t0=Date.now();pMode="";
      pDragging=false;
    }else{px0=0;py0=0}
  },{passive:true});

  P.addEventListener("touchmove",e=>{
    if((!py0&&!px0)||P.classList.contains("rot"))return;
    const t=e.touches[0];
    const rawDx=t.clientX-px0,rawDy=t.clientY-py0;
    if(!pMode){
      if(px0<75&&rawDx>6&&Math.abs(rawDx)>Math.abs(rawDy)*1.05){
        pMode="x";px0=t.clientX;py0=t.clientY;
      }else if(py0<160&&rawDy>6&&Math.abs(rawDy)>Math.abs(rawDx)*1.05){
        pMode="y";px0=t.clientX;py0=t.clientY;
      }else return;
      pDragging=true;
      P.classList.add("dragging");
    }
    const deltaX=Math.max(0,t.clientX-px0);
    const deltaY=Math.max(0,t.clientY-py0);
    if(pMode==="y"){
      pdy=Math.pow(deltaY,0.92);
      const sc=Math.max(0.78,1-pdy/1350);
      P.style.transform=`translate3d(calc(-50% + ${(t.clientX-px0)*0.22}px),calc(-50% + ${pdy}px),0) scale(${sc})`;
      P.style.borderRadius=Math.min(40,pdy/3.2)+"px";
    }else if(pMode==="x"){
      pdx=Math.pow(deltaX,0.92);
      const sc=Math.max(0.78,1-pdx/1350);
      P.style.transform=`translate3d(calc(-50% + ${pdx}px),calc(-50% + ${(t.clientY-py0)*0.22}px),0) scale(${sc})`;
      P.style.borderRadius=Math.min(40,pdx/3.2)+"px";
    }
  },{passive:true});

  const endPlayerDrag=()=>{
    if(!pDragging)return;
    const dt=Math.max(1,Date.now()-t0);
    P.classList.remove("dragging");
    if(pMode==="x"&&(pdx>85||(pdx/dt)>0.38)){
      closePlayer("right");
    }else if(pMode==="y"&&(pdy>85||(pdy/dt)>0.38)){
      closePlayer("down");
    }else{
      P.style.transform="";
      P.style.borderRadius="";
    }
    setTimeout(()=>{pDragging=false},60);
    px0=0;py0=0;pdx=0;pdy=0;pMode="";
  };
  P.addEventListener("touchend",endPlayerDrag,{passive:true});
  P.addEventListener("touchcancel",endPlayerDrag,{passive:true});
})();

/* Tap 1 lần vào màn hình để ẨN các nút functions, tap lại lần nữa để HIỆN lại */
(()=>{
  let sx=0,sy=0,moved=false;
  P.addEventListener("pointerdown",e=>{
    sx=e.clientX;sy=e.clientY;moved=false;
  },{passive:true});
