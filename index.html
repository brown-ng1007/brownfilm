/* ===== CineGlass Smart Player Controls: seek ±10s, prev/next episode, in-player episode picker ===== */
(()=>{
  const epPanel=$("#episodePanel"),epListEl=$("#episodeList"),epOpen=$("#episodePickerBtn"),epClose=$("#episodePanelClose");
  const prevBtn=$("#prevEp"),nextBtn=$("#nextEp"),rewBtn=$("#rew10"),fwdBtn=$("#fwd10");
  if(!epPanel||!epListEl||!epOpen||!prevBtn||!nextBtn||!rewBtn||!fwdBtn)return;

  const canSeekCurrent=()=>{
    const it=list[idx];
    return !!(it&&it.m3u8&&playerMode==="m3u8");
  };

  function renderEpisodeList(){
    const total=list.length;
    const current=list[idx];
    $("#episodeCount").textContent=total?`${idx+1}/${total}`:"0/0";
    $("#episodeSubtitle").textContent=current?`${esc(current.title||"Phim")} · ${total} tập trong server này`:"Chưa có danh sách tập";
    prevBtn.disabled=idx<=0;
    nextBtn.disabled=idx>=total-1;
    epOpen.disabled=total<=1;
    rewBtn.disabled=!canSeekCurrent();
    fwdBtn.disabled=!canSeekCurrent();
    epListEl.innerHTML=total?list.map((it,i)=>{
      const label=it.epName?`Tập ${it.epName}`:`Tập ${i+1}`;
      return `<button class="episode-option${i===idx?" active":""}" data-episode-index="${i}" ${i===idx?'aria-current="true"':''}>
        <span class="episode-option-number">${String(i+1).padStart(2,"0")}</span>
        <span class="episode-option-name">${esc(label)}</span>
        ${i===idx?'<span class="episode-playing">Đang phát</span>':''}
      </button>`;
    }).join(""):'<div class="episode-empty">Nguồn này chưa cung cấp danh sách tập.</div>';
  }

  function openEpisodePanel(){
    if(list.length<=1){toast("Nguồn này chỉ có một tập khả dụng.");return}
    renderEpisodeList();
    epPanel.classList.add("show");
    epPanel.setAttribute("aria-hidden","false");
    wake();
    requestAnimationFrame(()=>{
      const active=epListEl.querySelector(".episode-option.active");
      active?.scrollIntoView({block:"nearest"});
    });
  }

  function closeEpisodePanel(){
    epPanel.classList.remove("show");
    epPanel.setAttribute("aria-hidden","true");
  }

  function switchEpisode(targetIndex){
    if(!Number.isInteger(targetIndex)||targetIndex<0||targetIndex>=list.length||targetIndex===idx)return;
    save();
    idx=targetIndex;
    closeEpisodePanel();
    const seek=$("#seek");if(seek)seek.value="0";
    const title=$("#pt");if(title&&list[idx])title.textContent=`${list[idx].title}${list[idx].epName?" · Tập "+list[idx].epName:""}`;
    renderEpisodeList();
    loadItem().catch(err=>{console.error(err);toast("Không thể tải tập này. Hãy thử lại.")});
    wake();
  }

  function seekBy(delta){
    if(!canSeekCurrent()){
      toast("Nguồn nhúng không hỗ trợ tua từ CineGlass. Hãy dùng điều khiển của player nguồn.");
      return;
    }
    const duration=V.duration;
    if(!Number.isFinite(duration)||duration<=0){
      toast("Video chưa sẵn sàng để tua.");
      return;
    }
    const target=Math.max(0,Math.min(duration,(V.currentTime||0)+delta));
    try{
      V.currentTime=target;
      toast(`${delta>0?"Tua tới":"Tua lùi"} ${Math.abs(delta)} giây · ${fmt(target)}`,1400);
    }catch{
      toast("Nguồn video hiện không cho phép tua.");
    }
    wake();
  }

  const originalLoadItem=loadItem;
  loadItem=async function(){
    renderEpisodeList();
    await originalLoadItem();
    renderEpisodeList();
  };

  const originalHideControls=hideControls;
  hideControls=function(){closeEpisodePanel();originalHideControls()};

  epOpen.addEventListener("click",e=>{e.stopPropagation();epPanel.classList.contains("show")?closeEpisodePanel():openEpisodePanel()});
  epClose?.addEventListener("click",e=>{e.stopPropagation();closeEpisodePanel();wake()});
  prevBtn.addEventListener("click",e=>{e.stopPropagation();switchEpisode(idx-1)});
  nextBtn.addEventListener("click",e=>{e.stopPropagation();switchEpisode(idx+1)});
  rewBtn.addEventListener("click",e=>{e.stopPropagation();seekBy(-10)});
  fwdBtn.addEventListener("click",e=>{e.stopPropagation();seekBy(10)});
  epListEl.addEventListener("click",e=>{
    const button=e.target.closest("[data-episode-index]");
    if(button)switchEpisode(Number(button.dataset.episodeIndex));
  });

  document.addEventListener("keydown",e=>{
    if(!P.classList.contains("show"))return;
    const target=e.target;
    if(target&&target.closest&&target.closest("input,textarea,select,[contenteditable='true']"))return;
    if(e.key==="ArrowLeft"){
      if(canSeekCurrent()){e.preventDefault();seekBy(-10)}
    }else if(e.key==="ArrowRight"){
      if(canSeekCurrent()){e.preventDefault();seekBy(10)}
    }else if(e.key.toLowerCase()==="n"){
      e.preventDefault();switchEpisode(idx+1);
    }else if(e.key.toLowerCase()==="p"){
      e.preventDefault();switchEpisode(idx-1);
    }
  });

  P.addEventListener("click",e=>{
    if(!epPanel.classList.contains("show"))return;
    if(e.target===P||e.target===V||e.target===EMB)closeEpisodePanel();
  });

  V.addEventListener("loadedmetadata",renderEpisodeList);
  V.addEventListener("durationchange",renderEpisodeList);
  renderEpisodeList();
})();

(()=>{
  const syncChrome=()=>{
    document.querySelectorAll("[data-cg-route]").forEach(el=>{
      const route=el.dataset.cgRoute;
      const active=route===tab || (route==="search"&&tab==="search");

  const originalGo=go;
  go=function(k,pushHist=true){originalGo(k,pushHist);syncChrome()};
  document.addEventListener("click",e=>{
    const route=e.target.closest("[data-cg-route]");
    if(route){e.preventDefault();go(route.dataset.cgRoute);return}
    const row=e.target.closest("[data-cg-row]");
    if(row){const n=Number(row.dataset.cgRow);if(tab!=="home")go("home",false);setTimeout(()=>openCategory(n),45);return}
  });
  const form=$("#cgGlobalSearchForm"),input=$("#cgGlobalSearch");
  form?.addEventListener("submit",e=>{
    e.preventDefault();const q=input?.value.trim()||"";go("search");
    if(q.length>=2)setTimeout(()=>{const local=$("#page #q");if(local){local.value=q;doSearch(q,navId)}},50);
  });
  input?.addEventListener("keydown",e=>{if(e.key==="Escape")input.value=""});
  document.addEventListener("keydown",e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"&&!P.classList.contains("show")){e.preventDefault();input?.focus()}
  });
  syncChrome();
})();
