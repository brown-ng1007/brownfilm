    tailwind.config = { darkMode: 'class' };

  <style>
    :root {
      --bg-color: #eef0f6;
      --bg-gradient: radial-gradient(circle at 15% 15%, rgba(255, 59, 48, 0.12), transparent 40%),
                     radial-gradient(circle at 85% 80%, rgba(59, 130, 246, 0.12), transparent 40%);
      --card-bg: rgba(255, 255, 255, 0.72);
      --card-border: rgba(255, 255, 255, 0.65);
      --text-main: #0f172a;
      --text-sub: #64748b;
      --accent-red: #ff3b30;
    }
    html.dark {
      --bg-color: #070709;
      --bg-gradient: radial-gradient(circle at 12% 10%, rgba(255, 69, 58, 0.16), transparent 42%),
                     radial-gradient(circle at 88% 85%, rgba(99, 102, 241, 0.14), transparent 45%);
      --card-bg: rgba(24, 24, 29, 0.68);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-red: #ff453a;
    }
    html, body {
      min-height: 100%;
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* Hiệu ứng Kính Lỏng Không Gian (iOS 27 Liquid Glass) */
    .ios-glass {
      background: var(--card-bg);
      backdrop-filter: blur(32px) saturate(190%);
      -webkit-backdrop-filter: blur(32px) saturate(190%);
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.25),
                  inset 0 1px 0 0 rgba(255, 255, 255, 0.15);
    }
    .ios-pill {
      background: rgba(120, 120, 128, 0.14);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 0.5px solid rgba(255, 255, 255, 0.12);
    }
    .accent-glow {
      background: linear-gradient(135deg, #ff453a 0%, #ff2d55 100%);
      box-shadow: 0 4px 14px rgba(255, 59, 48, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 9999px; }
  </style>
</head>
