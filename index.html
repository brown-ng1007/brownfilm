<!doctype html>
<html lang="vi" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CineGlass - iOS 27.2 Liquid Glass</title>
<meta name="theme-color" content="#faf7fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CineGlass">
<link rel="preconnect" href="https://phimapi.com" crossorigin>
<link rel="preconnect" href="https://phim.nguonc.com" crossorigin>
<link rel="dns-prefetch" href="https://phimimg.com">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<style>
:root{
  --bg:#faf7fa;
  --bg-mesh:radial-gradient(at 10% 6%,rgba(250,45,72,.10) 0px,transparent 50%),radial-gradient(at 90% 20%,rgba(255,122,89,.08) 0px,transparent 45%),radial-gradient(at 50% 92%,rgba(175,82,222,.08) 0px,transparent 55%);
  --card:rgba(255,255,255,.76);
  --text:#1c1c1e;
  --sub:#726e77;
  --glass:rgba(255,255,255,var(--nav-alpha,0.02));
  --glass-rim:inset 0 1px 1px rgba(255,255,255,.95),inset 0 -1px 1px rgba(250,45,72,.06);
  --pill-bg:linear-gradient(180deg,rgba(255,255,255,.95) 0%,rgba(255,235,240,.75) 100%);
  --pill-rim:inset 0 1.2px 1.8px rgba(255,255,255,1),inset 0 -1px 1.2px rgba(250,45,72,.14),0 6px 20px rgba(250,45,72,.16);
  --accent:#fa2d48;
  --accent-grad:linear-gradient(135deg,#ff375f 0%,#fa2d48 55%,#ff5e3a 100%);
  --line:rgba(250,45,72,.08);
  --shadow:0 16px 36px -6px rgba(35,20,30,.10),0 3px 12px rgba(250,45,72,.05);
  --sat:env(safe-area-inset-top);
  --sab:env(safe-area-inset-bottom);
  --spring:cubic-bezier(0.16, 1.05, 0.28, 1.08);
  --fluid:cubic-bezier(0.25, 1, 0.35, 1);
}
:root[data-theme=dark]{
  --bg:#0f0d13;
  --bg-mesh:radial-gradient(at 12% 8%,rgba(250,45,72,.16) 0px,transparent 52%),radial-gradient(at 88% 25%,rgba(191,90,242,.11) 0px,transparent 48%),radial-gradient(at 50% 90%,rgba(255,100,130,.09) 0px,transparent 58%);
  --card:rgba(32,28,40,.76);
  --text:#f5f5f7;
  --sub:#a19ca8;
  --glass:rgba(36,30,46,var(--nav-alpha,0.02));
  --glass-rim:inset 0 1px 1px rgba(255,255,255,.18),inset 0 -1px 1px rgba(255,55,95,.08);
  --pill-bg:linear-gradient(180deg,rgba(255,65,105,.30) 0%,rgba(250,45,72,.16) 100%);
  --pill-rim:inset 0 1px 1.8px rgba(255,255,255,.32),inset 0 -1px 1px rgba(250,45,72,.22),0 6px 22px rgba(250,45,72,.24);
  --accent:#ff375f;
  --line:rgba(255,255,255,.08);
  --shadow:0 16px 40px rgba(0,0,0,.58);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background-color:var(--bg);background-image:var(--bg-mesh);background-attachment:fixed;color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
#page{padding:calc(var(--sat) + 12px) 0 calc(var(--sab) + 96px);min-height:100vh}
h1{font-size:34px;margin:8px 20px 14px;font-weight:800;background:var(--accent-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
h2{font-size:21px;margin:26px 20px 10px;font-weight:700}
.scroller{display:flex;gap:13px;overflow-x:auto;padding:8px 20px 16px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.card{flex:0 0 128px;text-align:left}
.card .p{width:128px;aspect-ratio:2/3;border-radius:18px;object-fit:cover;background:var(--card);border:.5px solid var(--line)}
.card b{display:block;font-size:13px;margin-top:8px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card small{color:var(--sub);font-size:12px}
.tabs{position:fixed;left:18px;right:18px;bottom:max(5px,calc(var(--sab) - 9px));z-index:30;display:flex;border-radius:24px;padding:3px;backdrop-filter:blur(32px)}
#tabPill{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/4);border-radius:21px;background:var(--pill-bg);box-shadow:var(--pill-rim);transition:transform .5s var(--spring);pointer-events:none}
.tabs button{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:1.5px;padding:6px 0;font-size:10.5px;font-weight:600;color:var(--sub)}
.tabs button.on{color:var(--accent)}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.85}
.search{margin:0 20px 8px;display:flex;gap:8px;align-items:center;border-radius:16px;padding:11px 14px;background:var(--card);border:.5px solid var(--line)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px;padding:8px 20px}
.grid .card{flex:none}.grid .card .p{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 20px}
.chip{padding:8px 14px;border-radius:18px;background:var(--card);border:.5px solid var(--line);font-size:13.5px;font-weight:600}
.chip.on{background:var(--accent-grad);color:#fff;border-color:transparent}
.list{margin:0 20px 16px;border-radius:24px;background:var(--card);border:.5px solid var(--line);overflow:hidden}
.list>div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:.5px solid var(--line)}
.list input[type=range]{flex:1;accent-color:var(--accent)}
.note{color:var(--sub);font-size:13px;margin:0 28px 14px}
.btn{background:var(--accent-grad);color:#fff;border-radius:16px;padding:12px 18px;font-weight:700;display:inline-flex;gap:8px;align-items:center}
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.show{display:block}
#sheet .bd{position:absolute;inset:0;background:rgba(15,10,20,.44);backdrop-filter:blur(14px)}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;top:calc(var(--sat) + 18px);background:var(--bg);border-radius:32px 32px 0 0;overflow-y:auto;padding-bottom:50px}
.bk{aspect-ratio:16/10;margin-top:-18px}.bk img{width:100%;height:100%;object-fit:cover}
.dt{padding:0 20px;margin-top:-34px;position:relative;z-index:1}.dt h3{font-size:28px;margin:0 0 6px}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px;max-height:210px;overflow-y:auto;margin:8px 0 14px}
.ep-grid button{background:var(--card);border:.5px solid var(--line);border-radius:11px;padding:8px 6px;font-size:12px;font-weight:600;text-align:center}
.ep-grid button.on{background:var(--accent-grad);color:#fff}
#player{position:fixed;inset:0;z-index:80;background:#000;display:none;color:#fff}
#player.show{display:block}
#player video,#player iframe{width:100%;height:100%;object-fit:contain}
.ctl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:20px;background:linear-gradient(rgba(0,0,0,.6),transparent 30%,transparent 70%,rgba(0,0,0,.8));z-index:10}
.top{display:flex;align-items:center;gap:12px}.top b{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2)}
.rb svg{width:22px;height:22px;fill:#fff}
.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);padding:10px 16px;border-radius:20px;background:rgba(0,0,0,.8);opacity:0;transition:.3s;z-index:20;font-size:14px}
.toast.on{opacity:1}
.sp{display:flex;justify-content:center;padding:40px}.sp i{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.empty{color:var(--sub);text-align:center;padding:30px}
</style>
</head>
<body>
<div id="page"></div>
<nav class="tabs glass" id="tabs"></nav>
<div id="sheet"><div class="bd"></div><div class="pn"><div class="grab"></div><div id="sc"></div></div></div>
<div id="player">
  <video id="v" playsinline webkit-playsinline preload="auto"></video>
  <div class="ctl" id="ctl">
    <div class="top"><button class="rb" id="pc">✕</button><b id="pt"></b></div>
    <div class="bot"><button class="btn" id="fs">Toàn màn hình</button></div>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
let cfg=Object.assign({theme:"auto",tmdb:"3309069624518eb702e51e01c9ad58f8",navAlpha:0.02},store.get("cfg",{}));
function applyNavAlpha(){document.documentElement.style.setProperty("--nav-alpha",cfg.navAlpha);}
const saveCfg=()=>{store.set("cfg",cfg);applyNavAlpha()};
applyNavAlpha();

const TABS=[["home","Khám phá"],["lib","Thư viện"],["search","Tìm kiếm"],["me","Cài đặt"]];
let tab="home";
const tabsEl=$("#tabs");
tabsEl.innerHTML=`<div id="tabPill"></div>`+TABS.map(([k,l])=>`<button data-k="${k}"><svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" fill="none" stroke-width="1.8"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>${l}</button>`).join("");
tabsEl.onclick=e=>{const b=e.target.closest("button");if(b)go(b.dataset.k)};

function go(k){
  tab=k;
  const idx=TABS.findIndex(x=>x[0]===k);
  $("#tabPill").style.transform=`translate3d(${idx*100}%,0,0)`;
  [...tabsEl.querySelectorAll("button")].forEach(b=>b.classList.toggle("on",b.dataset.k===k));
  if(k==="home")pHome();
  else if(k==="lib")pLib();
  else if(k==="search")pSearch();
  else if(k==="me")pMe();
}

async function tmdb(path){
  const r=await fetch(`https://api.themoviedb.org/3${path}?api_key=${cfg.tmdb}&language=vi-VN`);
  return r.json();
}

async function pHome(){
  $("#page").innerHTML=`<h1>Khám phá</h1><div id="rows"><div class="sp"><i></i></div></div>`;
  const d=await tmdb("/trending/all/week");
  $("#rows").innerHTML=`<div class="scroller">${(d.results||[]).map(m=>`<button class="card" onclick="openMovie(${m.id})"><img class="p" src="https://image.tmdb.org/t/p/w342${m.poster_path}"><b>${esc(m.title||m.name)}</b></button>`).join("")}</div>`;
}

async function openMovie(id){
  const m=await tmdb(`/movie/${id}`);
  $("#sc").innerHTML=`<div class="bk"><img src="https://image.tmdb.org/t/p/w780${m.backdrop_path}"></div><div class="dt"><h3>${esc(m.title)}</h3><p>${esc(m.overview)}</p><button class="btn" onclick="playDemo()">Phát thử</button></div>`;
  $("#sheet").classList.add("show");requestAnimationFrame(()=>$("#sheet").classList.add("open"));
}

function playDemo(){
  $("#player").classList.add("show");
  $("#v").src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4";
  $("#v").play();
}

$("#pc").onclick=()=>{
  $("#player").classList.remove("show");
  $("#v").pause();
};
$("#sheet .bd").onclick=()=>{
  $("#sheet").classList.remove("open");setTimeout(()=>$("#sheet").classList.remove("show"),300);
};

function pLib(){$("#page").innerHTML=`<h1>Thư viện</h1><div class="empty">Đang cập nhật thư viện...</div>`;}
function pSearch(){$("#page").innerHTML=`<h1>Tìm kiếm</h1><div class="empty">Nhập từ khóa tìm kiếm...</div>`;}
function pMe(){
  $("#page").innerHTML=`<h1>Cài đặt</h1><div class="list"><div><span>Độ mờ thanh điều hướng</span><input type="range" id="navRng" min="0" max="0.9" step="0.05" value="${cfg.navAlpha}"></div></div>`;
  $("#navRng").oninput=e=>{cfg.navAlpha=e.target.value;saveCfg()};
}

go("home");
</script>
</body>
</html>
