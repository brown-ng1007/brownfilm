<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Brown's Cinema - Expanded Recommendations</title>

  <link rel="preconnect" href="https://phimapi.com" crossorigin />
  <link rel="preconnect" href="https://phim.nguonc.com" crossorigin />
  <link rel="dns-prefetch" href="https://phimimg.com" />

  <link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?w=180&h=180&fit=crop" />
  <link rel="icon" type="image/png" href="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?w=64&h=64&fit=crop" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <style>
    :root {
      --bg-color: #f2f2f7;
      --card-bg: rgba(255, 255, 255, 0.9);
      --text-main: #000000;
      --text-sub: #3c3c43;
      --accent-red: #ff3b30;
    }
    html.dark {
      --bg-color: #000000;
      --card-bg: rgba(28, 28, 30, 0.9);
      --text-main: #ffffff;
      --text-sub: #ebebf5;
      --accent-red: #ff453a;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    .ios-blur {
      background-color: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 0.5px solid rgba(120, 120, 120, 0.2);
    }
    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-thumb { background: rgba(120, 120, 128, 0.3); border-radius: 9999px; }
  </style>
</head>

<body class="flex flex-col h-screen overflow-hidden p-2 md:p-3">

  <!-- Header -->
  <header class="shrink-0 max-w-7xl w-full mx-auto mb-2">
    <div class="ios-blur rounded-2xl px-4 py-2.5 flex items-center justify-between shadow-sm">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-[var(--accent-red)] flex items-center justify-center text-white font-bold shadow-sm shrink-0 text-sm">
          ▶
        </div>
        <h1 class="font-bold text-sm md:text-base tracking-tight">Brown's Cinema</h1>
      </div>
      <button onclick="toggleTheme()" class="ios-blur px-3 py-1.5 rounded-xl text-xs font-semibold">
        <span id="themeText">🌙 Tối</span>
      </button>
    </div>
  </header>

  <!-- Đang xem dở -->
  <section id="continueWatchingSection" class="shrink-0 max-w-7xl w-full mx-auto mb-2 hidden">
    <div class="ios-blur rounded-2xl p-2.5">
      <div class="flex items-center justify-between mb-1">
        <h2 class="text-[11px] font-bold uppercase tracking-wider text-emerald-500">● Đang Xem Dở</h2>
        <button onclick="clearWatchHistory()" class="text-[11px] font-semibold text-rose-500 hover:underline">Xóa</button>
      </div>
      <div id="continueWatchingList" class="grid grid-cols-2 sm:grid-cols-4 gap-2"></div>
    </div>
  </section>

  <!-- Main Layout -->
  <main class="flex-1 max-w-7xl w-full mx-auto grid grid-cols-1 lg:grid-cols-12 gap-3 min-h-0 overflow-hidden">
    
    <!-- Cột Trái: Player -->
    <div class="lg:col-span-7 xl:col-span-8 flex flex-col min-h-0 space-y-2">
      <div class="ios-blur rounded-2xl p-2 shrink-0 flex flex-col shadow-lg">
        
        <div id="videoWrapper" class="relative w-full aspect-video bg-black rounded-xl overflow-hidden shadow-md">
          <video id="hlsVideo" class="w-full h-full hidden" controls playsinline></video>
          <iframe
            id="embedIframe"
            class="w-full h-full hidden"
            frameborder="0"
            allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
            allowfullscreen
          ></iframe>

          <div id="playerPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-center p-4 text-white">
            <div class="w-12 h-12 rounded-full bg-red-500/20 border border-red-500 flex items-center justify-center text-xl mb-2 text-red-500 font-bold">▶</div>
            <h3 class="text-sm font-semibold">Chọn phim từ kho đề xuất bên phải</h3>
            <p class="text-[11px] text-white/60 mt-0.5">Hàng loạt phim mới cập nhật liên tục</p>
          </div>
        </div>

        <div class="mt-2 px-1 flex flex-wrap items-center justify-between gap-2">
          <div class="min-w-0 flex-1">
            <h2 id="currentMovieTitle" class="font-bold text-xs md:text-sm truncate">Chưa chọn phim</h2>
            <p id="currentStreamStatus" class="text-[10px] font-medium text-emerald-500 truncate">Sẵn sàng</p>
          </div>

          <div class="flex flex-wrap items-center gap-1">
            <button onclick="toggleEpisodePopup()" class="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-[var(--accent-red)] text-white shadow-sm flex items-center gap-1">
              📂 Tập <span id="currentEpBadge" class="bg-black/30 px-1 rounded text-[9px]">--</span>
            </button>
            <select id="playbackSpeed" onchange="changeSpeed(this.value)" class="ios-blur rounded-lg px-1.5 py-1 text-[11px] bg-transparent">
              <option value="1">1.0x</option>
              <option value="1.25">1.25x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2.0x</option>
            </select>
            <button id="btnModeM3u8" onclick="switchPlayerMode('m3u8')" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-blue-600 text-white">M3U8</button>
            <button id="btnModeEmbed" onclick="switchPlayerMode('embed')" class="ios-blur px-2.5 py-1 rounded-lg text-[11px]">VIP</button>
            <button onclick="nativeFullscreen()" class="ios-blur px-2.5 py-1 rounded-lg text-[11px] font-bold bg-amber-600 text-white shadow-sm">⛶ Phóng To</button>
          </div>
        </div>
      </div>

      <!-- Server nhanh -->
      <div class="ios-blur rounded-2xl px-3 py-2 flex items-center justify-between gap-2 shrink-0">
        <span class="text-[11px] font-bold uppercase tracking-wider text-[var(--text-sub)]">Server:</span>
        <div id="serverList" class="flex flex-wrap gap-1 text-[11px] font-medium text-[var(--text-sub)]">Chưa chọn phim</div>
      </div>
    </div>

    <!-- Cột Phải: Kho Phim & Trang Chủ (Mở rộng số lượng đề xuất) -->
    <div class="lg:col-span-5 xl:col-span-4 ios-blur rounded-2xl p-3 flex flex-col min-h-0 overflow-hidden shadow-lg">
      
      <div class="grid grid-cols-2 gap-1 p-1 ios-blur rounded-xl mb-2 shrink-0">
        <button id="tabHomeBtn" onclick="switchTab('home')" class="py-1.5 rounded-lg text-xs font-bold transition bg-[var(--accent-red)] text-white shadow-sm">
          🏠 Trang Chủ
        </button>
        <button id="tabSearchBtn" onclick="switchTab('search')" class="py-1.5 rounded-lg text-xs font-semibold transition text-[var(--text-sub)]">
          🔍 Kho Phim
        </button>
      </div>

      <!-- TAB 1: TRANG CHỦ (Hiển thị đầy đủ danh sách đề xuất) -->
      <div id="contentHome" class="flex-1 overflow-y-auto space-y-2 pr-1 min-h-0">
        <div class="flex items-center justify-between mb-1">
          <h3 class="text-[11px] font-bold uppercase tracking-wider text-[var(--text-sub)] opacity-80">🔥 Đề Xuất Phim Mới (<span id="homeCount">0</span>)</h3>
        </div>
        <div id="homeRecommendationsList" class="space-y-2">
          <div class="text-center text-[var(--text-sub)] text-xs py-12 animate-pulse font-medium">⚡ Đang quét toàn bộ kho phim nóng...</div>
        </div>
      </div>

      <!-- TAB 2: KHO PHIM -->
      <div id="contentSearch" class="flex-1 flex-col hidden overflow-hidden min-h-0">
        <div class="flex items-center justify-between mb-1.5 shrink-0">
          <h3 class="text-[11px] font-bold uppercase tracking-wider text-[var(--text-sub)] opacity-80">Tra Cứu Kho Phim</h3>
          <span id="resultCount" class="text-[10px] font-bold px-2 py-0.2 rounded-full ios-blur">0 phim</span>
        </div>

        <div class="relative mb-2 shrink-0">
          <input
            id="searchInput"
            type="text"
            placeholder="Tìm kiếm phim..."
            class="w-full ios-blur rounded-xl pl-3 pr-8 py-2 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-[var(--accent-red)] placeholder:text-gray-400"
            oninput="handleSearchInput(this.value)"
          />
          <div id="searchSpinner" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 border-2 border-[var(--accent-red)] border-t-transparent rounded-full animate-spin"></div>
          <span id="searchIcon" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-xs text-gray-400 pointer-events-none">🔍</span>
        </div>

        <div id="providerFilterTabs" class="flex gap-1 mb-2 overflow-x-auto pb-1 shrink-0"></div>
        <div id="searchResults" class="flex-1 overflow-y-auto space-y-1.5 pr-1 min-h-0"></div>
      </div>

    </div>

  </main>

  <!-- POP-UP CHỌN TẬP PHIM -->
  <div id="episodePopupModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="ios-blur rounded-3xl p-4 max-w-md w-full max-h-[75vh] flex flex-col shadow-2xl">
      <div class="flex items-center justify-between mb-3 pb-2 border-b border-gray-500/20">
        <h3 class="font-bold text-xs uppercase tracking-wider">📂 Danh Sách Tập Phim</h3>
        <button onclick="toggleEpisodePopup()" class="w-6 h-6 rounded-full ios-blur flex items-center justify-center text-xs font-bold">✕</button>
      </div>
      <div id="popupEpisodeList" class="grid grid-cols-4 sm:grid-cols-6 gap-2 overflow-y-auto pr-1">
        <div class="col-span-full text-center text-xs text-gray-400 py-6">Chưa chọn phim.</div>
      </div>
    </div>
  </div>

  <script>
    const PROVIDERS = [
      {
        id: 'kkphim',
        name: 'KKPhim Mới',
        type: 'kkphim',
        badge: 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 font-semibold',
        latestUrl: () => 'https://phimapi.com/danh-sach/phim-moi-cap-nhat?page=1',
        searchUrl: (kw) => `https://phimapi.com/v1/api/tim-kiem?keyword=${encodeURIComponent(kw)}&limit=25`,
        detailUrl: (slug) => `https://phimapi.com/phim/${slug}`,
        imgPrefix: 'https://phimimg.com/'
      },
      {
        id: 'kk_bo',
        name: 'Phim Bộ VIP',
        type: 'kkphim',
        badge: 'bg-blue-500/15 text-blue-600 dark:text-blue-400 font-semibold',
        latestUrl: () => 'https://phimapi.com/v1/api/danh-sach/phim-bo?page=1&limit=25',
        searchUrl: (kw) => `https://phimapi.com/v1/api/tim-kiem?keyword=${encodeURIComponent(kw)}&limit=25`,
        detailUrl: (slug) => `https://phimapi.com/phim/${slug}`,
        imgPrefix: 'https://phimimg.com/'
      },
      {
        id: 'nguonc',
        name: 'NguonC Hub',
        type: 'nguonc',
        badge: 'bg-amber-500/15 text-amber-600 dark:text-amber-400 font-semibold',
        latestUrl: () => 'https://phim.nguonc.com/api/films/phim-moi-cap-nhat?page=1',
        searchUrl: (kw) => `https://phim.nguonc.com/api/films/search?keyword=${encodeURIComponent(kw)}`,
        detailUrl: (slug) => `https://phim.nguonc.com/api/film/${slug}`,
        imgPrefix: ''
      }
    ];

    const HISTORY_KEY = 'browns_cinema_history_v96';
    const THEME_KEY = 'browns_cinema_theme_v96';
    const CACHE_KEY = 'browns_cinema_instant_cache_v96';

    const searchCache = new Map();
    const detailCache = new Map();

    let hlsInstance = null;
    let preferredMode = 'm3u8';
    let allFetchedItems = [];
    let currentMovieMeta = null;
    let currentServerIdx = 0;
    let currentEpisodeIdx = 0;
    let currentEpisodeData = { link_m3u8: '', link_embed: '', name: '' };
    let pendingResumeTime = 0;
    let lastSaveTimestamp = 0;
    let searchDebounceTimer = null;

    (function initSystemTheme() {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved) document.documentElement.classList.toggle('dark', saved === 'dark');
      else document.documentElement.classList.toggle('dark', window.matchMedia('(prefers-color-scheme: dark)').matches);
      updateThemeUI();
    })();

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
      updateThemeUI();
    }

    function updateThemeUI() {
      const isDark = document.documentElement.classList.contains('dark');
      document.getElementById('themeText').textContent = isDark ? '☀️ Sáng' : '🌙 Tối';
    }

    function nativeFullscreen() {
      const video = document.getElementById('hlsVideo');
      const iframe = document.getElementById('embedIframe');
      
      if (!video.classList.contains('hidden')) {
        if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
        else if (video.requestFullscreen) video.requestFullscreen();
      } else if (!iframe.classList.contains('hidden')) {
        if (iframe.requestFullscreen) iframe.requestFullscreen();
        else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
      }
    }

    function switchTab(tab) {
      const btnHome = document.getElementById('tabHomeBtn');
      const btnSearch = document.getElementById('tabSearchBtn');
      const contentHome = document.getElementById('contentHome');
      const contentSearch = document.getElementById('contentSearch');

      if (tab === 'home') {
        btnHome.className = 'py-1.5 rounded-lg text-xs font-bold transition bg-[var(--accent-red)] text-white shadow-sm';
        btnSearch.className = 'py-1.5 rounded-lg text-xs font-semibold transition text-[var(--text-sub)]';
        contentHome.classList.remove('hidden'); contentHome.classList.add('flex');
        contentSearch.classList.add('hidden'); contentSearch.classList.remove('flex');
      } else {
        btnSearch.className = 'py-1.5 rounded-lg text-xs font-bold transition bg-[var(--accent-red)] text-white shadow-sm';
        btnHome.className = 'py-1.5 rounded-lg text-xs font-semibold transition text-[var(--text-sub)]';
        contentSearch.classList.remove('hidden'); contentSearch.classList.add('flex');
        contentHome.classList.add('hidden'); contentHome.classList.remove('flex');
      }
    }

    function toggleEpisodePopup() {
      document.getElementById('episodePopupModal').classList.toggle('hidden');
    }

    async function fetchWithTimeout(url, ms = 3500) {
      const ctrl = new AbortController();
      const id = setTimeout(() => ctrl.abort(), ms);
      try {
        const res = await fetch(url, { signal: ctrl.signal });
        clearTimeout(id);
        return await res.json();
      } catch (e) {
        clearTimeout(id);
        throw e;
      }
    }

    (function instantLoadFromCache() {
      const cachedData = localStorage.getItem(CACHE_KEY);
      if (cachedData) {
        try {
          allFetchedItems = JSON.parse(cachedData);
          if (allFetchedItems.length > 0) {
            renderHomeRecommendations(allFetchedItems);
            renderSearchResults(allFetchedItems);
          }
        } catch (e) {}
      }
    })();

    function startHlsPlayer(m3u8Url) {
      const video = document.getElementById('hlsVideo');
      const iframe = document.getElementById('embedIframe');
      iframe.src = 'about:blank';
      iframe.classList.add('hidden');
      video.classList.remove('hidden');

      document.getElementById('btnModeM3u8').className = 'px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-blue-600 text-white';
      document.getElementById('btnModeEmbed').className = 'ios-blur px-2.5 py-1 rounded-lg text-[11px]';
      document.getElementById('currentStreamStatus').textContent = `⚡ M3U8 • Tập ${currentEpisodeData.name}`;

      if (Hls.isSupported()) {
        if (hlsInstance) hlsInstance.destroy();
        hlsInstance = new Hls({ maxBufferLength: 8, startFragPrefetch: true });
        hlsInstance.loadSource(m3u8Url);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          if (pendingResumeTime > 2) {
            video.currentTime = pendingResumeTime;
            pendingResumeTime = 0;
          }
          video.playbackRate = parseFloat(document.getElementById('playbackSpeed').value) || 1;
          video.play().catch(() => {});
        });
        hlsInstance.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal && currentEpisodeData.link_embed) startEmbedPlayer(currentEpisodeData.link_embed);
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = m3u8Url;
        video.play().catch(() => {});
      }
    }

    function startEmbedPlayer(embedUrl) {
      const video = document.getElementById('hlsVideo');
      const iframe = document.getElementById('embedIframe');
      if (hlsInstance) hlsInstance.destroy();
      video.pause();
      video.classList.add('hidden');

      let finalUrl = embedUrl;
      if ((!finalUrl || finalUrl.includes('streamc.xyz')) && currentEpisodeData.link_m3u8) {
        finalUrl = `https://player.phimapi.com/player/?url=${encodeURIComponent(currentEpisodeData.link_m3u8)}`;
      }

      iframe.classList.remove('hidden');
      iframe.src = finalUrl;
      document.getElementById('btnModeM3u8').className = 'ios-blur px-2.5 py-1 rounded-lg text-[11px]';
      document.getElementById('btnModeEmbed').className = 'px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-blue-600 text-white';
      document.getElementById('currentStreamStatus').textContent = `🎬 VIP • Tập ${currentEpisodeData.name}`;
    }

    const videoEl = document.getElementById('hlsVideo');
    videoEl.addEventListener('timeupdate', () => {
      const now = Date.now();
      if (now - lastSaveTimestamp > 4000 && videoEl.currentTime > 5 && currentMovieMeta) {
        lastSaveTimestamp = now;
        saveWatchProgress(videoEl.currentTime, videoEl.duration || 0);
      }
    });

    async function fetchFromProvider(provider, keyword = '') {
      const cacheKey = `${provider.id}:${keyword || 'latest'}`;
      if (searchCache.has(cacheKey)) return searchCache.get(cacheKey);

      try {
        const url = keyword ? provider.searchUrl(keyword) : provider.latestUrl();
        const json = await fetchWithTimeout(url, 3500);
        const rawItems = json?.data?.items || json?.items || [];
        const imgDomain = json?.data?.APP_DOMAIN_CDN_IMAGE
          ? (json.data.APP_DOMAIN_CDN_IMAGE.endsWith('/') ? json.data.APP_DOMAIN_CDN_IMAGE : json.data.APP_DOMAIN_CDN_IMAGE + '/')
          : provider.imgPrefix;

        const items = rawItems.map(item => {
          let thumb = item.poster_url || item.thumb_url || '';
          if (thumb && !thumb.startsWith('http')) thumb = imgDomain + thumb;
          return {
            title: item.name,
            originTitle: item.origin_name || item.original_name || '',
            slug: item.slug,
            year: item.year || '',
            thumb,
            provider
          };
        });
        const resObj = { provider, items };
        searchCache.set(cacheKey, resObj);
        return resObj;
      } catch (e) {
        return { provider, items: [], error: true };
      }
    }

    async function runMultiSearch(keyword = '') {
      const results = await Promise.all(PROVIDERS.map(p => fetchFromProvider(p, keyword)));
      
      allFetchedItems = [];
      const seen = new Set();
      results.forEach(r => {
        r.items.forEach(item => {
          const key = `${item.provider.id}:${item.slug}`;
          if (!seen.has(key)) {
            seen.add(key);
            allFetchedItems.push(item);
          }
        });
      });

      if (!keyword && allFetchedItems.length > 0) {
        localStorage.setItem(CACHE_KEY, JSON.stringify(allFetchedItems));
        renderHomeRecommendations(allFetchedItems);
      }

      renderSearchResults(allFetchedItems);
    }

    function renderHomeRecommendations(items) {
      const el = document.getElementById('homeRecommendationsList');
      document.getElementById('homeCount').textContent = items.length;
      if (!items.length) {
        el.innerHTML = `<div class="text-center text-[var(--text-sub)] text-xs py-10">Chưa có đề xuất phim.</div>`;
        return;
      }
      el.innerHTML = items.map(item => {
        const sTitle = (item.title || '').replace(/'/g, "\\'");
        const sThumb = (item.thumb || '').replace(/'/g, "\\'");
        return `
          <div onclick="loadMovieDetail('${item.provider.id}', '${item.slug}', '${sTitle}', '${sThumb}')" class="ios-blur rounded-xl p-2 flex gap-2 cursor-pointer shadow-sm">
            <img src="${item.thumb}" loading="lazy" class="w-10 h-14 object-cover rounded-lg bg-slate-800 shrink-0" onerror="this.src='https://via.placeholder.com/60x90/1e293b/94a3b8?text=Film'"/>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between mb-0.5">
                <span class="text-[8px] font-bold px-1.5 py-0.1 rounded ${item.provider.badge}">${item.provider.name}</span>
                <span class="text-[9px] font-bold text-[var(--accent-red)]">🔥 Hot</span>
              </div>
              <h4 class="text-[11px] font-semibold text-[var(--text-main)] truncate">${item.title}</h4>
              <p class="text-[9px] text-[var(--text-sub)] opacity-80 truncate">${item.originTitle}</p>
            </div>
          </div>
        `;
      }).join('');
    }

    function handleSearchInput(val) {
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => {
        runMultiSearch(val.trim());
      }, 250);
    }

    function renderSearchResults(items) {
      const el = document.getElementById('searchResults');
      document.getElementById('resultCount').textContent = `${items.length} phim`;
      if (!items.length) {
        el.innerHTML = `<div class="text-center text-[var(--text-sub)] text-xs py-10">Không tìm thấy phim.</div>`;
        return;
      }
      el.innerHTML = items.map(item => {
        const sTitle = (item.title || '').replace(/'/g, "\\'");
        const sThumb = (item.thumb || '').replace(/'/g, "\\'");
        return `
          <div onclick="loadMovieDetail('${item.provider.id}', '${item.slug}', '${sTitle}', '${sThumb}')" class="ios-blur rounded-xl p-2 flex gap-2 cursor-pointer shadow-sm">
            <img src="${item.thumb}" loading="lazy" class="w-10 h-14 object-cover rounded-lg bg-slate-800 shrink-0" onerror="this.src='https://via.placeholder.com/60x90/1e293b/94a3b8?text=Film'"/>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between mb-0.5">
                <span class="text-[8px] font-bold px-1.5 py-0.1 rounded ${item.provider.badge}">${item.provider.name}</span>
              </div>
              <h4 class="text-[11px] font-semibold text-[var(--text-main)] truncate">${item.title}</h4>
              <p class="text-[9px] text-[var(--text-sub)] opacity-80 truncate">${item.originTitle}</p>
            </div>
          </div>
        `;
      }).join('');
    }

    async function loadMovieDetail(providerId, slug, fallbackTitle = '', fallbackThumb = '', sIdx = 0, eIdx = 0, resumeSec = 0) {
      const serverListEl = document.getElementById('serverList');
      serverListEl.innerHTML = `<span class="text-[var(--accent-red)] font-semibold animate-pulse text-xs">⚡ Đang nạp...</span>`;

      try {
        const provider = PROVIDERS.find(p => p.id === providerId) || PROVIDERS[0];
        const data = await fetchWithTimeout(provider.detailUrl(slug), 3500);
        const movie = data.movie || data?.data?.item || {};
        const title = movie.name || fallbackTitle || 'Phim';
        let servers = [];

        if (provider.type === 'nguonc') {
          const rawSrv = movie.episodes || [];
          servers = rawSrv.map(s => ({ server_name: `🔗 NguonC (${s.server_name})`, server_data: (s.items || []).map(ep => ({ name: ep.name, link_m3u8: ep.m3u8 || '', link_embed: ep.embed || '' })) }));
        } else {
          const rawEps = data.episodes || data?.data?.item?.episodes || [];
          servers = rawEps.map(s => ({ server_name: `⚡ ${s.server_name}`, server_data: s.server_data || [] }));
        }

        currentMovieMeta = { providerId, providerName: provider.name, slug, title, thumb: fallbackThumb };
        document.getElementById('currentMovieTitle').textContent = title;

        if (!servers.length || !servers[0].server_data?.length) {
          serverListEl.innerHTML = `<span class="text-rose-500 font-semibold text-xs">Chưa có tập.</span>`;
          return;
        }

        window._currentServers = servers;
        pendingResumeTime = resumeSec;
        renderServers(sIdx, eIdx);
      } catch (e) {
        serverListEl.innerHTML = `<span class="text-rose-500 font-semibold text-xs">Lỗi tải dữ liệu.</span>`;
      }
    }

    function renderServers(sIdx = 0, eIdx = 0) {
      const servers = window._currentServers || [];
      currentServerIdx = sIdx < servers.length ? sIdx : 0;
      document.getElementById('serverList').innerHTML = servers.map((s, i) => `
        <button onclick="renderServers(${i}, 0)" class="px-2 py-0.5 rounded-lg text-[10px] font-bold ${i === currentServerIdx ? 'bg-[var(--accent-red)] text-white shadow-sm' : 'ios-blur'}">${s.server_name}</button>
      `).join('');

      renderPopupEpisodes();
      selectAndPlayEpisode(eIdx);
    }

    function renderPopupEpisodes() {
      const servers = window._currentServers || [];
      const activeServer = servers[currentServerIdx];
      const epList = activeServer ? activeServer.server_data || [] : [];
      const popupList = document.getElementById('popupEpisodeList');

      if (!epList.length) {
        popupList.innerHTML = `<div class="col-span-full text-center text-xs text-gray-400 py-6">Không có tập phim.</div>`;
        return;
      }

      popupList.innerHTML = epList.map((ep, i) => `
        <button onclick="selectAndPlayEpisode(${i}); toggleEpisodePopup();" class="py-2 rounded-xl text-xs font-bold truncate ${i === currentEpisodeIdx ? 'bg-[var(--accent-red)] text-white shadow-sm' : 'ios-blur'}">Tập ${ep.name}</button>
      `).join('');
    }

    function selectAndPlayEpisode(idx) {
      const activeServer = (window._currentServers || [])[currentServerIdx];
      if (!activeServer) return;
      const ep = activeServer.server_data[idx];
      if (!ep) return;
      currentEpisodeIdx = idx;

      document.getElementById('currentEpBadge').textContent = `Tập ${ep.name}`;
      renderPopupEpisodes();

      currentEpisodeData = { link_m3u8: ep.link_m3u8 || '', link_embed: ep.link_embed || '', name: ep.name };
      document.getElementById('playerPlaceholder').classList.add('hidden');

      if (preferredMode === 'm3u8' && currentEpisodeData.link_m3u8) {
        startHlsPlayer(currentEpisodeData.link_m3u8);
      } else if (currentEpisodeData.link_embed) {
        startEmbedPlayer(currentEpisodeData.link_embed);
      } else if (currentEpisodeData.link_m3u8) {
        startHlsPlayer(currentEpisodeData.link_m3u8);
      }
      saveWatchProgress(pendingResumeTime || 0, 0);
    }

    function switchPlayerMode(mode) {
      preferredMode = mode;
      if (mode === 'm3u8' && currentEpisodeData.link_m3u8) startHlsPlayer(currentEpisodeData.link_m3u8);
      else if (currentEpisodeData.link_embed || currentEpisodeData.link_m3u8) startEmbedPlayer(currentEpisodeData.link_embed);
    }

    function changeSpeed(val) {
      videoEl.playbackRate = parseFloat(val) || 1;
    }

    function getWatchHistory() {
      try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch { return []; }
    }

    function saveWatchProgress(time, dur) {
      if (!currentMovieMeta) return;
      let list = getWatchHistory().filter(x => x.slug !== currentMovieMeta.slug);
      list.unshift({ ...currentMovieMeta, sIdx: currentServerIdx, eIdx: currentEpisodeIdx, epName: currentEpisodeData.name, time: Math.floor(time), dur: Math.floor(dur) });
      localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, 4)));
      renderContinueWatching();
    }

    function renderContinueWatching() {
      const list = getWatchHistory();
      const sec = document.getElementById('continueWatchingSection');
      if (!list.length) { sec.classList.add('hidden'); return; }
      sec.classList.remove('hidden');
      document.getElementById('continueWatchingList').innerHTML = list.map(item => {
        const sTitle = (item.title || '').replace(/'/g, "\\'");
        const sThumb = (item.thumb || '').replace(/'/g, "\\'");
        return `
          <div onclick="loadMovieDetail('${item.providerId}', '${item.slug}', '${sTitle}', '${sThumb}', ${item.sIdx || 0}, ${item.eIdx || 0}, ${item.time || 0})" class="ios-blur rounded-xl p-1.5 flex items-center gap-2 cursor-pointer shadow-sm">
            <img src="${item.thumb}" class="w-8 h-12 object-cover rounded-lg bg-slate-800 shrink-0" onerror="this.src='https://via.placeholder.com/60x90/1e293b/94a3b8?text=Play'"/>
            <div class="min-w-0 flex-1">
              <h4 class="text-[11px] font-semibold text-[var(--text-main)] truncate">${item.title}</h4>
              <p class="text-[9px] font-bold text-emerald-500">▶ Tập ${item.epName}</p>
            </div>
          </div>
        `;
      }).join('');
    }

    function clearWatchHistory() {
      localStorage.removeItem(HISTORY_KEY);
      renderContinueWatching();
    }

    renderContinueWatching();
    runMultiSearch('');
  </script>
</body>
</html>
