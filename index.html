<!doctype html>
<html lang="vi" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CineGlass</title>
<meta name="theme-color" content="#faf7fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CineGlass">
<link rel="preconnect" href="https://phimapi.com" crossorigin>
<link rel="preconnect" href="https://phim.nguonc.com" crossorigin>
<link rel="dns-prefetch" href="https://phimimg.com">
<link rel="apple-touch-icon" id="ati" href="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?w=180&h=180&fit=crop">
<link rel="icon" id="fvi" href="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?w=64&h=64&fit=crop">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<style>
:root{
  --bg:#faf7fa;
  --bg-mesh:radial-gradient(at 10% 6%,rgba(250,45,72,.10) 0px,transparent 50%),radial-gradient(at 90% 20%,rgba(255,122,89,.08) 0px,transparent 45%),radial-gradient(at 50% 92%,rgba(175,82,222,.08) 0px,transparent 55%);
  --card:rgba(255,255,255,.76);
  --text:#1c1c1e;
  --sub:#726e77;
  --glass:rgba(255,255,255,.64);
  --glass-rim:inset 0 1px 1px rgba(255,255,255,.95),inset 0 -1px 1px rgba(250,45,72,.06);
  --pill-bg:linear-gradient(180deg,rgba(255,255,255,.95) 0%,rgba(255,235,240,.75) 100%);
  --pill-rim:inset 0 1.2px 1.8px rgba(255,255,255,1),inset 0 -1px 1.2px rgba(250,45,72,.14),0 6px 20px rgba(250,45,72,.16);
  --accent:#fa2d48;
  --accent-grad:linear-gradient(135deg,#ff375f 0%,#fa2d48 55%,#ff5e3a 100%);
  --line:rgba(250,45,72,.10);
  --shadow:0 16px 36px -6px rgba(35,20,30,.10),0 3px 12px rgba(250,45,72,.05);
  --r:24px;
  --sat:env(safe-area-inset-top);
  --sab:env(safe-area-inset-bottom);
  --spring:cubic-bezier(.16,1.08,.28,1);
  --fluid:cubic-bezier(.25,1,.35,1);
}
:root[data-theme=dark]{
  --bg:#0f0d13;
  --bg-mesh:radial-gradient(at 12% 8%,rgba(250,45,72,.16) 0px,transparent 52%),radial-gradient(at 88% 25%,rgba(191,90,242,.11) 0px,transparent 48%),radial-gradient(at 50% 90%,rgba(255,100,130,.09) 0px,transparent 58%);
  --card:rgba(32,28,40,.76);
  --text:#f5f5f7;
  --sub:#a19ca8;
  --glass:rgba(36,30,46,.55);
  --glass-rim:inset 0 1px 1px rgba(255,255,255,.20),inset 0 -1px 1px rgba(255,55,95,.10);
  --pill-bg:linear-gradient(180deg,rgba(255,65,105,.30) 0%,rgba(250,45,72,.16) 100%);
  --pill-rim:inset 0 1px 1.8px rgba(255,255,255,.32),inset 0 -1px 1px rgba(250,45,72,.22),0 6px 22px rgba(250,45,72,.24);
  --accent:#ff375f;
  --line:rgba(255,255,255,.10);
  --shadow:0 16px 40px rgba(0,0,0,.58);
}
@media(prefers-color-scheme:dark){
  :root[data-theme=auto]{
    --bg:#0f0d13;
    --bg-mesh:radial-gradient(at 12% 8%,rgba(250,45,72,.16) 0px,transparent 52%),radial-gradient(at 88% 25%,rgba(191,90,242,.11) 0px,transparent 48%),radial-gradient(at 50% 90%,rgba(255,100,130,.09) 0px,transparent 58%);
    --card:rgba(32,28,40,.76);
    --text:#f5f5f7;
    --sub:#a19ca8;
    --glass:rgba(36,30,46,.55);
    --glass-rim:inset 0 1px 1px rgba(255,255,255,.20),inset 0 -1px 1px rgba(255,55,95,.10);
    --pill-bg:linear-gradient(180deg,rgba(255,65,105,.30) 0%,rgba(250,45,72,.16) 100%);
    --pill-rim:inset 0 1px 1.8px rgba(255,255,255,.32),inset 0 -1px 1px rgba(250,45,72,.22),0 6px 22px rgba(250,45,72,.24);
    --accent:#ff375f;
    --line:rgba(255,255,255,.10);
    --shadow:0 16px 40px rgba(0,0,0,.58);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background-color:var(--bg);background-image:var(--bg-mesh);background-attachment:fixed;color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;touch-action:manipulation}
img{display:block;pointer-events:none}
#page{padding:calc(var(--sat) + 12px) 0 calc(var(--sab) + 96px);min-height:100vh;animation:fade .35s var(--fluid);transform-origin:center top;transition:transform .48s var(--spring),filter .48s var(--fluid),opacity .38s ease}
body.sheet-OpenVisual #page{transform:scale(.94) translateY(8px);filter:blur(4px);opacity:.75}
@keyframes fade{from{opacity:0;transform:translateY(6px) scale(.995)}to{opacity:1;transform:none}}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
::view-transition-old(root){animation:.25s ease both fadeout}::view-transition-new(root){animation:.42s var(--fluid) both in}
@keyframes fadeout{to{opacity:0;transform:scale(.98)}}

/* Hiệu ứng quang học Liquid Glass hữu cơ */
.glass{
  background:var(--glass);
  border:.5px solid var(--line);
  box-shadow:var(--glass-rim),var(--shadow);
  position:relative;
  overflow:hidden;
}
.glass::before,.btn::before,.chip::before{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(150px circle at var(--tx,50%) var(--ty,50%),rgba(255,255,255,.50),transparent 75%);
  opacity:var(--t-op,0);
  transition:opacity .35s ease;
  pointer-events:none;
  border-radius:inherit;
  z-index:2;
}
.tabs.glass{
  -webkit-backdrop-filter:blur(30px) saturate(210%);
  backdrop-filter:blur(30px) saturate(210%);
  transform:translateZ(0);
  will-change:transform;
  transition:transform .4s var(--spring),box-shadow .4s ease;
}
.tabs.glass.touching{
  transform:translateZ(0) scale(1.022);
  box-shadow:inset 0 1px 2px rgba(255,255,255,.9),0 18px 44px rgba(250,45,72,.20);
}
#player .glass{background:rgba(18,14,24,.58);border-color:rgba(255,255,255,.24);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 1px 1.5px rgba(255,255,255,.32),0 10px 28px rgba(0,0,0,.5)}
#rows section{content-visibility:auto;contain-intrinsic-size:auto 250px}
body.sheeted #page{visibility:hidden}
h1{font-size:34px;letter-spacing:-.8px;margin:8px 20px 14px;font-weight:800;background:var(--accent-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
h2{font-size:21px;letter-spacing:-.4px;margin:26px 20px 10px;font-weight:700}
.scroller{contain:layout paint;display:flex;gap:13px;overflow-x:auto;padding:8px 20px 16px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroller::-webkit-scrollbar{display:none}

/* Card phim phản hồi đàn hồi hữu cơ */
.card{flex:0 0 128px;scroll-snap-align:start;text-align:left;transition:transform .4s var(--spring),filter .25s ease;position:relative;will-change:transform}
.card:active{transform:scale(.91) translateY(1.5px);filter:brightness(1.05)}
.card .p{width:128px;aspect-ratio:2/3;border-radius:18px;object-fit:cover;background:var(--card);box-shadow:0 6px 18px rgba(20,10,20,.08);border:.5px solid var(--line);transition:box-shadow .35s ease}
.card:active .p{box-shadow:0 2px 8px rgba(250,45,72,.20)}
.card b{display:block;font-size:13px;margin-top:8px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card small{color:var(--sub);font-size:12px}
.card.wide{flex-basis:230px}.card.wide .p{width:230px;aspect-ratio:16/10}
.bar{position:relative;height:3.5px;background:rgba(120,120,128,.22);border-radius:4px;margin-top:6px;overflow:hidden}.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent-grad)}
.sk{background:var(--card);border-radius:18px;flex:0 0 128px;aspect-ratio:2/3}
.hero{margin:0 20px;position:relative;border-radius:28px;overflow:hidden;aspect-ratio:4/5;max-height:62vh;width:calc(100% - 40px);display:block;text-align:left;color:#fff;box-shadow:var(--shadow);transition:transform .45s var(--spring)}
.hero:active{transform:scale(.97)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .65s var(--fluid)}
.hero:active img{transform:scale(1.025)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 42%,rgba(18,12,22,.88))}
.hero div{position:absolute;left:20px;right:20px;bottom:20px;z-index:1}.hero b{font-size:28px;letter-spacing:-.6px;display:block}.hero span{opacity:.88;font-size:14px}

/* Thanh điều hướng Liquid Pill quán tính lò xo */
.tabs{position:fixed;left:18px;right:18px;bottom:max(5px,calc(var(--sab) - 9px));z-index:30;display:flex;border-radius:24px;padding:3px;user-select:none;-webkit-user-select:none;touch-action:none}
#tabPill{
  position:absolute;
  top:3px;
  bottom:3px;
  left:3px;
  width:calc((100% - 6px)/4);
  border-radius:21px;
  background:var(--pill-bg);
  box-shadow:var(--pill-rim);
  transition:transform .5s var(--spring),width .35s var(--spring);
  pointer-events:none;
  z-index:0;
  will-change:transform;
}
.tabs.scrubbing #tabPill{
  transition:transform .06s linear;
  transform:translate3d(var(--pill-x,0px),0,0) scale(1.04,1.03)!important;
}
.tabs.morphing #tabPill{
  animation:liquidPillMorph .48s var(--spring);
}
@keyframes liquidPillMorph{
  0%{scale:1 1}
  32%{scale:1.15 .88}
  68%{scale:.95 1.05}
  100%{scale:1 1}
}
.tabs button{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:1.5px;padding:6px 0;border-radius:21px;font-size:10.5px;font-weight:600;color:var(--sub);transition:color .25s ease,transform .36s var(--spring)}
.tabs button:active{transform:scale(.86)}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;transition:transform .4s var(--spring)}
.tabs button.on{color:var(--accent)}
.tabs button.on svg{transform:translateY(-1px) scale(1.08)}

.search{margin:0 20px 8px;display:flex;gap:8px;align-items:center;border-radius:16px;padding:11px 14px;background:var(--card);border:.5px solid var(--line);box-shadow:var(--glass-rim),0 4px 14px rgba(0,0,0,.04);transition:transform .35s var(--spring),box-shadow .3s ease}
.search:focus-within{transform:scale(1.015);box-shadow:inset 0 1px 2px rgba(255,255,255,.9),0 6px 22px rgba(250,45,72,.15);border-color:var(--accent)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px;padding:8px 20px}
.grid .card{flex:none}.grid .card .p{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 20px}
.chip{position:relative;overflow:hidden;padding:8px 14px;border-radius:18px;background:var(--card);border:.5px solid var(--line);box-shadow:var(--glass-rim);font-size:13.5px;font-weight:600;transition:transform .38s var(--spring),background .25s ease,box-shadow .25s ease}
.chip:active{transform:scale(.89)}
.chip.on{background:var(--accent-grad);color:#fff;border-color:transparent;box-shadow:inset 0 1px 1.5px rgba(255,255,255,.55),0 5px 14px rgba(250,45,72,.28)}
.list{margin:0 20px 16px;border-radius:var(--r);background:var(--card);border:.5px solid var(--line);box-shadow:var(--glass-rim),0 4px 16px rgba(0,0,0,.03);overflow:hidden}
.list>div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:.5px solid var(--line)}.list>div:last-child{border:0}
.list input[type=text],.list input[type=password]{background:none;border:0;outline:0;color:var(--text);text-align:right;flex:1;min-width:0;font-size:15px}
.seg{display:flex;background:rgba(250,45,72,.08);border-radius:12px;padding:2.5px;flex-wrap:wrap;gap:2px}.seg button{padding:6px 12px;border-radius:9.5px;font-size:13px;font-weight:600;transition:transform .35s var(--spring),background .2s ease}.seg button:active{transform:scale(.91)}.seg button.on{background:var(--card);color:var(--accent);box-shadow:var(--glass-rim),0 2px 6px rgba(0,0,0,.10)}
.note{color:var(--sub);font-size:13px;margin:0 28px 14px}
.btn{position:relative;overflow:hidden;background:var(--accent-grad);color:#fff;border-radius:16px;padding:12px 18px;font-weight:700;display:inline-flex;gap:8px;align-items:center;transition:transform .4s var(--spring),box-shadow .25s ease;box-shadow:inset 0 1px 1.5px rgba(255,255,255,.55),0 6px 18px rgba(250,45,72,.28)}
.btn:active{transform:scale(.90) translateY(1px);box-shadow:inset 0 1px 2px rgba(255,255,255,.8),0 2px 8px rgba(250,45,72,.22)}
.btn.g{background:var(--card);color:var(--accent);border:.5px solid var(--line);box-shadow:var(--glass-rim)}

/* Sheet thông tin phim kéo thả quán tính lò xo */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.show{display:block}
#sheet .bd{position:absolute;inset:0;background:rgba(15,10,20,.44);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);opacity:0;transition:opacity .4s ease}
#sheet .pn{
  position:absolute;left:0;right:0;bottom:0;top:calc(var(--sat) + 18px);
  background-color:var(--bg);background-image:var(--bg-mesh);
  border-radius:32px 32px 0 0;
  border-top:1px solid rgba(255,255,255,.7);
  overflow-y:auto;
  transform:translate3d(0,100%,0);
  transition:transform .52s var(--spring);
  will-change:transform;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding-bottom:calc(var(--sab) + 30px);
  box-shadow:0 -14px 48px rgba(0,0,0,.24);
}
#sheet.dragging .pn,#sheet.dragging .bd{transition:none!important}
#sheet.open .bd{opacity:1}#sheet.open .pn{transform:translate3d(0,0,0)}
.grab{width:42px;height:5px;border-radius:4px;background:rgba(140,130,145,.38);margin:9px auto;position:sticky;top:7px;z-index:3;transition:transform .3s var(--spring),background .25s ease}
#sheet.dragging .grab{transform:scaleX(1.3);background:var(--accent)}
.bk{position:relative;aspect-ratio:16/10;margin-top:-18px}.bk img{width:100%;height:100%;object-fit:cover}.bk:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,var(--bg))}
.dt{padding:0 20px;margin-top:-34px;position:relative;z-index:1}.dt h3{font-size:28px;letter-spacing:-.6px;margin:0 0 6px}.meta{color:var(--sub);font-size:14px;display:flex;gap:10px;flex-wrap:wrap}
.rate{color:var(--accent);font-weight:700}.acts{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}.dt p{line-height:1.5}
.prov{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}.prov span,.prov button{background:var(--card);border:.5px solid var(--line);box-shadow:var(--glass-rim);border-radius:12px;padding:7px 12px;font-size:13px;font-weight:600;transition:transform .34s var(--spring)}
.prov button:active{transform:scale(.90)}
.prov button.on{background:var(--accent-grad);color:#fff;border-color:transparent}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px;max-height:210px;overflow-y:auto;margin:8px 0 14px;padding:2px}
.ep-grid button{background:var(--card);border:.5px solid var(--line);box-shadow:var(--glass-rim);border-radius:11px;padding:8px 6px;font-size:12px;font-weight:600;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:transform .32s var(--spring)}
.ep-grid button:active{transform:scale(.87)}
.ep-grid button.on{background:var(--accent-grad);color:#fff;border-color:transparent}
.tr{aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;margin:10px 0}.tr iframe{width:100%;height:100%;border:0}

/* Player thu nhỏ hữu cơ đàn hồi */
#player{position:fixed;inset:0;z-index:80;background:#000;display:none;color:#fff;user-select:none;-webkit-user-select:none;transition:transform .48s var(--spring),border-radius .35s ease;will-change:transform;overflow:hidden}
#player.show{display:block;animation:in .42s var(--fluid)}
#player.dragging{transition:none!important}
#player video,#player iframe{width:100%;height:100%;object-fit:contain;background:#000;border:0}
.ctl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(var(--sat) + 12px) 16px calc(var(--sab) + 16px);background:linear-gradient(rgba(0,0,0,.6),transparent 28%,transparent 65%,rgba(0,0,0,.75));transition:opacity .3s;z-index:10}
#player.idle .ctl{opacity:0;pointer-events:none}
#player.embed-mode .ctl{background:none;pointer-events:none;opacity:1!important}
#player.embed-mode .ctl .top,#player.embed-mode .ctl .bot .row2{pointer-events:auto}
#player.embed-mode .ctl .mid,#player.embed-mode .ctl #seekRow{display:none!important}
.top{display:flex;align-items:center;gap:12px;z-index:12}.top b{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.rb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;transition:transform .36s var(--spring)}.rb:active{transform:scale(.82)}.rb svg{width:22px;height:22px;fill:#fff}
.mid{display:flex;justify-content:center;align-items:center;gap:36px}.mid .rb{width:54px;height:54px}.mid .big{width:80px;height:80px;background:rgba(250,45,72,.75)!important}.mid .big svg{width:34px;height:34px}
.bot .row{display:flex;align-items:center;gap:10px;font-size:12px;font-variant-numeric:tabular-nums}
.bot input[type=range]{flex:1;accent-color:var(--accent);height:24px}
.bot .row2{display:flex;justify-content:space-between;margin-top:6px;gap:6px;flex-wrap:wrap}
.toast{position:absolute;left:50%;bottom:calc(var(--sab) + 110px);transform:translate(-50%,20px) scale(.90);padding:12px 18px;border-radius:20px;opacity:0;transition:transform .45s var(--spring),opacity .3s ease;z-index:15;white-space:nowrap;font-size:14px;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.sp{display:flex;justify-content:center;padding:40px}.sp i{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.empty{color:var(--sub);text-align:center;padding:30px 40px}
</style>
</head>
<body>
<div id="page"></div>
<nav class="tabs glass" id="tabs"></nav>
<div id="sheet"><div class="bd"></div><div class="pn"><div class="grab"></div><div id="sc"></div></div></div>
<div id="player">
  <video id="v" playsinline webkit-playsinline preload="auto"></video>
  <iframe id="emb" style="display:none" sandbox="allow-scripts allow-same-origin allow-forms allow-presentation" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen></iframe>
  <div class="ctl" id="ctl">
    <div class="top">
      <button class="rb glass" id="pc" aria-label="Đóng"><svg viewBox="0 0 24 24"><path d="M6.4 5L5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6z"/></svg></button>
      <b id="pt"></b>
      <button class="rb glass" id="pn" aria-label="Tập sau"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zM16 6h2v12h-2z"/></svg></button>
    </div>
    <div class="mid" id="midCtl">
      <button class="rb glass" id="bk10"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 11-6 6H4a8 8 0 108-8z"/></svg></button>
      <button class="rb big glass" id="pp"><svg viewBox="0 0 24 24" id="ppi"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="rb glass" id="fw10"><svg viewBox="0 0 24 24" style="transform:scaleX(-1)"><path d="M12 5V1L7 6l5 5V7a6 6 0 11-6 6H4a8 8 0 108-8z"/></svg></button>
    </div>
    <div class="bot">
      <div class="row" id="seekRow"><span id="tc">0:00</span><input type="range" id="sk" min="0" max="1000" value="0"><span id="td">0:00</span></div>
      <div class="row2">
        <button class="chip glass" id="spd">1×</button>
        <button class="chip glass" id="modeBtn">Luồng: M3U8 Sạch QC</button>
        <button class="chip glass" id="an">Tự chuyển: Bật</button>
        <button class="rb glass" id="fs" aria-label="Toàn màn hình"><svg viewBox="0 0 24 24"><path d="M5 5h5v2H7v3H5zm9 0h5v5h-2V7h-3zM5 14h2v3h3v2H5zm12 0h2v5h-5v-2h3z"/></svg></button>
      </div>
    </div>
  </div>
  <div class="toast glass" id="toast"></div>

<script>

/* ---------- BỘ LỌC CẮT QUẢNG CÁO TRỰC TIẾP TRONG M3U8 ---------- */
function stripAdsFromM3u8(text,baseUrl=""){
  if(!text)return text;
  const resolveUrl=u=>{if(!baseUrl||/^https?:\/\//i.test(u))return u;try{return new URL(u,baseUrl).href}catch{return u}};
  if(!text.includes("#EXT-X-DISCONTINUITY")){
    if(!baseUrl)return text;
    return text.split(/\r?\n/).map(l=>{const t=l.trim();return(!t||t.startsWith("#"))?l:resolveUrl(t)}).join("\n");
  }
  const lines=text.split(/\r?\n/),headerLines=[],blocks=[];
  let cur=[],inBody=false;
  for(const raw of lines){
    const l=raw.trim();if(!l||l==="#EXT-X-ENDLIST")continue;
    if(!inBody&&!l.startsWith("#EXTINF:")&&l!=="#EXT-X-DISCONTINUITY"){headerLines.push(l)}
    else{
      inBody=true;
      if(l==="#EXT-X-DISCONTINUITY"){if(cur.length)blocks.push(cur);cur=[]}
      else cur.push(l.startsWith("#")?l:resolveUrl(l));
    }
  }
  if(cur.length)blocks.push(cur);
  if(blocks.length<=1)return[...headerLines,...(blocks[0]||[]),"#EXT-X-ENDLIST"].join("\n");

  const stats=blocks.map(b=>{
    const urls=b.filter(x=>!x.startsWith("#"));
    const dur=b.filter(x=>x.startsWith("#EXTINF:")).reduce((s,x)=>s+(parseFloat(x.slice(8))||0),0);
    const sample=urls[0]||"";
    const prefix=sample.slice(0,Math.max(0,sample.lastIndexOf("/")));
    return{lines:b,count:urls.length,dur,prefix,sample};
  });
  const pCounts={};stats.forEach(s=>{pCounts[s.prefix]=(pCounts[s.prefix]||0)+s.count});
  let mainPrefix="",maxC=-1;
  for(const p in pCounts){if(pCounts[p]>maxC){maxC=pCounts[p];mainPrefix=p}}

  const cleanBlocks=stats.filter(s=>{
    if(/quangcao|adjump|ads|bet|casino|宣传/i.test(s.sample))return false;
    if(s.prefix!==mainPrefix&&maxC>15)return false;
    if(s.count<=12&&s.dur<45&&maxC>25)return false;
    return true;
  });
  const finalBlocks=cleanBlocks.length?cleanBlocks:stats;
  return[...headerLines,...finalBlocks.flatMap((s,i)=>i===0?s.lines:["#EXT-X-DISCONTINUITY",...s.lines]),"#EXT-X-ENDLIST"].join("\n");
}

let CleanHlsLoader=null;
try{

      constructor(config){
        super(config);
        const origLoad=this.load.bind(this);
        this.load=function(context,config,callbacks){
          const origSuccess=callbacks.onSuccess;
          callbacks.onSuccess=function(response,stats,ctx,net){
            if(typeof response.data==="string"&&response.data.includes("#EXT-X-DISCONTINUITY")){
              response.data=stripAdsFromM3u8(response.data);
            }
            origSuccess(response,stats,ctx,net);
          };
          origLoad(context,config,callbacks);
        };
      }
    };
  }
}catch{}

const m3u8BlobCache=new Map();
async function getCleanM3u8BlobUrl(m3u8Url){
  if(!m3u8Url)return"";
  if(m3u8BlobCache.has(m3u8Url))return m3u8BlobCache.get(m3u8Url);
  try{
    const ctrl=new AbortController(),tid=setTimeout(()=>ctrl.abort(),2200);
    const masterTxt=await fetch(m3u8Url,{signal:ctrl.signal}).then(r=>r.text());
    clearTimeout(tid);
    if(!masterTxt.includes("#EXTM3U"))return m3u8Url;
    if(masterTxt.includes("#EXT-X-STREAM-INF")){
      const lines=masterTxt.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
      let subRel="";
      for(let i=0;i<lines.length;i++){
        if(lines[i].startsWith("#EXT-X-STREAM-INF")&&lines[i+1]&&!lines[i+1].startsWith("#")){subRel=lines[i+1];break}
      }
      if(subRel){
        const subUrl=new URL(subRel,m3u8Url).href;
        const ctrl2=new AbortController(),tid2=setTimeout(()=>ctrl2.abort(),2200);
        const subTxt=await fetch(subUrl,{signal:ctrl2.signal}).then(r=>r.text());
        clearTimeout(tid2);
        const cleaned=stripAdsFromM3u8(subTxt,subUrl);
        const blobUrl=URL.createObjectURL(new Blob([cleaned],{type:"application/vnd.apple.mpegurl"}));
        m3u8BlobCache.set(m3u8Url,blobUrl);
        return blobUrl;
      }
    }
    const cleaned=stripAdsFromM3u8(masterTxt,m3u8Url);
    const blobUrl=URL.createObjectURL(new Blob([cleaned],{type:"application/vnd.apple.mpegurl"}));
    m3u8BlobCache.set(m3u8Url,blobUrl);
    return blobUrl;
  }catch{return m3u8Url}
}

async function fetchWithTimeout(url,ms=3200){
  const ctrl=new AbortController(),id=setTimeout(()=>ctrl.abort(),ms);
  try{const res=await fetch(url,{signal:ctrl.signal});clearTimeout(id);return await res.json()}catch(e){clearTimeout(id);throw e}

async function fetchFromProvider(provider,keyword=""){
  const ck=`${provider.id}:${keyword||"latest"}`;
  if(searchCache.has(ck))return searchCache.get(ck);
  try{
    const url=keyword?provider.searchUrl(keyword):provider.latestUrl();
    const json=await fetchWithTimeout(url,3200);
    const rawItems=json?.data?.items||json?.items||[];
    const imgDomain=json?.data?.APP_DOMAIN_CDN_IMAGE?(json.data.APP_DOMAIN_CDN_IMAGE.endsWith("/")?json.data.APP_DOMAIN_CDN_IMAGE:json.data.APP_DOMAIN_CDN_IMAGE+"/"):provider.imgPrefix;
    const items=rawItems.map(it=>{
      let thumb=it.poster_url||it.thumb_url||"";
      if(thumb&&!thumb.startsWith("http"))thumb=imgDomain+thumb;
      return{title:it.name,originTitle:it.origin_name||it.original_name||"",slug:it.slug,year:it.year||"",thumb,providerId:provider.id,providerName:provider.name};
    });
    const resObj={provider,items};searchCache.set(ck,resObj);return resObj;
  }catch{return{provider,items:[],error:true}}
}
async function rescueKkphimM3u8(slug,title,originTitle=""){

  for(const q of queries){

      const s=await fetchWithTimeout(`https://phimapi.com/v1/api/tim-kiem?keyword=${encodeURIComponent(q)}&limit=2`,2500);
      const first=s?.data?.items?.[0];

}

  }
  let thumb=movie.poster_url||movie.thumb_url||"";

  let backdrop=movie.thumb_url||movie.poster_url||thumb;

  const firstM3u8=servers[0]?.server_data?.[0]?.link_m3u8;

async function findStreamForTmdb(viTitle,origTitle){
  const queries=[...new Set([viTitle,origTitle].filter(Boolean))];
  const kkSearches=await Promise.all(queries.map(q=>fetchFromProvider(PROVIDERS[0],q)));
  const kkItems=kkSearches.flatMap(r=>r.items);
  if(kkItems.length){
    const nVi=norm(viTitle),nOr=norm(origTitle);
    const best=kkItems.find(x=>
      (nVi&&(norm(x.title).includes(nVi)||nVi.includes(norm(x.title))))||
      (nOr&&(norm(x.originTitle).includes(nOr)||nOr.includes(norm(x.originTitle))))
    )||kkItems[0];
    try{
      const det=await fetchProviderMovieDetail(best.providerId,best.slug,best.title);
      if(det.servers.length&&det.servers[0].server_data?.length)return det;
    }catch{}
  }
  const ngSearches=await Promise.all(queries.map(q=>fetchFromProvider(PROVIDERS[4],q)));

      if(det.servers.length&&det.servers[0].server_data?.length)return det;
    }catch{}
  }
  return null;
}

const TABS=[["home","Khám phá"],["lib","Thư viện"],["search","Tìm kiếm"],["me","Cài đặt"]];

function syncTabPill(k,animateMorph=true){
  const idx=Math.max(0,TABS.findIndex(x=>x[0]===k));
  const pill=$("#tabPill");
  if(pill){
    pill.style.transform=`translate3d(${idx*100}%,0,0)`;
    if(animateMorph){
      tabsEl.classList.remove("morphing");
      void tabsEl.offsetWidth;
      tabsEl.classList.add("morphing");
    }
  }
  [...tabsEl.querySelectorAll("button")].forEach(b=>b.classList.toggle("on",b.dataset.k===k));
}

/* Lướt ngón tay ngang thanh Tab với cảm giác vật lý lỏng */
(()=>{
  let scrubbing=false,startX=0;
  tabsEl.addEventListener("pointerdown",e=>{
    tabsEl.classList.add("touching");
    startX=e.clientX;
    scrubbing=false;
  },{passive:true});

  window.addEventListener("pointermove",e=>{
    if(!tabsEl.classList.contains("touching"))return;
    if(Math.abs(e.clientX-startX)>12)scrubbing=true;
    if(!scrubbing)return;
    tabsEl.classList.add("scrubbing");
    const r=tabsEl.getBoundingClientRect();
    const pillW=(r.width-6)/4;
    const clampedX=Math.max(0,Math.min(r.width-6-pillW,e.clientX-r.left-3-pillW/2));
    tabsEl.style.setProperty("--pill-x",clampedX+"px");
    const hoverIdx=Math.min(3,Math.max(0,Math.floor((e.clientX-r.left)/(r.width/4))));
    [...tabsEl.querySelectorAll("button")].forEach((b,i)=>b.classList.toggle("on",i===hoverIdx));
  },{passive:true});

  const endTouch=e=>{
    if(!tabsEl.classList.contains("touching"))return;
    tabsEl.classList.remove("touching");
    if(scrubbing){
      tabsEl.classList.remove("scrubbing");
      const r=tabsEl.getBoundingClientRect();
      const targetIdx=Math.min(3,Math.max(0,Math.floor((e.clientX-r.left)/(r.width/4))));
      const targetKey=TABS[targetIdx][0];
      go(targetKey);
    }else{
      const b=e.target.closest("button[data-k]");
      if(b)go(b.dataset.k);
    }
    scrubbing=false;
  };
  window.addEventListener("pointerup",endTouch,{passive:true});
  window.addEventListener("pointercancel",()=>{tabsEl.classList.remove("touching","scrubbing");scrubbing=false;syncTabPill(tab,false)},{passive:true});
})();

function go(k){
  const changed=tab!==k;
  tab=k;
  document.body.classList.remove("sheeted","sheet-OpenVisual");
  syncTabPill(k,changed);
  vt(()=>{

    void $("#page").offsetWidth;
    $("#page").style.animation="";
    scrollTo(0,0);
    ({home:pHome,lib:pLib,search:pSearch,me:pMe})[k]();
  });
}

let shT,activeStreamData=null,activeSrvIdx=0,activeEpIdx=0;
const sheetEl=$("#sheet"),sheetPn=$("#sheet .pn"),sheetBd=$("#sheet .bd");

function openSheet(){
  clearTimeout(shT);
  sheetEl.classList.remove("dragging");
  sheetPn.style.transform="";
  sheetBd.style.opacity="";
  sheetEl.classList.add("show");
  document.body.classList.add("sheet-OpenVisual");
  requestAnimationFrame(()=>requestAnimationFrame(()=>sheetEl.classList.add("open")));
  shT=setTimeout(()=>document.body.classList.add("sheeted"),480);
}
function closeSheet(){
  ytStop();
  clearTimeout(shT);
  document.body.classList.remove("sheeted","sheet-OpenVisual");
  sheetEl.classList.remove("open","dragging");
  sheetPn.style.transform="";
  sheetBd.style.opacity="";
  setTimeout(()=>{sheetEl.classList.remove("show");$("#sc").innerHTML=""},450);
}
sheetBd.onclick=closeSheet;

/* Kéo Sheet bám theo ngón tay mượt mà có quán tính lò xo */
(()=>{
  let y0=0,dy=0,dragging=false;
  sheetPn.addEventListener("touchstart",e=>{
    if(sheetPn.scrollTop<=2){
      y0=e.touches[0].clientY;
      dy=0;
      dragging=false;
    }else y0=0;
  },{passive:true});

  sheetPn.addEventListener("touchmove",e=>{
    if(!y0)return;
    const delta=e.touches[0].clientY-y0;
    if(delta>0&&sheetPn.scrollTop<=0){
      if(!dragging){
        dragging=true;
        clearTimeout(shT);
        document.body.classList.remove("sheeted");
        sheetEl.classList.add("dragging");
      }
      dy=Math.pow(delta,0.94);
      const scale=Math.max(0.93,1-dy/3200);
      sheetPn.style.transform=`translate3d(0,${dy}px,0) scale(${scale})`;
      sheetBd.style.opacity=String(Math.max(0,1-dy/400));
    }
  },{passive:true});

  const endSheetDrag=()=>{
    if(!dragging)return;
    dragging=false;
    sheetEl.classList.remove("dragging");
    if(dy>125){
      closeSheet();
    }else{
      sheetPn.style.transform="";
      sheetBd.style.opacity="";
      shT=setTimeout(()=>document.body.classList.add("sheeted"),400);
    }
    y0=0;dy=0;
  };
  sheetPn.addEventListener("touchend",endSheetDrag,{passive:true});
  sheetPn.addEventListener("touchcancel",endSheetDrag,{passive:true});
})();

  try{await V.play()}catch{}
}

async function loadItem(){
  const it=list[idx];if(!it)return;
  $("#pt").textContent=`${it.title}${it.epName?" · Tập "+it.epName:""}`;
  toast("Đang nạp luồng siêu tốc…",4000);
  const pr=store.get("prog",{})[it.identifier];
  const resumeSec=it.resumeTime||((pr&&pr.eIdx===it.eIdx&&pr.sIdx===it.sIdx&&pr.t>10)?pr.t:0);

  if(list[idx+1]?.m3u8)setTimeout(()=>getCleanM3u8BlobUrl(list[idx+1].m3u8),2000);

  if(playerMode==="embed"||(!it.m3u8&&it.embed)){
    startEmbedInPlayer(it);
    save();
    return;
  }

  P.classList.remove("embed-mode");
  EMB.src="about:blank";EMB.style.display="none";
  V.style.display="block";
  $("#modeBtn").textContent="Luồng: M3U8 Sạch QC";

  if(typeof Hls!=="undefined"&&Hls.isSupported()){
    if(hlsInstance)hlsInstance.destroy();
    hlsInstance=new Hls({
      loader:CleanHlsLoader||Hls.DefaultConfig.loader,
      startFragPrefetch:true,
      maxBufferLength:20,
      maxMaxBufferLength:40,
      manifestLoadingTimeOut:8000,
      fragLoadingTimeOut:10000
    });
    hlsInstance.loadSource(it.m3u8);
    hlsInstance.attachMedia(V);
    hlsInstance.on(Hls.Events.MANIFEST_PARSED,()=>{
      if(resumeSec>10){V.currentTime=resumeSec;toast("Tiếp tục từ "+fmt(resumeSec))}
      else toast("Đang phát Tập "+it.epName+" (Đã lọc QC)");
      V.play().catch(()=>{});
    });
    hlsInstance.on(Hls.Events.ERROR,(_,data)=>{
      if(data.fatal){
        if(data.type===Hls.ErrorTypes.MEDIA_ERROR){
          hlsInstance.recoverMediaError();
        }else if(V.canPlayType("application/vnd.apple.mpegurl")){
          hlsInstance.destroy();hlsInstance=null;
          startNativeVideoM3u8(it,resumeSec);
        }else if(it.embed){
          startEmbedInPlayer(it);
        }else{
          toast("Luồng phim hiện tại bị lỗi, hãy đổi Server khác.");
        }
      }
    });
  }else if(V.canPlayType("application/vnd.apple.mpegurl")){
    await startNativeVideoM3u8(it,resumeSec);
  }else if(it.embed){
    startEmbedInPlayer(it);
  }
  wake();
}

function save(){
  const it=list[idx];if(!it)return;
  const p=store.get("prog",{});
  p[it.identifier]={
    t:playerMode==="m3u8"?V.currentTime:(it.resumeTime||15),
    d:playerMode==="m3u8"?(V.duration||0):0,
    title:it.title,
    epName:it.epName,
    img:it.img,
    providerId:it.providerId,
    slug:it.slug,
    sIdx:it.sIdx,
    eIdx:it.eIdx,
    u:Date.now()
  };
  store.set("prog",p);
}
function closePlayer(){
  save();
  clearTimeout(idle);
  if(hlsInstance){hlsInstance.destroy();hlsInstance=null}
  V.pause();V.removeAttribute("src");V.load();
  EMB.src="about:blank";EMB.style.display="none";
  P.style.transform="";P.style.borderRadius="";
  P.classList.remove("show","idle","embed-mode","dragging");
  if(document.fullscreenElement||document.webkitFullscreenElement){
    (document.exitFullscreen||document.webkitExitFullscreen)?.call(document);
  }
  if(!document.body.classList.contains("sheeted")&&(tab=="home"||tab=="lib"))go(tab);
}
function wake(){
  P.classList.remove("idle");
  clearTimeout(idle);
  if(!V.paused&&playerMode==="m3u8")idle=setTimeout(()=>P.classList.add("idle"),3500);
}
const setIcon=()=>$("#ppi").innerHTML=V.paused?'<path d="M8 5v14l11-7z"/>':'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
V.onplay=V.onpause=()=>{setIcon();wake();save()};
V.ontimeupdate=()=>{if(V.duration){$("#sk").value=V.currentTime/V.duration*1000;$("#tc").textContent=fmt(V.currentTime);$("#td").textContent=fmt(V.duration)}if(Date.now()-saveT>3000){saveT=Date.now();save()}};
V.onended=()=>{if(cfg.autonext&&idx<list.length-1){toast("Tự chuyển sang: Tập "+list[idx+1].epName,3000);setTimeout(()=>{idx++;loadItem()},1500)}else P.classList.remove("idle")};
$("#sk").oninput=e=>{if(V.duration)V.currentTime=e.target.value/1000*V.duration;wake()};
$("#pp").onclick=e=>{e.stopPropagation();V.paused?V.play():V.pause()};
$("#bk10").onclick=e=>{e.stopPropagation();V.currentTime-=10;wake()};
$("#fw10").onclick=e=>{e.stopPropagation();V.currentTime+=10;wake()};
$("#pc").onclick=e=>{e.stopPropagation();closePlayer()};
$("#pn").onclick=e=>{e.stopPropagation();if(idx<list.length-1){save();idx++;loadItem()}else toast("Đã là tập cuối")};
const SP=[1,1.25,1.5,2,.75];
$("#spd").onclick=e=>{e.stopPropagation();const n=SP[(SP.indexOf(V.playbackRate)+1)%SP.length];V.playbackRate=n;$("#spd").textContent=n+"×";wake()};
$("#modeBtn").onclick=e=>{
  e.stopPropagation();
  const it=list[idx];if(!it)return;
  if(playerMode==="m3u8"){if(it.embed||it.m3u8)startEmbedInPlayer(it)}
  else if(it.m3u8){playerMode="m3u8";loadItem()}
};
$("#an").onclick=e=>{e.stopPropagation();cfg.autonext=!cfg.autonext;saveCfg();$("#an").textContent="Tự chuyển: "+(cfg.autonext?"Bật":"Tắt");wake()};
$("#an").textContent="Tự chuyển: "+(cfg.autonext?"Bật":"Tắt");
$("#fs").onclick=e=>{
  e.stopPropagation();
  if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
  else if(playerMode==="m3u8"&&V.webkitEnterFullscreen)V.webkitEnterFullscreen();
  else if(P.requestFullscreen)P.requestFullscreen().catch(()=>V.webkitEnterFullscreen?.());
  else if(P.webkitRequestFullscreen)P.webkitRequestFullscreen();
};
V.addEventListener("dblclick",()=>$("#fs").click());

/* Kéo vuốt màn hình player xuống để thu nhỏ/đóng mượt mà */
(()=>{
  let py0=0,pdy=0,pDragging=false;
  P.addEventListener("touchstart",e=>{
    if(P.classList.contains("idle"))wake();
    if(!document.fullscreenElement&&e.touches[0].clientY<130){
      py0=e.touches[0].clientY;
      pdy=0;
      pDragging=false;
    }else py0=0;
  },{passive:true});

  P.addEventListener("touchmove",e=>{
    if(!py0)return;
    const delta=e.touches[0].clientY-py0;
    if(delta>10){
      pDragging=true;
      P.classList.add("dragging");
      pdy=Math.pow(delta,0.92);
      const sc=Math.max(0.82,1-pdy/1500);
      P.style.transform=`translate3d(0,${pdy}px,0) scale(${sc})`;
      P.style.borderRadius=Math.min(40,pdy/3.5)+"px";
    }
  },{passive:true});

  const endPlayerDrag=()=>{
    if(!pDragging)return;
    pDragging=false;
    P.classList.remove("dragging");
    if(pdy>115){
      closePlayer();
    }else{
      P.style.transform="";
      P.style.borderRadius="";
    }
    py0=0;pdy=0;
  };
  P.addEventListener("touchend",endPlayerDrag,{passive:true});
  P.addEventListener("touchcancel",endPlayerDrag,{passive:true});
})();

P.addEventListener("pointerdown",e=>{
  if(e.target===V||e.target===$("#ctl")||e.target===P){
    P.classList.contains("idle")?wake():(V.paused?wake():P.classList.add("idle"));
  }else wake();
});
document.addEventListener("keydown",e=>{if(!P.classList.contains("show"))return;if(e.key==" "){e.preventDefault();$("#pp").click()}if(e.key=="ArrowRight")V.currentTime+=10;if(e.key=="ArrowLeft")V.currentTime-=10;if(e.key=="f")$("#fs").click();if(e.key=="Escape"&&!document.fullscreenElement)closePlayer()});
addEventListener("pagehide",save);

go("home");
</script>
