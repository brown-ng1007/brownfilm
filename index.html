<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CineGlass</title>
<meta name="theme-color" content="#faf7fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CineGlass">
<link rel="preconnect" href="https://phimapi.com" crossorigin>
<link rel="preconnect" href="https://phim.nguonc.com" crossorigin>
<link rel="dns-prefetch" href="https://phimimg.com">
<link rel="dns-prefetch" href="https://image.tmdb.org">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<style>
:root{
  --bg:#faf7fa;
  --bg-mesh:radial-gradient(at 10% 6%,rgba(250,45,72,.10),transparent 50%),radial-gradient(at 90% 20%,rgba(255,122,89,.08),transparent 45%),radial-gradient(at 50% 92%,rgba(175,82,222,.08),transparent 55%);
  --card:rgba(255,255,255,.76);
  --text:#1c1c1e;--sub:#726e77;
  --glass-rgb:255,255,255;
  --pill-rgb:120,120,128;--pill-a:.18;
  --rim-hi:rgba(255,255,255,.95);--rim-lo:rgba(255,255,255,.45);
  --glass-shadow:0 10px 34px rgba(30,20,40,.16),0 1px 3px rgba(30,20,40,.10);
  --accent:#fa2d48;
  --accent-grad:linear-gradient(135deg,#ff375f 0%,#fa2d48 55%,#ff5e3a 100%);
  --line:rgba(250,45,72,.08);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --spring:cubic-bezier(.2,1.25,.35,1);
  --g:.35; /* 0 = siêu trong, 1 = mờ đục */
}
:root[data-theme=dark]{
  --bg:#0f0d13;
  --bg-mesh:radial-gradient(at 12% 8%,rgba(250,45,72,.16),transparent 52%),radial-gradient(at 88% 25%,rgba(191,90,242,.11),transparent 48%),radial-gradient(at 50% 90%,rgba(255,100,130,.09),transparent 58%);
  --card:rgba(32,28,40,.76);
  --text:#f5f5f7;--sub:#a19ca8;
  --glass-rgb:44,38,56;
  --pill-rgb:255,255,255;--pill-a:.16;
  --rim-hi:rgba(255,255,255,.55);--rim-lo:rgba(255,255,255,.22);
  --glass-shadow:0 12px 36px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4);
  --accent:#ff375f;--line:rgba(255,255,255,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
html,body{margin:0;background-color:var(--bg);background-image:var(--bg-mesh);background-attachment:fixed;color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overflow-x:hidden}
body.lock{overflow:hidden}
#page{padding:calc(var(--sat) + 12px) 0 calc(var(--sab) + 110px);min-height:100vh;min-height:100dvh}
h1{font-size:34px;margin:8px 20px 14px;font-weight:800;background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;width:fit-content}
.scroller{display:flex;gap:13px;overflow-x:auto;padding:8px 20px 16px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.card{flex:0 0 128px;text-align:left}
.card .p{display:block;width:128px;aspect-ratio:2/3;border-radius:18px;object-fit:cover;background:var(--card);border:.5px solid var(--line)}
.card b{margin-top:8px;font-size:13px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px;padding:8px 20px}
.grid .card{flex:none}.grid .card .p{width:100%}
.search{margin:0 20px 8px;display:flex;gap:8px;align-items:center;border-radius:16px;padding:11px 14px;background:var(--card);border:.5px solid var(--line)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font-size:17px}
.list{margin:0 20px 16px;border-radius:24px;background:var(--card);border:.5px solid var(--line);overflow:hidden}
.list>div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:.5px solid var(--line)}
.list>div:last-child{border-bottom:0}
.list input[type=range]{flex:1;accent-color:var(--accent)}
.seg{display:flex;gap:4px;padding:3px;border-radius:12px;background:rgba(120,120,128,.16)}
.seg button{padding:6px 12px;border-radius:9px;font-size:13px;font-weight:600}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.note{color:var(--sub);font-size:13px;margin:0 28px 14px}
.btn{background:var(--accent-grad);color:#fff;border-radius:16px;padding:12px 18px;font-weight:700;display:inline-flex;gap:8px;align-items:center}
.empty{color:var(--sub);text-align:center;padding:30px}
.sp{display:flex;justify-content:center;padding:40px}
.sp i{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ===== Liquid Glass dock (Apple Music style) ===== */
.dock{position:fixed;left:16px;right:16px;bottom:max(8px,calc(var(--sab) - 6px));z-index:30;display:flex;gap:10px;align-items:center}
.glass{
  position:relative;
  background:rgba(var(--glass-rgb),calc(var(--g) * .7));
  -webkit-backdrop-filter:blur(calc(2px + var(--g) * 30px)) saturate(190%) brightness(calc(1.02 + var(--g) * .03));
  backdrop-filter:blur(calc(2px + var(--g) * 30px)) saturate(190%) brightness(calc(1.02 + var(--g) * .03));
  box-shadow:var(--glass-shadow),inset 0 1.5px 1px var(--rim-hi),inset 0 -1px 1px var(--rim-lo),inset 0 0 14px rgba(255,255,255,.08);
}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(145deg,var(--rim-hi),transparent 32%,transparent 66%,var(--rim-lo));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.tabs{flex:1;display:flex;height:62px;padding:4px;border-radius:31px;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .45s var(--spring)}
.tabs.press{transform:scale(1.025)}
#tabPill{position:absolute;top:4px;bottom:4px;left:0;border-radius:27px;pointer-events:none;
  background:linear-gradient(180deg,rgba(var(--pill-rgb),calc(var(--pill-a) + .06)),rgba(var(--pill-rgb),var(--pill-a)));
  box-shadow:inset 0 1px 1px var(--rim-hi),inset 0 -1px 1px var(--rim-lo),0 2px 8px rgba(0,0,0,.08);
  transform:translate3d(var(--px,0px),0,0) scale(var(--ps,1));
  transition:transform .5s var(--spring),opacity .25s,background .25s,box-shadow .25s}
#tabPill.press{--ps:1.1;background:linear-gradient(180deg,rgba(var(--glass-rgb),.55),rgba(var(--pill-rgb),.14));
  box-shadow:inset 0 1.5px 1.5px var(--rim-hi),inset 0 -1px 1px var(--rim-lo),0 8px 22px rgba(0,0,0,.2)}
#tabPill.off{opacity:0;--ps:.8}
.tabs button.t{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;letter-spacing:.1px;color:var(--text);transition:color .25s}
.tabs button.t svg,.sbtn svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .4s var(--spring)}
.tabs button.t.on{color:var(--accent)}
.tabs button.t.on svg{fill:currentColor;fill-opacity:.9}
.tabs button.t.hov{color:var(--accent)}
.sbtn{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--text);transition:transform .45s var(--spring),color .25s}
.sbtn:active{transform:scale(1.12)}
.sbtn.on{color:var(--accent)}
.sbtn.on svg{stroke-width:2.4}

/* ===== Sheet ===== */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.show{display:block}
#sheet .bd{position:absolute;inset:0;background:rgba(15,10,20,.44);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;transition:opacity .3s}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;top:calc(var(--sat) + 18px);background:var(--bg);border-radius:32px 32px 0 0;overflow-y:auto;padding-bottom:50px;transform:translateY(100%);transition:transform .45s var(--spring)}
#sheet.open .bd{opacity:1}#sheet.open .pn{transform:none}
.grab{position:sticky;top:0;z-index:3;height:22px;display:flex;justify-content:center;align-items:center}
.grab::before{content:"";width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.7);box-shadow:0 0 4px rgba(0,0,0,.3)}
.bk{aspect-ratio:16/10;margin-top:-22px;background:var(--card)}.bk img{width:100%;height:100%;object-fit:cover}
.dt{padding:0 20px;margin-top:-34px;position:relative;z-index:1}.dt h3{font-size:28px;margin:0 0 6px}
.dt p{color:var(--sub)}

/* ===== Player ===== */
#player{position:fixed;inset:0;z-index:80;background:#000;display:none;color:#fff}
#player.show{display:block}
#player video{width:100%;height:100%;object-fit:contain}
.ctl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(var(--sat) + 20px) 20px calc(var(--sab) + 20px);background:linear-gradient(rgba(0,0,0,.6),transparent 30%,transparent 70%,rgba(0,0,0,.8));z-index:10;transition:opacity .3s}
.ctl.hide{opacity:0;pointer-events:none}
.top{display:flex;align-items:center;gap:12px}.top b{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2)}
.bot{display:flex;gap:12px;align-items:center}
.bot input{flex:1;accent-color:#fff}
.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);padding:10px 16px;border-radius:20px;background:rgba(0,0,0,.8);opacity:0;transition:.3s;z-index:20;font-size:14px;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="page"></div>
<div class="dock">
  <nav class="tabs glass" id="tabs" aria-label="Điều hướng"><i id="tabPill"></i></nav>
  <button class="sbtn glass" id="sBtn" aria-label="Tìm kiếm"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></button>
</div>
<div id="sheet"><div class="bd"></div><div class="pn"><div class="grab"></div><div id="sc"></div></div></div>
<div id="player">
  <video id="v" playsinline webkit-playsinline preload="auto"></video>
  <div class="ctl" id="ctl">
    <div class="top"><button class="rb" id="pc" aria-label="Đóng">✕</button><b id="pt"></b></div>
    <div class="bot"><button class="btn" id="pp">Tạm dừng</button><input type="range" id="seek" min="0" max="1000" value="0"><button class="btn" id="fs">Toàn màn hình</button></div>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let cfg=Object.assign({theme:"auto",tmdb:"3309069624518eb702e51e01c9ad58f8",glass:0.35},store.get("cfg",{}));
cfg.glass=Math.min(1,Math.max(0,Number(cfg.glass)||0));
const root=document.documentElement,mq=matchMedia("(prefers-color-scheme:dark)");
function applyCfg(){
  root.style.setProperty("--g",cfg.glass);
  const dark=cfg.theme==="dark"||(cfg.theme==="auto"&&mq.matches);
  root.dataset.theme=dark?"dark":"light";
  $('meta[name=theme-color]').content=dark?"#0f0d13":"#faf7fa";
}
const saveCfg=()=>{store.set("cfg",cfg);applyCfg()};
mq.addEventListener?.("change",applyCfg);applyCfg();

/* ===== Tabs ===== */
const ICONS={
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>',
  lib:'<rect x="4" y="9" width="16" height="11" rx="2.5"/><path d="M7 5.5h10M9.5 2.5h5"/>',
  me:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/>'
};
const TABS=[["home","Khám phá"],["lib","Thư viện"],["me","Cài đặt"]];
const tabsEl=$("#tabs"),pill=$("#tabPill"),sBtn=$("#sBtn");
tabsEl.insertAdjacentHTML("beforeend",TABS.map(([k,l])=>`<button class="t" data-k="${k}"><svg viewBox="0 0 24 24">${ICONS[k]}</svg>${l}</button>`).join(""));
const tbs=[...tabsEl.querySelectorAll("button.t")];
let tab="home",navId=0;

function placePill(i,x){
  const b=tbs[i];if(!b)return;
  pill.style.width=b.offsetWidth+"px";
  pill.style.setProperty("--px",(x??b.offsetLeft)+"px");
}
function go(k){
  tab=k;const id=++navId;
  const i=TABS.findIndex(t=>t[0]===k);
  tbs.forEach((b,n)=>{b.classList.toggle("on",n===i);b.classList.remove("hov")});
  sBtn.classList.toggle("on",k==="search");
  pill.classList.toggle("off",i<0);
  if(i>=0)placePill(i);
  window.scrollTo(0,0);
  ({home:pHome,lib:pLib,search:pSearch,me:pMe})[k](id);
}
sBtn.onclick=()=>go("search");

/* Kéo ngón tay trên thanh tab: viên kính phồng lên và trượt theo như Apple Music */
let drag=null;
const idxAt=x=>{let best=0,d=1e9;tbs.forEach((b,n)=>{const c=b.offsetLeft+b.offsetWidth/2,dd=Math.abs(c-x);if(dd<d){d=dd;best=n}});return best};
tabsEl.addEventListener("pointerdown",e=>{
  const r=tabsEl.getBoundingClientRect();
  drag={r,idx:idxAt(e.clientX-r.left)};
  tabsEl.setPointerCapture(e.pointerId);
  pill.classList.remove("off");pill.classList.add("press");tabsEl.classList.add("press");
  moveDrag(e);
});
function moveDrag(e){
  const x=e.clientX-drag.r.left,w=tbs[0].offsetWidth;
  const px=Math.min(tbs[tbs.length-1].offsetLeft,Math.max(tbs[0].offsetLeft,x-w/2));
  drag.idx=idxAt(x);pill.style.width=tbs[drag.idx].offsetWidth+"px";pill.style.setProperty("--px",px+"px");
  tbs.forEach((b,n)=>b.classList.toggle("hov",n===drag.idx));
}
tabsEl.addEventListener("pointermove",e=>{if(drag)moveDrag(e)});
function endDrag(commit){
  if(!drag)return;const i=drag.idx;drag=null;
  pill.classList.remove("press");tabsEl.classList.remove("press");
  commit?go(TABS[i][0]):go(tab);
}
tabsEl.addEventListener("pointerup",()=>endDrag(true));
tabsEl.addEventListener("pointercancel",()=>endDrag(false));
tabsEl.addEventListener("click",e=>{if(e.detail===0){const b=e.target.closest("button.t");if(b)go(b.dataset.k)}}); // bàn phím
addEventListener("resize",()=>{const i=TABS.findIndex(t=>t[0]===tab);if(i>=0)placePill(i)});

/* ===== Data ===== */
async function tmdb(path,q=""){
  const r=await fetch(`https://api.themoviedb.org/3${path}?api_key=${cfg.tmdb}&language=vi-VN${q}`);
  if(!r.ok)throw new Error(r.status);
  return r.json();
}
const poster=m=>m.poster_path?`<img class="p" loading="lazy" alt="" src="https://image.tmdb.org/t/p/w342${m.poster_path}">`:`<div class="p"></div>`;
const cardHtml=m=>`<button class="card" data-t="${m.media_type==="tv"?"tv":"movie"}" data-id="${m.id}">${poster(m)}<b>${esc(m.title||m.name)}</b></button>`;
$("#page").addEventListener("click",e=>{const c=e.target.closest(".card[data-id]");if(c)openItem(c.dataset.t,c.dataset.id)});
const fail=()=>`<div class="empty">Không tải được dữ liệu. Kiểm tra mạng rồi thử lại.</div>`;

async function pHome(id){
  $("#page").innerHTML=`<h1>Khám phá</h1><div id="rows"><div class="sp"><i></i></div></div>`;
  try{
    const d=await tmdb("/trending/all/week");
    if(id!==navId)return;
    $("#rows").innerHTML=`<div class="scroller">${(d.results||[]).filter(m=>m.media_type!=="person").map(cardHtml).join("")}</div>`;
  }catch{if(id===navId)$("#rows").innerHTML=fail()}
}

async function openItem(type,id){
  $("#sc").innerHTML=`<div class="sp"><i></i></div>`;openSheet();
  try{
    const m=await tmdb(`/${type}/${id}`),t=m.title||m.name;
    $("#sc").innerHTML=`<div class="bk">${m.backdrop_path?`<img alt="" src="https://image.tmdb.org/t/p/w780${m.backdrop_path}">`:""}</div><div class="dt"><h3>${esc(t)}</h3><p>${esc(m.overview||"Chưa có mô tả.")}</p><button class="btn" id="demo">Phát thử</button></div>`;
    $("#demo").onclick=()=>playDemo(t);
  }catch{$("#sc").innerHTML=fail()}
}
function openSheet(){
  const s=$("#sheet");s.classList.add("show");document.body.classList.add("lock");
  $("#sheet .pn").scrollTop=0;requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add("open")));
}
function closeSheet(){
  const s=$("#sheet");s.classList.remove("open");document.body.classList.remove("lock");
  setTimeout(()=>{if(!s.classList.contains("open"))s.classList.remove("show")},400);
}
$("#sheet .bd").onclick=closeSheet;$(".grab").onclick=closeSheet;

/* ===== Player ===== */
const v=$("#v"),toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2200)};
function playDemo(t){
  $("#pt").textContent=t||"";$("#player").classList.add("show");
  v.src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4";
  v.play().catch(()=>toast("Không phát được video"));
}
$("#pc").onclick=()=>{$("#player").classList.remove("show");v.pause();v.removeAttribute("src");v.load()};
$("#pp").onclick=()=>{v.paused?v.play():v.pause()};
v.onplay=()=>$("#pp").textContent="Tạm dừng";v.onpause=()=>$("#pp").textContent="Phát";
v.ontimeupdate=()=>{if(v.duration)$("#seek").value=v.currentTime/v.duration*1000};
$("#seek").oninput=e=>{if(v.duration)v.currentTime=e.target.value/1000*v.duration};
v.onerror=()=>toast("Lỗi tải video");
$("#fs").onclick=()=>{
  const p=$("#player");
  if(v.webkitEnterFullscreen&&!p.requestFullscreen)v.webkitEnterFullscreen();
  else if(document.fullscreenElement)document.exitFullscreen();
  else(p.requestFullscreen||p.webkitRequestFullscreen).call(p);
};
v.onclick=()=>$("#ctl").classList.toggle("hide");

/* ===== Pages ===== */
function pLib(){$("#page").innerHTML=`<h1>Thư viện</h1><div class="empty">Đang cập nhật thư viện...</div>`}
let st;
function pSearch(id){
  $("#page").innerHTML=`<h1>Tìm kiếm</h1><label class="search"><input id="q" type="search" placeholder="Phim, chương trình TV" autocomplete="off"></label><div id="res"><div class="empty">Nhập từ khóa tìm kiếm...</div></div>`;
  $("#q").oninput=e=>{
    clearTimeout(st);const q=e.target.value.trim();
    if(!q){$("#res").innerHTML=`<div class="empty">Nhập từ khóa tìm kiếm...</div>`;return}
    st=setTimeout(async()=>{
      try{
        const d=await tmdb("/search/multi",`&query=${encodeURIComponent(q)}`);
        if(id!==navId)return;
        const r=(d.results||[]).filter(m=>m.media_type!=="person");
        $("#res").innerHTML=r.length?`<div class="grid">${r.map(cardHtml).join("")}</div>`:`<div class="empty">Không có kết quả cho "${esc(q)}".</div>`;
      }catch{if(id===navId)$("#res").innerHTML=fail()}
    },350);
  };
}
function pMe(){
  const label=()=>cfg.glass===0?"Siêu trong":Math.round(cfg.glass*100)+"%";
  $("#page").innerHTML=`<h1>Cài đặt</h1>
  <div class="list">
    <div><span>Giao diện</span><div class="seg" id="seg">${[["auto","Tự động"],["light","Sáng"],["dark","Tối"]].map(([k,l])=>`<button data-k="${k}" class="${cfg.theme===k?"on":""}">${l}</button>`).join("")}</div></div>
    <div><span>Độ trong của kính</span><b id="gl" style="color:var(--sub);font-weight:600;font-size:14px">${label()}</b></div>
    <div><input type="range" id="glRng" min="0" max="1" step="0.01" value="${cfg.glass}" aria-label="Độ trong của kính"></div>
  </div>
  <p class="note">Kéo về bên trái để kính trong hơn. Ở mức thấp nhất, thanh điều hướng gần như trong suốt hoàn toàn.</p>`;
  $("#glRng").oninput=e=>{cfg.glass=Number(e.target.value);$("#gl").textContent=label();saveCfg()};
  $("#seg").onclick=e=>{const b=e.target.closest("button");if(!b)return;cfg.theme=b.dataset.k;saveCfg();[...$("#seg").children].forEach(x=>x.classList.toggle("on",x===b))};
}

go("home");
</script>
</body>
</html>
