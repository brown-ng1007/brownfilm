/* ---------- BỘ LỌC CẮT QUẢNG CÁO M3U8 ---------- */
function stripAdsFromM3u8(text,baseUrl=""){
  if(!text)return text;
  const resolveUrl=u=>{if(!baseUrl||/^https?:\/\//i.test(u))return u;try{return new URL(u,baseUrl).href}catch{return u}};
  if(!text.includes("#EXT-X-DISCONTINUITY")){
    if(!baseUrl)return text;
    return text.split(/\r?\n/).map(l=>{const t=l.trim();return(!t||t.startsWith("#"))?l:resolveUrl(t)}).join("\n");
  }
  const lines=text.split(/\r?\n/),headerLines=[],blocks=[];
  let cur=[],inBody=false;
  for(const raw of lines){
    const l=raw.trim();if(!l||l==="#EXT-X-ENDLIST")continue;
    if(!inBody&&!l.startsWith("#EXTINF:")&&l!=="#EXT-X-DISCONTINUITY"){headerLines.push(l)}
    else{
      inBody=true;
      if(l==="#EXT-X-DISCONTINUITY"){if(cur.length)blocks.push(cur);cur=[]}
      else cur.push(l.startsWith("#")?l:resolveUrl(l));
    }
  }
  if(cur.length)blocks.push(cur);
  if(blocks.length<=1)return[...headerLines,...(blocks[0]||[]),"#EXT-X-ENDLIST"].join("\n");

  const stats=blocks.map(b=>{
    const urls=b.filter(x=>!x.startsWith("#"));
    const dur=b.filter(x=>x.startsWith("#EXTINF:")).reduce((s,x)=>s+(parseFloat(x.slice(8))||0),0);
    const sample=urls[0]||"";
    const prefix=sample.slice(0,Math.max(0,sample.lastIndexOf("/")));
    return{lines:b,count:urls.length,dur,prefix,sample};
  });
  const pCounts={};stats.forEach(s=>{pCounts[s.prefix]=(pCounts[s.prefix]||0)+s.count});
  let mainPrefix="",maxC=-1;
  for(const p in pCounts){if(pCounts[p]>maxC){maxC=pCounts[p];mainPrefix=p}}

  const cleanBlocks=stats.filter(s=>{
    if(/quangcao|adjump|ads|bet|casino|宣传/i.test(s.sample))return false;
    if(s.prefix!==mainPrefix&&maxC>15)return false;
    if(s.count<=12&&s.dur<45&&maxC>25)return false;
    return true;
  });
  const finalBlocks=cleanBlocks.length?cleanBlocks:stats;
  return[...headerLines,...finalBlocks.flatMap((s,i)=>i===0?s.lines:["#EXT-X-DISCONTINUITY",...s.lines]),"#EXT-X-ENDLIST"].join("\n");
}

let CleanHlsLoader=null;
try{
  if(typeof Hls!=="undefined"&&Hls.DefaultConfig?.loader){
    CleanHlsLoader=class extends Hls.DefaultConfig.loader{
      constructor(config){
        super(config);
        const origLoad=this.load.bind(this);
        this.load=function(context,config,callbacks){
          const origSuccess=callbacks.onSuccess;
          callbacks.onSuccess=function(response,stats,ctx,net){
            if(typeof response.data==="string"&&response.data.includes("#EXT-X-DISCONTINUITY")){
              response.data=stripAdsFromM3u8(response.data);
            }
            origSuccess(response,stats,ctx,net);
          };
          origLoad(context,config,callbacks);
        };
      }
    };
  }
}catch{}

const m3u8BlobCache=new Map();
async function getCleanM3u8BlobUrl(m3u8Url){
  if(!m3u8Url)return"";
  if(m3u8BlobCache.has(m3u8Url))return m3u8BlobCache.get(m3u8Url);
  try{
    const ctrl=new AbortController(),tid=setTimeout(()=>ctrl.abort(),2200);
    const masterTxt=await fetch(m3u8Url,{signal:ctrl.signal}).then(r=>r.text());
    clearTimeout(tid);
    if(!masterTxt.includes("#EXTM3U"))return m3u8Url;
    if(masterTxt.includes("#EXT-X-STREAM-INF")){
      const lines=masterTxt.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
      let subRel="";
      for(let i=0;i<lines.length;i++){
        if(lines[i].startsWith("#EXT-X-STREAM-INF")&&lines[i+1]&&!lines[i+1].startsWith("#")){subRel=lines[i+1];break}
      }
      if(subRel){
        const subUrl=new URL(subRel,m3u8Url).href;
        const ctrl2=new AbortController(),tid2=setTimeout(()=>ctrl2.abort(),2200);
        const subTxt=await fetch(subUrl,{signal:ctrl2.signal}).then(r=>r.text());
        clearTimeout(tid2);
        const cleaned=stripAdsFromM3u8(subTxt,subUrl);
        const blobUrl=URL.createObjectURL(new Blob([cleaned],{type:"application/vnd.apple.mpegurl"}));
        m3u8BlobCache.set(m3u8Url,blobUrl);
        return blobUrl;
      }
    }
    const cleaned=stripAdsFromM3u8(masterTxt,m3u8Url);
    const blobUrl=URL.createObjectURL(new Blob([cleaned],{type:"application/vnd.apple.mpegurl"}));
    m3u8BlobCache.set(m3u8Url,blobUrl);
    return blobUrl;
  }catch{return m3u8Url}
}

const searchCache=new Map(),detailCache=new Map();
async function fetchWithTimeout(url,ms=3200){
  const ctrl=new AbortController(),id=setTimeout(()=>ctrl.abort(),ms);
  try{const res=await fetch(url,{signal:ctrl.signal});clearTimeout(id);if(!res.ok) throw new Error(`HTTP ${res.status}`);return await res.json()}catch(e){clearTimeout(id);throw e}
}
async function fetchFromProvider(provider,keyword=""){
  const ck=`${provider.id}:${keyword||"latest"}`;
  if(searchCache.has(ck))return searchCache.get(ck);
  try{
    const url=keyword?provider.searchUrl(keyword):provider.latestUrl();
    const json=await fetchWithTimeout(url,3200);
    const rawItems=json?.data?.items||json?.items||[];
    const imgDomain=json?.data?.APP_DOMAIN_CDN_IMAGE?(json.data.APP_DOMAIN_CDN_IMAGE.endsWith("/")?json.data.APP_DOMAIN_CDN_IMAGE:json.data.APP_DOMAIN_CDN_IMAGE+"/"):provider.imgPrefix;
    const items=rawItems.map(it=>{
      let thumb=it.poster_url||it.thumb_url||"";
      if(thumb&&!thumb.startsWith("http"))thumb=imgDomain+thumb;
      return{title:it.name,originTitle:it.origin_name||it.original_name||"",slug:it.slug,year:it.year||"",thumb,providerId:provider.id,providerName:provider.name};
    });
    const resObj={provider,items};searchCache.set(ck,resObj);return resObj;
  }catch{return{provider,items:[],error:true}}
}
async function rescueKkphimM3u8(slug,title,originTitle=""){
  try{
    const d=await fetchWithTimeout(`https://phimapi.com/phim/${slug}`,2500);
    if(d?.episodes?.length&&d.episodes[0]?.server_data?.length)return d.episodes.map(s=>({server_name:`⚡ KKPhim (${s.server_name})`,server_data:s.server_data}));
  }catch{}
  const queries=[title,originTitle].filter(Boolean);
  for(const q of queries){
    try{
      const s=await fetchWithTimeout(`https://phimapi.com/v1/api/tim-kiem?keyword=${encodeURIComponent(q)}&limit=2`,2500);
      const first=s?.data?.items?.[0];
      if(first?.slug){
        const d2=await fetchWithTimeout(`https://phimapi.com/phim/${first.slug}`,2500);
        if(d2?.episodes?.length)return d2.episodes.map(srv=>({server_name:`⚡ KKPhim (${srv.server_name})`,server_data:srv.server_data}));
      }
    }catch{}
  }
  return[];
}
async function fetchProviderMovieDetail(providerId,slug,fallbackTitle=""){
  const ck=`${providerId}:${slug}`;
  if(detailCache.has(ck))return detailCache.get(ck);
  const provider=PROVIDERS.find(p=>p.id===providerId)||PROVIDERS[0];
  const data=await fetchWithTimeout(provider.detailUrl(slug),3500);
  const movie=data.movie||data?.data?.item||{};
  const title=movie.name||fallbackTitle||"Phim";
  const originTitle=movie.origin_name||movie.original_name||"";
  let servers=[];
  if(provider.type==="nguonc"){
    const rescued=await rescueKkphimM3u8(slug,title,originTitle);
    const nguoncSrv=(movie.episodes||[]).map(s=>({
      server_name:`🔗 NguonC (${s.server_name})`,
      server_data:(s.items||[]).map(ep=>({name:ep.name,link_m3u8:ep.m3u8||"",link_embed:ep.embed||""}))
    }));
    servers=[...rescued,...nguoncSrv];
  }else{
    const rawEps=data.episodes||data?.data?.item?.episodes||[];
    servers=rawEps.map(s=>({server_name:`⚡ ${s.server_name}`,server_data:s.server_data||[]}));
  }
  let thumb=movie.poster_url||movie.thumb_url||"";
  if(thumb&&!thumb.startsWith("http"))thumb=provider.imgPrefix+thumb;
  let backdrop=movie.thumb_url||movie.poster_url||thumb;
  if(backdrop&&!backdrop.startsWith("http"))backdrop=provider.imgPrefix+backdrop;
  const res={movie,title,originTitle,overview:movie.content||movie.description||"",year:movie.year||"",thumb,backdrop,servers,providerId,slug};
  detailCache.set(ck,res);
  const firstM3u8=servers[0]?.server_data?.[0]?.link_m3u8;
  if(firstM3u8)getCleanM3u8BlobUrl(firstM3u8);
  return res;
}

async function findStreamForTmdb(viTitle,origTitle){
  const queries=[...new Set([viTitle,origTitle].filter(Boolean))];
  const kkSearches=await Promise.all(queries.map(q=>fetchFromProvider(PROVIDERS[0],q)));
  const kkItems=kkSearches.flatMap(r=>r.items);
  if(kkItems.length){
    const nVi=norm(viTitle),nOr=norm(origTitle);
    const best=kkItems.find(x=>
      (nVi&&(norm(x.title).includes(nVi)||nVi.includes(norm(x.title))))||
      (nOr&&(norm(x.originTitle).includes(nOr)||nOr.includes(norm(x.originTitle))))
    )||kkItems[0];
    try{
      const det=await fetchProviderMovieDetail(best.providerId,best.slug,best.title);
      if(det.servers.length&&det.servers[0].server_data?.length)return det;
    }catch{}
  }
  const ngSearches=await Promise.all(queries.map(q=>fetchFromProvider(PROVIDERS[4],q)));
  const ngItems=ngSearches.flatMap(r=>r.items);
  if(ngItems.length){
    try{
      const det=await fetchProviderMovieDetail(ngItems[0].providerId,ngItems[0].slug,ngItems[0].title);
      if(det.servers.length&&det.servers[0].server_data?.length)return det;
    }catch{}
  }
  return null;
}

  tbs.forEach((b,n)=>b.classList.toggle("hov",n===drag.idx));

  if(!drag)return;const i=drag.idx;drag=null;
  pill.classList.remove("press");tabsEl.classList.remove("press");

}

(()=>{
  let y0=0,dy=0,dragging=false;
  sheetPn.addEventListener("touchstart",e=>{
    if(sheetPn.scrollTop<=2){
      y0=e.touches[0].clientY;
      dy=0;
      dragging=false;
    }else y0=0;
  },{passive:true});

  sheetPn.addEventListener("touchmove",e=>{
    if(!y0)return;
    const delta=e.touches[0].clientY-y0;
    if(delta>0&&sheetPn.scrollTop<=0){
      if(!dragging){
        dragging=true;
        clearTimeout(shT);
        document.body.classList.remove("sheeted");
        sheetEl.classList.add("dragging");
      }
      dy=Math.pow(delta,0.92);
      const scale=Math.max(0.92,1-dy/3000);
      sheetPn.style.transform=`translate3d(0,${dy}px,0) scale(${scale})`;
      sheetBd.style.opacity=String(Math.max(0,1-dy/400));
    }
  },{passive:true});

  const endSheetDrag=()=>{
    if(!dragging)return;
    dragging=false;
    sheetEl.classList.remove("dragging");
    if(dy>120){
      closeSheet();
    }else{
      sheetPn.style.transform="";
      sheetBd.style.opacity="";
      shT=setTimeout(()=>document.body.classList.add("sheeted"),400);
    }
    y0=0;dy=0;
  };
  sheetPn.addEventListener("touchend",endSheetDrag,{passive:true});

})();

const V=$("#v"),EMB=$("#emb"),P=$("#player"),CTL=$("#ctl");let list=[],idx=0,idle,saveT=0,hlsInstance=null,playerMode="m3u8";
const fmt=s=>{s=Math.max(0,s|0);const h=s/3600|0,m=(s%3600)/60|0;return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s%60).padStart(2,"0")};
function toast(t,ms=2500){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),ms)}

async function openPlayer(l,i){
  list=l;idx=i;

function startEmbedInPlayer(it){
  playerMode="embed";
  P.classList.add("embed-mode");
  P.classList.remove("idle");
  CTL.classList.remove("hide");
  clearTimeout(idle);
  if(hlsInstance){hlsInstance.destroy();hlsInstance=null}
  V.pause();V.style.display="none";
  let url=it.embed;
  if((!url||url.includes("streamc.xyz"))&&it.m3u8)url=`https://player.phimapi.com/player/?url=${encodeURIComponent(it.m3u8)}`;
  EMB.style.display="block";EMB.src=url||"about:blank";
  toast("Chế độ VIP • Bấm nút ✕ góc trái trên để đóng");

async function startNativeVideoM3u8(it,resumeSec){
  const cleanUrl=await getCleanM3u8BlobUrl(it.m3u8);
  V.src=cleanUrl||it.m3u8;
  V.onloadedmetadata=()=>{
    if(resumeSec>10&&resumeSec<V.duration-20){V.currentTime=resumeSec;toast("Tiếp tục từ "+fmt(resumeSec))}
    else toast("Đang phát Tập "+it.epName+" (Đã lọc QC)");
  };
  try{await V.play()}catch{}
}

async function loadItem(){
  const it=list[idx];if(!it)return;
  $("#pt").textContent=`${it.title}${it.epName?" · Tập "+it.epName:""}`;
  toast("Đang nạp luồng siêu tốc…",4000);
  const pr=store.get("prog",{})[it.identifier];
  const resumeSec=it.resumeTime||((pr&&pr.eIdx===it.eIdx&&pr.sIdx===it.sIdx&&pr.t>10)?pr.t:0);

  if(list[idx+1]?.m3u8)setTimeout(()=>getCleanM3u8BlobUrl(list[idx+1].m3u8),2000);

  if(playerMode==="embed"||(!it.m3u8&&it.embed)){
    startEmbedInPlayer(it);
    save();
    return;
  }

  P.classList.remove("embed-mode");
  EMB.src="about:blank";EMB.style.display="none";
  V.style.display="block";

  if(typeof Hls!=="undefined"&&Hls.isSupported()){
    if(hlsInstance)hlsInstance.destroy();
    hlsInstance = new Hls({
      loader:CleanHlsLoader||Hls.DefaultConfig.loader,
      startFragPrefetch:true,
      maxBufferLength:20,
      maxMaxBufferLength:40,
      manifestLoadingTimeOut:8000,
      fragLoadingTimeOut:10000
    });
    hlsInstance.loadSource(it.m3u8);
    hlsInstance.attachMedia(V);
    hlsInstance.on(Hls.Events.MANIFEST_PARSED,()=>{
      if(resumeSec>10){V.currentTime=resumeSec;toast("Tiếp tục từ "+fmt(resumeSec))}
      else toast("Đang phát Tập "+it.epName+" (Đã lọc QC)");
      V.play().catch(()=>{});
    });
    hlsInstance.on(Hls.Events.ERROR,(_,data)=>{
      if(data.fatal){
        if(data.type===Hls.ErrorTypes.MEDIA_ERROR){
          hlsInstance.recoverMediaError();
        }else if(V.canPlayType("application/vnd.apple.mpegurl")){
          hlsInstance.destroy();hlsInstance=null;
          startNativeVideoM3u8(it,resumeSec);
        }else if(it.embed){
          startEmbedInPlayer(it);
        }else{
          toast("Luồng phim hiện tại bị lỗi, hãy đổi Server khác.");
        }
      }
    });
  }else if(V.canPlayType("application/vnd.apple.mpegurl")){
    await startNativeVideoM3u8(it,resumeSec);
  }else if(it.embed){
    startEmbedInPlayer(it);
  }
  wake();
}

function save(){
  const it=list[idx];if(!it)return;
  const p=store.get("prog",{});
  p[it.identifier]={
    t:playerMode==="m3u8"?V.currentTime:(it.resumeTime||15),
    d:playerMode==="m3u8"?(V.duration||0):0,
    title:it.title,
    epName:it.epName,
    img:it.img,
    providerId:it.providerId,
    slug:it.slug,
    sIdx:it.sIdx,
    eIdx:it.eIdx,
    u:Date.now()
  };
  store.set("prog",p);
}
function closePlayer(){
  save();
  clearTimeout(idle);
  if(hlsInstance){hlsInstance.destroy();hlsInstance=null}
  V.pause();V.removeAttribute("src");V.load();
  EMB.src="about:blank";EMB.style.display="none";
  P.style.transform="";P.style.borderRadius="";
  P.classList.remove("show","idle","embed-mode","dragging");
  CTL.classList.remove("hide");
  applyCfg();
  if(document.fullscreenElement||document.webkitFullscreenElement){
    (document.exitFullscreen||document.webkitExitFullscreen)?.call(document);
  }
  if(!document.body.classList.contains("sheeted")&&(tab=="home"||tab=="lib"))go(tab);
}
function hideControls(){
  clearTimeout(idle);
  P.classList.add("idle");
  CTL.classList.add("hide");
}
function wake(){
  P.classList.remove("idle");
  CTL.classList.remove("hide");
  clearTimeout(idle);
  if(!V.paused&&playerMode==="m3u8")idle=setTimeout(hideControls,3500);
}
$("#pc").onclick=e=>{e.stopPropagation();closePlayer()};
$("#pp").onclick=e=>{e.stopPropagation();V.paused?V.play():V.pause();wake()};

/* Kéo vuốt màn hình player xuống để thu nhỏ mượt mà */
let pDragging=false;
(()=>{
  let py0=0,pdy=0;
  P.addEventListener("touchstart",e=>{
    if(!document.fullscreenElement&&e.touches[0].clientY<130){
      py0=e.touches[0].clientY;
      pdy=0;
      pDragging=false;
    }else py0=0;
  },{passive:true});

  P.addEventListener("touchmove",e=>{
    if(!py0)return;
    const delta=e.touches[0].clientY-py0;
    if(delta>10){
      pDragging=true;
      P.classList.add("dragging");
      pdy=Math.pow(delta,0.92);
      const sc=Math.max(0.80,1-pdy/1400);
      P.style.transform=`translate3d(0,${pdy}px,0) scale(${sc})`;
      P.style.borderRadius=Math.min(42,pdy/3.2)+"px";
    }
  },{passive:true});

  const endPlayerDrag=()=>{
    if(!pDragging)return;
    P.classList.remove("dragging");
    if(pdy>110){
      closePlayer();
    }else{
      P.style.transform="";
      P.style.borderRadius="";
    }
    setTimeout(()=>{pDragging=false},50);
    py0=0;pdy=0;
  };
  P.addEventListener("touchend",endPlayerDrag,{passive:true});
  P.addEventListener("touchcancel",endPlayerDrag,{passive:true});
})();

/* Tap 1 lần vào màn hình để ẩn các nút chức năng, tap lại lần nữa để hiện lại */
(()=>{

  P.addEventListener("pointerdown",e=>{
    tx=e.clientX;ty=e.clientY;moved=false;
  },{passive:true});
  P.addEventListener("pointermove",e=>{
    if(Math.abs(e.clientX-tx)>10||Math.abs(e.clientY-ty)>10)moved=true;
  },{passive:true});
  P.addEventListener("click",e=>{
    if(moved||pDragging)return;
    if(e.target.closest("button,input,.bot")){
      wake();
      return;
    }
    if(CTL.classList.contains("hide")||P.classList.contains("idle")){
      wake();
    }else{
      hideControls();
    }
  });
})();

#seek{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:28px;margin:0;background:transparent;--p:0%}
#seek::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,#fff var(--p),rgba(255,255,255,.28) var(--p))}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;margin-top:-5.5px;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.55)}
#seek::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.28)}
#seek::-moz-range-progress{height:4px;border-radius:2px;background:#fff}
#seek::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:#fff}
.toast{top:calc(var(--sat) + 76px);bottom:auto;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;font-size:13px;padding:8px 14px;background:rgba(28,28,32,.6);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}`;
const st=document.createElement("style");st.textContent=css;document.head.appendChild(st);

const PLAY='<svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>',
PAUSE='<svg viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>',
FS='<svg viewBox="0 0 24 24" style="fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
const pp=$("#pp"),fsb=$("#fs"),seek=$("#seek");
pp.className="pb";pp.setAttribute("aria-label","Phát / Tạm dừng");
fsb.className="pb";fsb.setAttribute("aria-label","Toàn màn hình");fsb.innerHTML=FS;
const tcur=document.createElement("span"),tdur=document.createElement("span");
tcur.className=tdur.className="tm";tcur.textContent=tdur.textContent="0:00";
seek.before(tcur);seek.after(tdur);
const setPP=()=>{pp.innerHTML=V.paused?PLAY:PAUSE};setPP();
V.addEventListener("play",()=>{setPP();wake()});
V.addEventListener("pause",()=>{setPP();wake()});
V.addEventListener("timeupdate",()=>{if(!V.duration)return;tcur.textContent=fmt(V.currentTime);tdur.textContent=fmt(V.duration);seek.style.setProperty("--p",(V.currentTime/V.duration*100)+"%")});
seek.addEventListener("input",e=>seek.style.setProperty("--p",(e.target.value/10)+"%"));

/* Cắt chữ "Tập" thừa trong tên tập (hết lỗi "Tập Tập 01") */
if(typeof fetchProviderMovieDetail==="function"){
  const orig=fetchProviderMovieDetail;
  fetchProviderMovieDetail=async(...a)=>{
    const r=await orig(...a);
    (r.servers||[]).forEach(s=>(s.server_data||[]).forEach(ep=>{
      const n=String(ep.name??"").normalize("NFC").replace(/^\s*t[ậa]p\s*/i,"");
      if(n)ep.name=n;
    }));
    return r;
  };
}
})();

/* ===== Toàn màn hình thực thụ (Native iOS Video Fullscreen + Standard Fullscreen API) ===== */
(()=>{
const st=document.createElement("style");
st.textContent=`#player.rot{inset:auto;top:0;left:0;width:100vh;height:100vw;width:100dvh;height:100dvw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg);transform:translateX(100dvw) rotate(90deg);border-radius:0!important;background:#000}
#player.rot .ctl{padding:20px calc(var(--sab) + 20px) 20px calc(var(--sat) + 20px)}`;
document.head.appendChild(st);
const fsb=$("#fs"),pq=matchMedia("(orientation:portrait)");
let fsOn=false;
const real=()=>document.fullscreenElement||document.webkitFullscreenElement||V.webkitDisplayingFullscreen;
function applyRot(){
  const need=fsOn&&pq.matches&&!V.webkitDisplayingFullscreen;
  if(need===P.classList.contains("rot"))return;
  P.style.transition="none";P.classList.toggle("rot",need);void P.offsetWidth;P.style.transition="";
}
function enterFS(){
  /* Ưu tiên số 1 trên iPhone/iOS: vào thẳng Native Fullscreen của hệ thống (ẩn toàn bộ thanh trạng thái & Dynamic Island) */
  if(V.webkitEnterFullscreen&&(!P.requestFullscreen&&!P.webkitRequestFullscreen)){
    try{
      V.webkitEnterFullscreen();
      return;
    }catch{}
  }
  /* Trên Android / PC / iPad hỗ trợ Fullscreen API trên thẻ #player */
  const f=P.requestFullscreen||P.webkitRequestFullscreen;
  if(f){
    fsOn=true;
    Promise.resolve(f.call(P)).then(()=>{
      try{screen.orientation?.lock?.("landscape")?.catch?.(()=>{})}catch{}
      applyRot();setTimeout(applyRot,350);
    }).catch(()=>{
      if(V.webkitEnterFullscreen){
        try{fsOn=false;V.webkitEnterFullscreen();return}catch{}
      }
      applyRot();
    });
    return;
  }
  if(V.webkitEnterFullscreen){
    try{V.webkitEnterFullscreen();return}catch{}
  }
  fsOn=true;
  applyRot();
}
function exitFS(){
  fsOn=false;
  try{screen.orientation?.unlock?.()}catch{}
  try{
    if(document.fullscreenElement||document.webkitFullscreenElement){
      (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    }else if(V.webkitDisplayingFullscreen&&V.webkitExitFullscreen){
      V.webkitExitFullscreen();
    }
  }catch{}
  applyRot();
}
fsb.onclick=e=>{
  e.stopPropagation();
  if(fsOn||real())exitFS();
  else enterFS();
};
V.addEventListener("webkitbeginfullscreen",()=>{fsOn=true});
V.addEventListener("webkitendfullscreen",()=>{fsOn=false;applyRot();wake()});
pq.addEventListener("change",applyRot);
addEventListener("resize",applyRot);addEventListener("orientationchange",applyRot);
["fullscreenchange","webkitfullscreenchange"].forEach(t=>document.addEventListener(t,()=>{if(fsOn&&!real())exitFS()}));
["touchstart","touchmove"].forEach(t=>P.addEventListener(t,e=>{if(P.classList.contains("rot"))e.stopImmediatePropagation()},{capture:true,passive:true}));
const closeOrig=closePlayer;
closePlayer=function(){exitFS();closeOrig()};
})();
